<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Project Radar</title>
<style>
:root{color-scheme:dark;--bg:#0b0f14;--panel:#111821;--line:#263140;--text:#eef3f8;--muted:#93a1b3;--green:#6ee7ad;--blue:#8bc4ff;--purple:#c4b5fd;--amber:#f6d783}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,Pretendard,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
a{color:inherit}button,input,select{font:inherit}header{position:sticky;top:0;z-index:10;background:rgba(11,15,20,.96);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.head,.tabs,.filters,main{max-width:1220px;margin:auto}.head{padding:18px 18px 12px;display:flex;justify-content:space-between;gap:18px;align-items:flex-end}.eyebrow{font-size:11px;letter-spacing:.14em;color:var(--green);font-weight:800}.head h1{font-size:25px;margin:5px 0 0}.meta{font-size:12px;color:var(--muted);text-align:right}
.tabs{padding:0 18px 10px;display:flex;gap:8px}.tab{border:1px solid var(--line);background:#111821;color:#a7b3c0;padding:9px 13px;border-radius:10px;font-weight:750;cursor:pointer}.tab.on{background:#173228;border-color:#36735a;color:#c5f7df}.tab.general.on{background:#221d35;border-color:#5e4b89;color:#ddd1ff}
.filters{padding:0 18px 14px;display:flex;gap:7px;flex-wrap:wrap}.chip,.control{border:1px solid var(--line);border-radius:9px;background:#111821;color:#b9c4d2;padding:7px 10px}.chip{cursor:pointer}.chip.on{background:#153329;border-color:#3e8569;color:#bff5db}.search{flex:1;min-width:220px}
main{padding:18px;display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:16px}.panel{border:1px solid var(--line);border-radius:14px;background:var(--panel);overflow:hidden}.panelhead{padding:14px 15px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}.panelhead h2{font-size:15px;margin:0}.panelhead span{font-size:12px;color:var(--muted)}
.cards{list-style:none;margin:0;padding:0}.card{padding:15px;border-bottom:1px solid var(--line);display:grid;grid-template-columns:54px 1fr;gap:12px}.card:last-child{border:0}.score{height:54px;border:1px solid #355646;border-radius:10px;background:#0d231a;text-align:center;padding-top:8px}.score strong{font-size:20px;color:var(--green);display:block;line-height:1}.score small{font-size:9px;color:#8ecfb1}.title{font-size:16px;line-height:1.45;font-weight:760;margin:0}.title a{text-decoration:none}.title a:hover{text-decoration:underline}.badges{display:flex;gap:5px;flex-wrap:wrap;margin:7px 0}.badge{font-size:11px;border:1px solid #344153;border-radius:999px;padding:3px 7px;color:#afbdcd}.badge.crypto{color:#cbbdff;border-color:#594779}.badge.early{color:#baf4d6;border-color:#37664f}.badge.rising{color:#f8dea0;border-color:#6d5a25}.excerpt{font-size:13px;color:#c1ccd8;line-height:1.58;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}.why{font-size:11px;color:#8fa0b2;margin-top:8px}.links{display:flex;gap:12px;margin-top:9px}.links a{font-size:12px;color:var(--blue);text-decoration:none}.links a:hover{text-decoration:underline}
.side{display:flex;flex-direction:column;gap:14px}.info{padding:14px}.info h3{margin:0 0 8px;font-size:14px}.info p{font-size:12px;color:#a8b4c3;line-height:1.6;margin:6px 0}.note{border-left:3px solid #47745f;padding-left:10px}.query{padding:11px 13px;border-bottom:1px solid var(--line)}.query:last-child{border:0}.query b{font-size:12px}.query code{display:block;color:#9eacbb;font-size:10px;line-height:1.45;margin:6px 0;word-break:break-word}.query a{font-size:11px;color:var(--blue);text-decoration:none}.empty{padding:38px 16px;color:var(--muted);text-align:center}
@media(max-width:900px){main{grid-template-columns:1fr}.side{order:-1}.queries{display:none}.head{align-items:flex-start}.meta{text-align:left}}
@media(max-width:560px){.head{display:block;padding:14px 12px 10px}.tabs,.filters,main{padding-left:12px;padding-right:12px}.meta{margin-top:6px}.tabs{overflow-x:auto}.tab{white-space:nowrap}.card{grid-template-columns:46px 1fr;padding:13px 11px}.score{height:48px;padding-top:7px}.score strong{font-size:17px}.title{font-size:15px}}
</style>
</head>
<body>
<header>
  <div class="head"><div><div class="eyebrow">UNLISTED · NOINDEX</div><h1>Project Radar</h1></div><div class="meta">2026-09-19 · Crypto Alpha 6 / General 6</div></div>
  <div class="tabs"><button class="tab on" data-mode="crypto">₿ Crypto Alpha</button><button class="tab general" data-mode="general">🧪 General Experiments</button></div>
  <div class="filters"><span id="cats" style="display:contents"></span><select id="stage" class="control"><option value="all">모든 단계</option><option>EARLY</option><option>RISING</option></select><input id="q" class="control search" placeholder="프로젝트·메커니즘 검색"></div>
</header>
<main>
<section class="panel"><div class="panelhead"><h2 id="feedTitle">₿ Crypto Alpha</h2><span id="count">0건</span></div><ol class="cards" id="cards"></ol></section>
<aside class="side">
<section class="panel info"><h3 id="infoTitle">Crypto Alpha</h3><p class="note" id="infoText"></p><p>이 주소는 검색엔진 색인을 차단했습니다. 링크를 직접 아는 사람만 접근하도록 별도 메뉴·사이트맵 연결 없이 운영합니다.</p></section>
<section class="panel queries"><div class="panelhead"><h2>추천 X Latest 검색</h2><span>직접 확인</span></div><div id="queries"></div></section>
</aside>
</main>
<script>
const DATA=[{"radar_mode":"crypto","category":"mechanism","alpha_score":89,"alpha_stage":"EARLY","title":"Aequus — asset-class-specific Dynamic Bonding Curve presets","excerpt":"Meteora DBC + DAMM v2 기반. 밈코인용 단일 곡선이 아니라 토큰화 주식·RWA 등 자산군마다 다른 가격곡선·수수료·RateLimiter 설정을 제공하는 프리셋 마켓.","url":"https://github.com/alamuoyeemmanuel7-create/aequus","project_url":"https://aequus-web.vercel.app","signals":["crypto-context","mechanism","token-mechanic"],"source":"GitHub"},{"radar_mode":"crypto","category":"mechanism","alpha_score":83,"alpha_stage":"EARLY","title":"PoPo — bonding curve → concentrated liquidity → creator fee loop","excerpt":"밈/IP 코인이 bonding curve를 졸업하면 집중유동성 풀로 이동. tiered swap fee, 유료 영상, 자동 buyback-and-burn, 온체인 referral을 한 구조로 묶은 실험.","url":"https://github.com/PoPoMeMe/PoPo","project_url":"https://github.com/PoPoMeMe/PoPo","signals":["crypto-context","mechanism","token-mechanic"],"source":"GitHub"},{"radar_mode":"crypto","category":"token","alpha_score":82,"alpha_stage":"EARLY","title":"Stakd — coins backed by their own leveraged portfolio","excerpt":"Robinhood Chain 위에서 코인 자체가 레버리지 포트폴리오를 보유하고, 수익이 buyback & burn 재원으로 돌아가는 구조. Uniswap v4 hook과 잠금 유동성을 결합.","url":"https://github.com/Stakdofficial/Stakd","project_url":"https://www.stakd.tech","signals":["crypto-context","token-mechanic"],"source":"GitHub"},{"radar_mode":"crypto","category":"token","alpha_score":81,"alpha_stage":"EARLY","title":"Argus — Uniswap v4 taxes + USDC revenue distribution","excerpt":"Arc에서 permissionless token launch를 하되 출시 시점에 고정된 매수/매도세와 native USDC 수익분배를 Uniswap v4 hook으로 구현.","url":"https://github.com/arguspad/argus-world","project_url":"https://github.com/arguspad/argus-world","signals":["crypto-context","token-mechanic"],"source":"GitHub"},{"radar_mode":"crypto","category":"market","alpha_score":71,"alpha_stage":"EARLY","title":"GenLayer Verifiable Consensus — onchain moderation / prediction / oracle","excerpt":"콘텐츠 판정, 예측시장 결과, 다중소스 오라클 중앙값을 프론트가 아니라 온체인 Intelligent Contract의 검증 가능한 합의로 결정.","url":"https://github.com/Artem1981777/genlayer-verifiable-consensus","project_url":"https://artem1981777.github.io/genlayer-verifiable-consensus/","signals":["crypto-context","weird-market"],"source":"GitHub"},{"radar_mode":"crypto","category":"autonomous","alpha_score":62,"alpha_stage":"EARLY","title":"GenLayer Sentinel — autonomous circuit breaker + whitehat escrow","excerpt":"GenVM Intelligent Contract를 이용해 프로토콜 이상상황을 감지하고 자동 circuit breaker와 whitehat escrow를 결합하려는 자율 보안 실험.","url":"https://github.com/olasmi02/genlayer-sentinel","project_url":"https://github.com/olasmi02/genlayer-sentinel","signals":["crypto-context","autonomous"],"source":"GitHub"},{"radar_mode":"general","category":"other","alpha_score":78,"alpha_stage":"EARLY","title":"Seal — 가족에게 사후 공개되는 편지·비밀번호","excerpt":"하드웨어 키를 각 가족에게 배정하고, 작성자가 사망한 뒤에만 암호화된 비밀번호·사진·음성메모가 열리도록 설계한 iOS 프로젝트.","url":"https://news.ycombinator.com/item?id=49763311","project_url":"https://github.com/jasonepage/Seal","signals":["creator-language","unusual-rule"],"source":"Show HN"},{"radar_mode":"general","category":"other","alpha_score":76,"alpha_stage":"RISING","title":"LiveWorld — 전 세계 24/7 YouTube 카메라를 한 지구본에","excerpt":"항상 켜져 있는 공개 YouTube 라이브카메라를 전 세계 지도/지구본 한 화면에서 돌아다니며 보는 인터넷 프로젝트.","url":"https://news.ycombinator.com/item?id=49762099","project_url":"https://liveworld.info/","signals":["live-or-persistent","unusual-rule"],"source":"Show HN"},{"radar_mode":"general","category":"art","alpha_score":66,"alpha_stage":"EARLY","title":"Majority — 짧게 듣고 사람들이 직접 음악 순위 결정","excerpt":"새 음악을 길게 듣지 않고 Like/Pass로 빠르게 맛본 뒤, Apple Music·Spotify 알고리즘이 아니라 실제 사용자 투표가 리더보드를 만드는 구조.","url":"https://news.ycombinator.com/item?id=49753990","project_url":"https://majority-eight.vercel.app/","signals":["participation"],"source":"Show HN"},{"radar_mode":"general","category":"other","alpha_score":65,"alpha_stage":"EARLY","title":"AgentPostage — 에이전트가 실제 종이우편을 보냄","excerpt":"신용카드 이의제기, 체육관 해지, 임대계약 통지처럼 현실에서 종이우편이 필요한 일을 에이전트가 실제 우편으로 보내게 만든 서비스.","url":"https://news.ycombinator.com/item?id=49754184","project_url":"https://agentpostage.com/","signals":["creator-language","unusual-rule"],"source":"Show HN"},{"radar_mode":"general","category":"web","alpha_score":64,"alpha_stage":"EARLY","title":"Neon Roads — 손·휴대폰을 브라우저 게임 컨트롤러로","excerpt":"SkyRoads 스타일 브라우저 게임에 웹캠 손동작 컨트롤과 QR로 연결한 휴대폰 WebRTC 게임패드를 붙인 실험.","url":"https://news.ycombinator.com/item?id=49754359","project_url":"https://neonroads.itch.io/neon-roads","signals":["creator-language","unusual-rule"],"source":"Show HN"},{"radar_mode":"general","category":"science","alpha_score":57,"alpha_stage":"EARLY","title":"Swormhörn — 매미떼 동기화를 연주하는 신시사이저","excerpt":"ESP32-S3와 압력센서, Kuramoto 모델을 이용해 개별 매미와 무리의 동기화 에너지를 직접 연주하는 one-of-one 악기.","url":"https://news.ycombinator.com/item?id=49762635","project_url":"https://www.youtube.com/watch?v=GHiStriaaso","signals":["unusual-rule"],"source":"Show HN"}];
const QUERIES=[
["Onchain Primitive",'"new onchain primitive" OR "economic primitive" crypto min_faves:2 -filter:replies'],
["Mechanism Design",'"mechanism design" crypto min_faves:3 -filter:replies'],
["Weird Markets",'"autonomous market" OR "attention market" crypto min_faves:2 -filter:replies'],
["Coordination",' "coordination game" onchain min_faves:2 -filter:replies'],
["Fully Onchain",'"fully onchain" launched min_faves:2 -filter:replies'],
["Token Mechanics",'"new token mechanism" OR "experimental tokenomics" min_faves:2 -filter:replies'],
["ICM",'"internet capital markets" min_faves:2 -filter:replies'],
["Newly shipped",'"just launched" onchain min_faves:2 -filter:replies']
];
const CC={crypto:{all:"전체",mechanism:"⚙️ Mechanism",token:"🪙 Token",market:"📈 Markets",autonomous:"🧠 Autonomous",other:"기타"},general:{all:"전체",other:"✨ 기타",art:"🎨 예술",web:"🧰 웹",science:"🧪 과학"}};
let mode="crypto",cat="all";
const $=s=>document.querySelector(s), cards=$("#cards"), cats=$("#cats"), stage=$("#stage"), q=$("#q");
function renderCats(){cats.innerHTML="";for(const [k,v] of Object.entries(CC[mode])){const b=document.createElement("button");b.className="chip"+(k===cat?" on":"");b.textContent=v;b.onclick=()=>{cat=k;renderCats();render()};cats.appendChild(b)}}
function render(){let rows=DATA.filter(x=>x.radar_mode===mode&&(cat==="all"||x.category===cat)&&(stage.value==="all"||x.alpha_stage===stage.value));const term=q.value.trim().toLowerCase();if(term)rows=rows.filter(x=>(x.title+" "+x.excerpt+" "+x.signals.join(" ")).toLowerCase().includes(term));rows.sort((a,b)=>b.alpha_score-a.alpha_score);cards.innerHTML="";$("#count").textContent=rows.length+"건";$("#feedTitle").textContent=mode==="crypto"?"₿ Crypto Alpha":"🧪 General Experiments";$("#infoTitle").textContent=mode==="crypto"?"Crypto Alpha":"General Experiments";$("#infoText").innerHTML=mode==="crypto"?"<b>코인 홍보가 아니라</b> primitive, mechanism, 이상한 시장, token mechanics처럼 구조 자체가 실험인 프로젝트를 찾습니다.":"돈·관계·게임·예술·과학·웹 등에서 규칙 자체가 이상하고 재미있는 공개 실험을 찾습니다.";if(!rows.length){cards.innerHTML='<div class="empty">조건에 맞는 후보가 없습니다.</div>';return}for(const x of rows){const li=document.createElement("li");li.className="card";li.innerHTML='<div class="score"><strong>'+x.alpha_score+'</strong><small>'+ (mode==="crypto"?"CRYPTO":"ALPHA") +'</small></div><div><h3 class="title"><a target="_blank" rel="noopener" href="'+x.url+'">'+x.title+'</a></h3><div class="badges"><span class="badge '+(mode==="crypto"?"crypto":"")+'">'+(CC[mode][x.category]||x.category)+'</span><span class="badge '+x.alpha_stage.toLowerCase()+'">'+x.alpha_stage+'</span><span class="badge">'+x.source+'</span></div><div class="excerpt">'+x.excerpt+'</div><div class="why">포착 이유 · '+x.signals.join(" · ")+'</div><div class="links"><a target="_blank" rel="noopener" href="'+x.url+'">원문 ↗</a>'+(x.project_url?'<a target="_blank" rel="noopener" href="'+x.project_url+'">프로젝트 ↗</a>':'')+'</div></div>';cards.appendChild(li)}}
document.querySelectorAll("[data-mode]").forEach(b=>b.onclick=()=>{mode=b.dataset.mode;cat="all";document.querySelectorAll("[data-mode]").forEach(x=>x.classList.toggle("on",x===b));renderCats();render()});stage.onchange=render;q.oninput=render;
$("#queries").innerHTML=QUERIES.map(([n,s])=>'<div class="query"><b>'+n+'</b><code>'+s+'</code><a target="_blank" rel="noopener" href="https://x.com/search?q='+encodeURIComponent(s)+'&src=typed_query&f=live">X Latest 열기 ↗</a></div>').join("");
renderCats();render();
</script>

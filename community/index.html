<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>커뮤니티 | 픽마이카</title><link rel="stylesheet" href="../assets/tokens.css"><link rel="stylesheet" href="../assets/base.css"><link rel="stylesheet" href="./community.css"></head>
<body><a class="skip-link" href="#content">본문으로</a>
<header class="db-header"><div class="db-shell"><a class="db-logo" href="https://peekmycar.com/"><img class="site-brand-image" src="../assets/brand/peekmycar-logo.png" width="180" height="60" alt="픽마이카"></a><nav class="db-nav" id="sitePrimaryNav" aria-label="주 메뉴"><a href="https://peekmycar.com/cars/">찾기</a><a href="https://peekmycar.com/compare/">비교</a><a href="https://peekmycar.com/rankings/">순위</a><a href="https://peekmycar.com/recalls/">리콜</a><a href="./" aria-current="page">커뮤니티</a></nav><button class="site-nav-toggle" type="button" aria-controls="sitePrimaryNav" aria-expanded="false" aria-label="메뉴 열기">☰</button></div></header>
<main class="db-shell community-main" id="content">
<div class="community-heading"><div><h1>커뮤니티</h1><p>차를 고를 때 궁금했던 것, 타면서 알게 된 것.</p></div><div class="account-actions"><span id="accountName"></span><button id="login" type="button">구글 로그인</button><button id="logout" type="button" hidden>로그아웃</button></div></div>
<p class="service-notice" id="serviceNotice" role="status" hidden></p>
<section id="boardView" aria-label="글 목록">
<form class="board-filters" id="filterForm"><div class="vehicle-search"><label for="vehicleQuery">차종 검색</label><input type="search" id="vehicleQuery" placeholder="차 이름으로 찾기" autocomplete="off" aria-controls="vehicleResults" aria-expanded="false"><div id="vehicleResults" class="vehicle-results" aria-label="차종 검색 결과" hidden></div><div id="selectedVehicle" hidden></div></div><label>글 검색<input type="search" id="postQuery" placeholder="제목·내용 검색" maxlength="100"></label><button type="button" id="writePost" class="primary">글쓰기</button></form>
<div class="board-tabs" role="group" aria-label="글 유형"><button type="button" data-kind="free" aria-pressed="true">자유게시판</button><button type="button" data-kind="question" aria-pressed="false">질문</button><button type="button" data-kind="review" aria-pressed="false">실사용 후기</button></div>
<div class="board-context"><p id="boardName">모든 차종</p><span>최신순</span></div><p id="listStatus" role="status">글을 불러오는 중입니다.</p><ul id="posts" class="post-list"></ul><button id="loadMore" type="button" hidden>더 보기</button>
</section>
<section id="postView" hidden aria-label="글 상세"><button type="button" id="backToList">목록</button><article id="postContent"></article><div id="postActions" class="post-actions"></div><section class="comments"><h2>댓글</h2><p id="commentStatus" role="status"></p><ul id="comments"></ul><form id="commentForm"><label>댓글<textarea name="body" maxlength="2000" rows="3" required placeholder="질문에 답하거나 경험을 남겨주세요."></textarea></label><button class="primary" type="submit">댓글 등록</button></form></section></section>
<p id="actionStatus" class="action-status" role="status" aria-live="polite"></p>
<div class="community-footnote"><span>회원이 작성한 경험입니다. 공식 신고 사양과 다를 수 있습니다.</span><a href="https://peekmycar.com/contact/">문의</a></div>
</main>
<dialog id="editor"><form id="postForm"><div class="dialog-heading"><h2 id="editorTitle">글쓰기</h2><button type="button" data-close="editor" aria-label="글쓰기 닫기">닫기</button></div><fieldset><legend>게시판</legend><label class="radio-label"><input type="radio" name="kind" value="free" checked>자유게시판</label><label class="radio-label"><input type="radio" name="kind" value="question">질문</label><label class="radio-label"><input type="radio" name="kind" value="review">실사용 후기</label></fieldset><label>제목<input name="title" minlength="4" maxlength="100" required placeholder="제목을 입력하세요"></label><label>내용<textarea name="body" minlength="10" maxlength="10000" rows="8" required placeholder="나누고 싶은 이야기를 적어주세요"></textarea></label><div class="photo-field"><label for="postPhotos">사진 첨부 <span class="form-note">최대 5장 · 장당 10MB · JPG, PNG, WebP</span></label><input id="postPhotos" type="file" accept="image/jpeg,image/png,image/webp" multiple><ul id="photoPreviews" class="photo-previews"></ul><p id="photoStatus" role="status"></p></div><p class="form-note">연락처·번호판 등 개인정보, 광고·매물 홍보는 올리지 마세요.</p><p id="editorStatus" role="status"></p><button class="primary" type="submit">등록하기</button></form></dialog>
<dialog id="profile"><form id="profileForm"><div class="dialog-heading"><h2>닉네임 설정</h2><button type="button" data-close="profile">닫기</button></div><label>공개 닉네임<input name="nickname" minlength="2" maxlength="20" required autocomplete="nickname"></label><p class="form-note">구글 이름과 이메일은 글에 표시하지 않습니다.</p><label class="check-label"><input type="checkbox" required>차량 경험을 공유하며 광고·비방·개인정보를 게시하지 않겠습니다.</label><p id="profileStatus" role="status"></p><button class="primary" type="submit">저장</button></form></dialog>
<dialog id="report"><form id="reportForm"><div class="dialog-heading"><h2>신고하기</h2><button type="button" data-close="report">닫기</button></div><label>사유<select name="reason" required><option value="spam">광고·도배</option><option value="abuse">욕설·비방</option><option value="privacy">개인정보 노출</option><option value="other">그 외</option></select></label><label>설명<textarea name="detail" maxlength="500" rows="3"></textarea></label><p id="reportStatus" role="status"></p><button class="primary" type="submit">신고 접수</button></form></dialog>
<script src="../assets/header-nav.js"></script><script type="module" src="./app.js"></script><noscript>글과 댓글을 보려면 자바스크립트를 켜주세요.</noscript></body></html>

name: interior-public-prices-refresh

on:
  schedule:
    - cron: '27 19 * * 1'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: interior-public-prices-refresh
  cancel-in-progress: false

jobs:
  refresh:
    if: github.ref == 'refs/heads/main' && vars.INTERIOR_PUBLIC_PRICES_REFRESH_ENABLED == 'true'
    runs-on: ubuntu-latest
    env:
      DATA_GO_KR_SERVICE_KEY: ${{ secrets.DATA_GO_KR_SERVICE_KEY }}
      OUT_FILE: interior-cost-core/v6-review/data/public-unit-prices.json
      PUBLIC_PRICE_FILE: interior-cost-core/v6-review/data/public-unit-prices.json
      PPS_QUERY_DAYS: '550'
      PPS_MIN_PUBLISHED_ROWS: '5000'
      PPS_MAX_AGE_DAYS: '730'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify configuration
        run: |
          test -n "$DATA_GO_KR_SERVICE_KEY"
          test -f interior-cost-core/collect-pps-g2b-price-info.mjs
          test -f interior-cost-core/collect-pps-standard-market.mjs
          test -f interior-cost-core/v6-review/validate-public-unit-prices-ready-v6.mjs
          test -f interior-cost-core/fixtures/pps-g2b-standard-market.sample.json
          test -f "$OUT_FILE"
      - name: Verify current G2B collector contract
        run: node interior-cost-core/v6-review/validate-pps-g2b-collector-v6.mjs
      - name: Collect current PPS standard market unit prices
        run: node interior-cost-core/collect-pps-g2b-price-info.mjs
      - name: Validate collected public price snapshot
        run: node interior-cost-core/v6-review/validate-public-unit-prices-ready-v6.mjs
      - name: Guard repository diff
        run: |
          CHANGED="$(git diff --name-only)"
          if [ -n "$CHANGED" ] && [ "$CHANGED" != "$OUT_FILE" ]; then
            echo "Unexpected repository changes detected" >&2
            git diff --name-only >&2
            exit 1
          fi
      - name: Commit changed official snapshot only
        run: |
          if git diff --quiet -- "$OUT_FILE"; then
            echo "Official unit price snapshot unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "$OUT_FILE"
          git commit -m "Refresh current official interior reference unit prices"
          git pull --rebase origin main
          git push origin HEAD:main

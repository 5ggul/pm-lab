name: interior-p1-compare-density-qa

on:
  push:
    branches:
      - interior-p1-compare-density
    paths:
      - 'docs/interior-cost-preview/quote-compare/**'
      - 'docs/interior-cost-preview/assets/quote-compare-compact-v1.js'
      - 'tests/interior-p1-compare-density/**'
      - '.github/workflows/interior-p1-compare-density-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: interior-p1-compare-density-qa-\${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout candidate branch
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Syntax check compact compare
        run: |
          node --check docs/interior-cost-preview/assets/quote-compare-compact-v1.js
          node --check tests/interior-p1-compare-density/ci-browser-qa.cjs

      - name: Install isolated Playwright Chromium
        run: |
          mkdir -p /tmp/interior-p1-density-ci
          cd /tmp/interior-p1-density-ci
          npm init -y >/dev/null 2>&1
          npm install --no-audit --no-fund playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Start candidate static server
        run: |
          ln -sfn docs pm-lab
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/interior-p1-density-http.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4173/pm-lab/interior-cost-preview/quote-compare/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/interior-p1-density-http.log || true
          exit 1

      - name: Start ephemeral HTTPS quick tunnel
        run: |
          curl -fsSL --retry 5 --retry-delay 2 -o /tmp/cloudflared \
            https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64
          chmod +x /tmp/cloudflared
          /tmp/cloudflared tunnel --no-autoupdate --url http://127.0.0.1:4173 >/tmp/interior-p1-density-cloudflared.log 2>&1 &
          URL=''
          for i in $(seq 1 60); do
            URL=$(grep -Eo 'https://[-a-z0-9]+\.trycloudflare\.com' /tmp/interior-p1-density-cloudflared.log | head -n1 || true)
            if [ -n "$URL" ]; then break; fi
            sleep 1
          done
          if [ -z "$URL" ]; then cat /tmp/interior-p1-density-cloudflared.log || true; exit 1; fi
          echo "QA_BASE_URL=$URL" >> "$GITHUB_ENV"
          for i in $(seq 1 90); do
            if curl -fsS --connect-timeout 5 "$URL/pm-lab/interior-cost-preview/quote-compare/" >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/interior-p1-density-cloudflared.log || true
          exit 1

      - name: Run compact compare browser QA
        env:
          PLAYWRIGHT_MODULE: /tmp/interior-p1-density-ci/node_modules/playwright
          QA_RESULT_PATH: interior-p1-compare-density-qa.json
        run: node tests/interior-p1-compare-density/ci-browser-qa.cjs

      - name: Upload QA artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: interior-p1-compare-density-qa
          path: |
            interior-p1-compare-density-qa.json
            /tmp/interior-p1-density-http.log
            /tmp/interior-p1-density-cloudflared.log
          if-no-files-found: warn
          retention-days: 14

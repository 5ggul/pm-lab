name: interior-v33-photo-bootstrap
on:
  push:
    branches: [interior-v33-stratton-visual]
    paths:
      - 'interior-cost-core/bootstrap-v33-photos.mjs'
      - '.github/workflows/interior-v33-photo-bootstrap.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: interior-v33-photo-bootstrap
  cancel-in-progress: true
jobs:
  fetch-assets:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: interior-v33-stratton-visual
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Fetch licensed interior photos
        run: |
          node interior-cost-core/bootstrap-v33-photos.mjs
          test "$(find interior-cost-core/v33-assets -name '*.jpg' | wc -l)" -eq 8
          for f in interior-cost-core/v33-assets/*.jpg; do test "$(stat -c%s "$f")" -gt 30000; done
      - name: Commit photo assets to v33 source branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add interior-cost-core/v33-assets
          if git diff --cached --quiet; then echo 'Assets already current'; exit 0; fi
          git commit -m 'Add licensed interior photo assets for v33'
          git push origin HEAD:interior-v33-stratton-visual
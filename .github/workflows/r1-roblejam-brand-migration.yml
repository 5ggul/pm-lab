name: r1 roblejam brand migration
on:
  pull_request:
    paths:
      - '.github/workflows/r1-roblejam-brand-migration.yml'
permissions:
  contents: write
concurrency:
  group: r1-roblejam-brand-migration
  cancel-in-progress: false
jobs:
  rename:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'feat/r1-oreun-release-candidate'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      SOURCE_HEAD: ${{ github.event.pull_request.head.sha }}
      TARGET_BRANCH: feat/r1-oreun-release-candidate
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Rename public display text only
        run: |
          set -euo pipefail
          git fetch origin "$TARGET_BRANCH"
          test "$(git rev-parse FETCH_HEAD)" = "$SOURCE_HEAD"
          python3 - <<'PY'
          from pathlib import Path
          root=Path('apps/oreun')
          targets=[p for folder in ('app','components') for p in (root/folder).rglob('*') if p.is_file() and p.suffix in ('.ts','.tsx','.svg') and 'api' not in p.relative_to(root).parts]
          targets.append(root/'lib/regional-availability.ts')
          changed=[]
          for p in targets:
              text=p.read_text()
              new=text.replace('오름','로블잼')
              if p==root/'app/layout.tsx':
                  new=new.replace('alternateName: "Oreun"','alternateName: "RobleJam"')
              if new!=text:
                  p.write_text(new)
                  changed.append(str(p))
          assert len(changed)>=10, changed
          print('Renamed public display strings in',len(changed),'files:')
          print('\n'.join(changed))
          # Persistence, auth identifiers, hostnames, tables and original articles are not renamed.
          assert 'oreun_access' in (root/'lib/auth/session.ts').read_text()
          assert 'oreun-r1-preview.vercel.app' in (root/'docs/YOUTH-EXPERIENCE-AND-ACCOUNT.md').read_text() or (root/'docs/YOUTH-EXPERIENCE-AND-ACCOUNT.md').exists()
          (root/'docs/BRAND.md').write_text('''# 로블잼 / RobleJam\n\n2026-09-23: the owner approved replacing the public service name 오름 with 로블잼.\nPublic headings, navigation, accessible labels, metadata, structured data, OG image text and policy/service copy use 로블잼.\n\nThe preview remains https://oreun-r1-preview.vercel.app. Repository path apps/oreun/, the existing branch, deployment/project IDs, auth callback URLs, cookies, local draft keys, package name, database names and historical records are intentionally unchanged. They are technical identifiers, not failed user-facing renames. No new domain is registered.\n\nNo user content or historical source documents are rewritten. No Google consent-screen branding change is claimed; that console is a separate setting. No trademark clearance, affiliation, domain availability or commercial-policy permission is asserted by the owner naming decision.\n\nKeep Draft/Open, noindex and the existing age/permission gates. This is a display-name change, not a production launch.\n''')
          (root/'tests/brand-identity.test.ts').write_text('''import assert from "node:assert/strict";\nimport test from "node:test";\nimport { readdirSync, readFileSync } from "node:fs";\nimport { join } from "node:path";\nconst root = new URL("../", import.meta.url).pathname;\nfunction sources(dir:string):string[]{return readdirSync(dir,{withFileTypes:true}).flatMap(e=>e.isDirectory()?(e.name==="api"?[]:sources(join(dir,e.name))):/\\.(tsx?|svg)$/.test(e.name)?[join(dir,e.name)]:[]);}\ntest("public surfaces use the approved Korean brand",()=>{for(const file of [...sources(join(root,"app")),...sources(join(root,"components"))]) assert.equal(readFileSync(file,"utf8").includes("오름"),false,file);for(const p of ["components/Header.tsx","components/Footer.tsx","app/layout.tsx","app/login/page.tsx"])assert.ok(readFileSync(join(root,p),"utf8").includes("로블잼"),p);});\ntest("rename preserves sessions and installed draft keys",()=>{assert.match(readFileSync(join(root,"lib/auth/session.ts"),"utf8"),/oreun_access/);assert.match(readFileSync(join(root,"lib/community/answer-draft.ts"),"utf8"),/oreun:answer-draft/);});\n''')
          PY
      - name: Verify renamed source
        working-directory: apps/oreun
        run: npm ci && npm run typecheck && npm test
      - name: Commit bounded migration and remove this one-time workflow
        run: |
          set -euo pipefail
          git diff --name-only | python3 -c 'import sys; paths=sys.stdin.read().splitlines(); assert all(p.startswith("apps/oreun/app/") or p.startswith("apps/oreun/components/") or p=="apps/oreun/lib/regional-availability.ts" for p in paths), paths'
          rm .github/workflows/r1-roblejam-brand-migration.yml
          git add apps/oreun/app apps/oreun/components apps/oreun/lib/regional-availability.ts apps/oreun/docs/BRAND.md apps/oreun/tests/brand-identity.test.ts .github/workflows/r1-roblejam-brand-migration.yml
          git config user.name '5ggul'
          git config user.email '133470613+5ggul@users.noreply.github.com'
          git commit -m 'refactor(r1): rename public service to 로블잼 without changing auth or storage'
          git push origin "HEAD:$TARGET_BRANCH"

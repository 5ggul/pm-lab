name: car preview data validation

on:
  push:
    branches: [main]
    paths:
      - 'docs/car-data-preview/**'
      - '!docs/car-data-preview/assets/catalog-data.js'
      - '!docs/car-data-preview/data/generated/**'
      - '!docs/car-data-preview/data/raw/**'
      - '!docs/car-data-preview/data/staging/**'
      - '.github/workflows/car-preview-validate.yml'
  workflow_dispatch:

permissions:
  contents: write

env:
  NODE_VERSION: '22'

jobs:
  validate:
    if: ${{ github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[car-generated]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Build generated car data
        run: node docs/car-data-preview/scripts/build-car-data.mjs
      - name: Align home with complete all-car database scope
        run: node docs/car-data-preview/scripts/patch-home-all-car-scope.mjs
      - name: Validate normalized data and preview HTML
        run: node docs/car-data-preview/scripts/validate-car-data.mjs
      - name: Install Chromium QA runner
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Run 375-430px mobile QA
        shell: bash
        run: |
          python3 -m http.server 4173 --directory docs >/tmp/car-preview-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          sleep 2
          node docs/car-data-preview/scripts/mobile-qa.mjs
      - name: Publish generated preview outputs
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/car-data-preview/assets/catalog-data.js \
                  docs/car-data-preview/data/generated/catalog.json \
                  docs/car-data-preview/index.html \
                  docs/car-data-preview/cars/*/*/index.html
          if git diff --cached --quiet; then
            echo "Generated preview outputs are already current."
            exit 0
          fi
          git commit -m "Regenerate car preview outputs [car-generated]"
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Upload generated preview
        uses: actions/upload-artifact@v4
        with:
          name: car-preview-generated
          path: |
            docs/car-data-preview/assets/catalog-data.js
            docs/car-data-preview/data/generated/catalog.json
            docs/car-data-preview/index.html
            docs/car-data-preview/cars/kia/sorento-mq4/index.html
          if-no-files-found: error
          retention-days: 2

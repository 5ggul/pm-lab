name: car preview data validation

on:
  push:
    branches: [main]
    paths:
      - 'docs/car-data-preview/**'
      - '!docs/car-data-preview/assets/catalog-data.js'
      - '!docs/car-data-preview/data/generated/**'
      - '!docs/car-data-preview/data/raw/**'
      - '!docs/car-data-preview/data/staging/**'
      - '.github/workflows/car-preview-validate.yml'
  pull_request:
    paths:
      - 'docs/car-data-preview/**'
      - '!docs/car-data-preview/assets/catalog-data.js'
      - '!docs/car-data-preview/data/generated/**'
      - '!docs/car-data-preview/data/raw/**'
      - '!docs/car-data-preview/data/staging/**'
      - '.github/workflows/car-preview-validate.yml'
  workflow_dispatch:

permissions:
  contents: write

env:
  NODE_VERSION: '22'

jobs:
  validate:
    if: ${{ github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[car-generated]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Build generated car data
        run: node docs/car-data-preview/scripts/build-car-data.mjs
      - name: Align home with complete all-car database scope
        run: node docs/car-data-preview/scripts/patch-home-all-car-scope.mjs
      - name: Validate normalized data and preview HTML
        run: node docs/car-data-preview/scripts/validate-car-data.mjs
      - name: Build current manufacturer specs for deterministic UI QA
        env:
          MANUFACTURER_SPEC_SKIP_PROBE: '1'
        run: node docs/car-data-preview/scripts/fetch-manufacturer-specs.mjs
      - name: Validate manufacturer specs used by UI QA
        run: node docs/car-data-preview/scripts/validate-manufacturer-specs.mjs
      - name: Build 100 percent family detail coverage and compact index
        run: node docs/car-data-preview/scripts/build-family-detail-coverage.mjs
      - name: Patch universal family detail renderer
        run: node docs/car-data-preview/scripts/patch-family-universal-details.mjs
      - name: Remove internal terminology from user-facing pages
        run: node docs/car-data-preview/scripts/patch-user-facing-copy.mjs
      - name: Simplify public vehicle catalog
        run: node docs/car-data-preview/scripts/patch-public-catalog-simplify.mjs
      - name: Validate user-facing terminology and catalog mode
        run: node docs/car-data-preview/scripts/user-facing-copy-qa.mjs
      - name: Install Chromium QA runner
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Run mobile, manufacturer and universal-family UI QA
        shell: bash
        run: |
          python3 -m http.server 4173 --directory docs >/tmp/car-preview-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          sleep 2
          node docs/car-data-preview/scripts/mobile-qa.mjs
          node docs/car-data-preview/scripts/manufacturer-spec-ui-qa.mjs
          node docs/car-data-preview/scripts/family-universal-ui-qa.mjs
      - name: Publish generated preview outputs
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          FILES=(
            docs/car-data-preview/assets/catalog-data.js
            docs/car-data-preview/data/generated/catalog.json
            docs/car-data-preview/index.html
            docs/car-data-preview/cars/index.html
            docs/car-data-preview/cars/family/index.html
            docs/car-data-preview/data-sources/index.html
          )
          for p in docs/car-data-preview/cars/*/*/index.html; do
            [ -e "$p" ] && FILES+=("$p")
          done
          tar -czf /tmp/car-preview-output.tgz "${FILES[@]}"
          for attempt in 1 2 3; do
            echo "Publish preview attempt $attempt/3"
            git fetch origin main
            git reset --hard origin/main
            tar -xzf /tmp/car-preview-output.tgz
            git add "${FILES[@]}"
            if git diff --cached --quiet; then
              echo "Generated preview outputs are already current."
              exit 0
            fi
            git commit -m "Regenerate car preview outputs [car-generated]"
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep $((attempt * 2))
          done
          echo "Could not publish preview outputs after 3 fast-forward retries."
          exit 1
      - name: Upload generated preview
        uses: actions/upload-artifact@v4
        with:
          name: car-preview-generated
          path: |
            docs/car-data-preview/assets/catalog-data.js
            docs/car-data-preview/data/generated/catalog.json
            docs/car-data-preview/data/generated/family-detail-index.json
            docs/car-data-preview/data/generated/family-detail-coverage-status.json
            docs/car-data-preview/index.html
            docs/car-data-preview/cars/index.html
            docs/car-data-preview/cars/family/index.html
            docs/car-data-preview/data-sources/index.html
            docs/car-data-preview/cars/kia/sorento-mq4/index.html
          if-no-files-found: error
          retention-days: 2

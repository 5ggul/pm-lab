name: interior-prelaunch-finalization-qa

on:
  push:
    branches:
      - interior-prelaunch-finalization
    paths:
      - 'docs/interior-cost-preview/**'
      - 'tests/interior-prelaunch-finalization/**'
      - '.github/workflows/interior-prelaunch-finalization-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: interior-prelaunch-finalization-qa-\${{ github.ref }}
  cancel-in-progress: true

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Syntax check
        run: |
          node --check tests/interior-prelaunch-finalization/ci-browser-qa.cjs
          node --check scripts/interior-prelaunch-finalize.mjs

      - name: Install Playwright
        run: |
          mkdir -p /tmp/interior-prelaunch-qa
          cd /tmp/interior-prelaunch-qa
          npm init -y >/dev/null 2>&1
          npm install --no-audit --no-fund playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Start candidate server
        run: |
          ln -sfn docs pm-lab
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/interior-prelaunch-http.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4173/pm-lab/interior-cost-preview/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/interior-prelaunch-http.log || true
          exit 1

      - name: Start HTTPS tunnel
        run: |
          curl -fsSL --retry 5 --retry-delay 2 -o /tmp/cloudflared \
            https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64
          chmod +x /tmp/cloudflared
          /tmp/cloudflared tunnel --no-autoupdate --url http://127.0.0.1:4173 >/tmp/interior-prelaunch-cloudflared.log 2>&1 &
          URL=''
          for i in $(seq 1 60); do
            URL=$(grep -Eo 'https://[-a-z0-9]+\.trycloudflare\.com' /tmp/interior-prelaunch-cloudflared.log | head -n1 || true)
            if [ -n "$URL" ]; then break; fi
            sleep 1
          done
          if [ -z "$URL" ]; then cat /tmp/interior-prelaunch-cloudflared.log || true; exit 1; fi
          echo "QA_BASE_URL=$URL" >> "$GITHUB_ENV"
          for i in $(seq 1 90); do
            if curl -fsS --connect-timeout 5 "$URL/pm-lab/interior-cost-preview/" >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/interior-prelaunch-cloudflared.log || true
          exit 1

      - name: Run final prelaunch QA
        env:
          PLAYWRIGHT_MODULE: /tmp/interior-prelaunch-qa/node_modules/playwright
        run: node tests/interior-prelaunch-finalization/ci-browser-qa.cjs

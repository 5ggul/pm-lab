name: Meme Radar Live Probe

on:
  workflow_dispatch:
  push:
    branches:
      - meme-radar-v1-early-signal
    paths:
      - 'meme-radar-core/**'
      - '.github/workflows/meme-radar-live-probe.yml'

permissions:
  contents: read

jobs:
  live-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install runtime dependencies
        working-directory: meme-radar-core
        run: npm install --no-audit --no-fund
      - name: Robinhood mainnet probe
        id: probe
        continue-on-error: true
        working-directory: meme-radar-core
        env:
          LIVE_PROBE_FEED_MS: '5000'
        run: npm run probe:live
      - name: Upload probe result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: meme-radar-live-probe
          path: meme-radar-core/live-probe.json
          if-no-files-found: warn
          retention-days: 7
      - name: Enforce probe success
        if: steps.probe.outcome != 'success'
        run: exit 1

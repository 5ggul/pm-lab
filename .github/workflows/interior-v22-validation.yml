name: interior-v22-validation

on:
  push:
    branches: [interior-v22-quote-lines]
    paths:
      - 'interior-cost-core/**'
      - '.github/workflows/interior-v22-validation.yml'
  pull_request:
    branches: [interior-v20-g2b-data]
    paths:
      - 'interior-cost-core/**'
      - '.github/workflows/interior-v22-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-v22:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate preview through v22
        run: |
          node interior-cost-core/run-generate-v5.mjs
          node interior-cost-core/postprocess-review-date.mjs
      - name: Validate multi-line quote comparator boundaries
        shell: bash
        run: |
          ROOT='docs/interior-cost-preview'
          node --check interior-cost-core/enhance-v22-quote-lines.mjs
          node --check interior-cost-core/app-v22.js
          node --check interior-cost-core/browser-v22.spec.cjs
          node --check "$ROOT/assets/app-v22-bundle.js"
          test -s "$ROOT/assets/site-v22-bundle.css"
          if grep -n -E '@keyframes|animation[[:space:]]*:|linear-gradient|radial-gradient' interior-cost-core/site-v22.css; then exit 1; fi
          for f in data/v22-quote-lines-config.json data/v22-quote-lines-audit.json data/v22-report.json data/v22-browser-contract.json compare/quote-lines/index.html; do test -s "$ROOT/$f"; done
          grep -Fq 'noindex,nofollow' "$ROOT/compare/quote-lines/index.html"
          grep -Fq '평수는 컨텍스트' "$ROOT/compare/quote-lines/index.html"
          grep -Fq '적정·과다·저가 판정은 하지 않습니다' "$ROOT/compare/quote-lines/index.html"
          grep -Fq '/compare/quote-lines/' "$ROOT/quote-compare/index.html"
          grep -Fq '/compare/quote-lines/' "$ROOT/calculator/index.html"
          grep -Fq '/compare/quote-lines/' "$ROOT/compare/reference-layers/index.html"
          grep -Fq '/compare/quote-lines/' "$ROOT/interior-cost/matrix/index.html"
          if grep -R -n -E 'serviceKey|invstDeptTelNo|invstOfclNm|cntrctCorpTelNo|adsbygoogle|pagead2\.googlesyndication\.com' "$ROOT/compare/quote-lines" "$ROOT/data/v22-quote-lines-config.json"; then exit 1; fi
          node - <<'NODE'
          const c=require('./docs/interior-cost-preview/data/v22-quote-lines-config.json');
          const a=require('./docs/interior-cost-preview/data/v22-quote-lines-audit.json');
          const r=require('./docs/interior-cost-preview/data/release-url-set-v21.json');
          if(c.version!=='22.0.0'||c.trades.length!==5||Object.keys(c.references).length<300)process.exit(1);
          if(!c.rules.pyeong_context_only||c.rules.pyeong_to_work_quantity||!c.rules.same_unit_candidates_only||c.rules.scope_equivalence_assumed||c.rules.automatic_price_judgment||c.rules.user_input_persisted||c.rules.cross_source_auto_sum)process.exit(1);
          if(!c.trades.every(t=>t.units.includes('㎡')&&t.candidate_count>0))process.exit(1);
          if(Object.values(a.checks).some(v=>v!==true)||!a.preview_noindex||a.production_switch||a.search_console_submission||a.ads_injected)process.exit(1);
          if(r.total_count!==85||!r.simulation_only||!r.actual_preview_noindex_unchanged)process.exit(1);
          NODE

  browser-v22:
    needs: static-v22
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate preview through v22
        run: |
          node interior-cost-core/run-generate-v5.mjs
          node interior-cost-core/postprocess-review-date.mjs
      - name: Install Chromium test runtime
        run: |
          npm install --no-save --package-lock=false @playwright/test@1.55.0
          npx playwright install --with-deps chromium
      - name: Serve preview at GitHub Pages path
        run: |
          SERVE=/tmp/interior-v22-site
          rm -rf "$SERVE"
          mkdir -p "$SERVE/pm-lab"
          ln -s "$GITHUB_WORKSPACE/docs/interior-cost-preview" "$SERVE/pm-lab/interior-cost-preview"
          python3 -m http.server 4173 --directory "$SERVE" >/tmp/interior-v22-http.log 2>&1 &
          for i in $(seq 1 20); do curl -fsS http://127.0.0.1:4173/pm-lab/interior-cost-preview/ >/dev/null && exit 0; sleep 1; done
          cat /tmp/interior-v22-http.log
          exit 1
      - name: Run v22 Chromium audits and multi-line interactions
        run: npx playwright test interior-cost-core/browser-v22.spec.cjs --reporter=line --workers=1
      - name: Upload v22 browser audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: interior-v22-browser-audit
          path: artifacts/v22-browser/
          if-no-files-found: error
          retention-days: 14

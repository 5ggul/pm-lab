name: interior-g2b-cost-reference-refresh

on:
  push:
    branches:
      - interior-v20-g2b-data
    paths:
      - '.github/workflows/interior-g2b-cost-reference-refresh.yml'
      - 'interior-cost-core/scripts/collect-g2b-cost-references.mjs'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    env:
      DATA_GO_KR_SERVICE_KEY: ${{ secrets.DATA_GO_KR_SERVICE_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: interior-v20-g2b-data
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Collect G2B construction cost references
        run: node interior-cost-core/scripts/collect-g2b-cost-references.mjs
      - name: Validate sanitized datasets
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const files=[
            'interior-cost-core/data/g2b-building-market-construction.json',
            'interior-cost-core/data/g2b-standard-market-unit-building.json'
          ];
          for(const file of files){
            const x=JSON.parse(fs.readFileSync(file,'utf8'));
            if(!x.source_id||!Array.isArray(x.records)||!Array.isArray(x.groups)) process.exit(1);
            const text=JSON.stringify(x);
            if(/serviceKey|invstDeptTelNo|invstOfclNm|cntrctCorpTelNo/i.test(text)) process.exit(1);
          }
          NODE
      - name: Commit snapshots to preview branch only
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add interior-cost-core/data/g2b-building-market-construction.json interior-cost-core/data/g2b-standard-market-unit-building.json
          if git diff --cached --quiet; then
            echo 'No snapshot changes.'
            exit 0
          fi
          git commit -m 'data: refresh G2B construction cost references'
          git push origin HEAD:interior-v20-g2b-data

name: DealOps Daangn Utility Preview

on:
  push:
    branches:
      - main
    paths:
      - "ops/daangn-cloud/utility-heartbeat.txt"
  workflow_dispatch:
  pull_request:
    paths:
      - "ops/daangn-cloud/**"
      - ".github/workflows/daangn-utility-publisher.yml"

permissions:
  contents: read

concurrency:
  group: daangn-utility-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.ref }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        working-directory: ops/daangn-cloud
        run: npm ci --no-audit --no-fund

      - name: Regression checks
        working-directory: ops/daangn-cloud
        run: npm run check

      - name: Collect utility preview only
        working-directory: ops/daangn-cloud
        run: npm run collect:utility

      - name: Upload utility preview
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daangn-utility-preview-${{ github.run_id }}
          path: ops/daangn-cloud/state/utility-report.json
          if-no-files-found: ignore
          retention-days: 7

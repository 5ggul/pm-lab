name: DealOps Daangn Auth Watch

on:
  schedule:
    # 08:10 KST, before the first publishing slot
    - cron: "10 23 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: daangn-auth-watch
  cancel-in-progress: true

jobs:
  auth-check:
    # Playwright 1.55 supports Ubuntu 24.04; keep the browser host version explicit.
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      DAANGN_AUTH_STATE_B64: ${{ secrets.DAANGN_AUTH_STATE_B64 }}
      DAANGN_CAFE_SLUG: don-akkineun-sa
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        working-directory: ops/daangn-cloud
        run: npm ci --no-audit --no-fund

      - name: Install Chromium
        working-directory: ops/daangn-cloud
        run: npx playwright install --with-deps chromium

      - name: Check Daangn auth
        id: auth
        continue-on-error: true
        working-directory: ops/daangn-cloud
        run: npm run auth-check

      - name: Open or update auth alert
        if: steps.auth.outcome == 'failure'
        shell: bash
        run: |
          title='[DealOps] Daangn auth expired'
          issue=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "$title in:title" --json number --jq '.[0].number // empty')
          body="Daangn cloud login is no longer usable. Run the local bootstrap-secret.ps1 after refreshing the Daangn login session. Detected at: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          if [ -z "$issue" ]; then
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body "$body"
          else
            gh issue comment "$issue" --repo "$GITHUB_REPOSITORY" --body "$body"
          fi
          exit 1

      - name: Close resolved auth alert
        if: steps.auth.outcome == 'success'
        shell: bash
        run: |
          title='[DealOps] Daangn auth expired'
          issue=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "$title in:title" --json number --jq '.[0].number // empty')
          if [ -n "$issue" ]; then
            gh issue close "$issue" --repo "$GITHUB_REPOSITORY" --comment "Daangn cloud authentication is healthy again."
          fi

      - name: Check last confirmed publication
        id: publication
        working-directory: ops/daangn-cloud
        run: node src/publication-watch.mjs

      - name: Open publication supply alert
        if: steps.publication.outputs.stalled == 'true'
        shell: bash
        run: |
          title='[DealOps] Daangn publication idle 48h'
          issue=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "$title in:title" --json number --jq '.[0].number // empty')
          if [ -z "$issue" ]; then
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body "No confirmed public cafe post for at least 48 hours. This may reflect verified-source exhaustion, content/board limits or a publishing failure; successful workflows alone are not evidence of publication. Inspect the latest DealOps Daangn Cloud summary and the saved editorial report. Do not retry an uncertain submission or loosen factual, rights, dedupe and board checks."
          fi

      - name: Close recovered publication alert
        if: steps.publication.outputs.stalled == 'false'
        shell: bash
        run: |
          title='[DealOps] Daangn publication idle 48h'
          issue=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "$title in:title" --json number --jq '.[0].number // empty')
          if [ -n "$issue" ]; then
            gh issue close "$issue" --repo "$GITHUB_REPOSITORY" --comment "A new confirmed public cafe post has been saved; the 48-hour inactivity alert is resolved."
          fi

name: car-efficiency-ingest

on:
  workflow_dispatch:
  schedule:
    - cron: '17 20 * * *'
  push:
    branches: [main]
    paths:
      - 'docs/car-data-preview/scripts/fetch-kea-cars.mjs'
      - 'docs/car-data-preview/scripts/fetch-kea-display-cars.mjs'
      - 'docs/car-data-preview/scripts/merge-kea-car-sources.mjs'
      - 'docs/car-data-preview/scripts/validate-kea-merge.mjs'
      - 'docs/car-data-preview/scripts/match-kea-cars.mjs'
      - '.github/workflows/car-efficiency-ingest.yml'

permissions:
  contents: write
  actions: write

concurrency:
  group: car-efficiency-ingest
  cancel-in-progress: true

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fetch KEA energy-efficiency API rows
        id: fetch_energy
        continue-on-error: true
        env:
          DATA_GO_KR_SERVICE_KEY: ${{ secrets.DATA_GO_KR_SERVICE_KEY }}
          KEA_CAR_API_ENDPOINT: ${{ vars.KEA_CAR_API_ENDPOINT }}
          KEA_CAR_SOURCE_PAGE: ${{ vars.KEA_CAR_SOURCE_PAGE }}
        run: node docs/car-data-preview/scripts/fetch-kea-cars.mjs
      - name: Fetch rich KEA display-efficiency rows
        id: fetch_display
        continue-on-error: true
        env:
          DATA_GO_KR_SERVICE_KEY: ${{ secrets.DATA_GO_KR_SERVICE_KEY }}
        run: node docs/car-data-preview/scripts/fetch-kea-display-cars.mjs
      - name: Merge KEA official sources for source-snapshot validation
        if: always()
        run: node docs/car-data-preview/scripts/merge-kea-car-sources.mjs
      - name: Validate KEA merge safety before publishing source snapshots
        if: always()
        run: node docs/car-data-preview/scripts/validate-kea-merge.mjs
      - name: Match API rows to reviewed SSOT
        if: always()
        run: node docs/car-data-preview/scripts/match-kea-cars.mjs
      - name: Commit source snapshots only
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          FILES=(
            docs/car-data-preview/data/raw/kea-car-efficiency.json
            docs/car-data-preview/data/raw/kea-car-display.json
            docs/car-data-preview/data/staging/kea-car-efficiency-normalized.json
            docs/car-data-preview/data/staging/kea-car-efficiency-unmatched.json
            docs/car-data-preview/data/staging/kea-model-candidates.json
            docs/car-data-preview/data/staging/kea-car-display-normalized.json
            docs/car-data-preview/data/generated/kea-api-status.json
            docs/car-data-preview/data/generated/kea-api-coverage.json
            docs/car-data-preview/data/generated/kea-display-status.json
          )
          EXISTING=()
          for p in "${FILES[@]}"; do
            if [ -e "$p" ]; then EXISTING+=("$p"); fi
          done
          if [ "${#EXISTING[@]}" -eq 0 ]; then
            echo "No KEA source outputs to publish."
            exit 0
          fi
          tar -czf /tmp/car-api-source-output.tgz "${EXISTING[@]}"
          for attempt in 1 2 3; do
            echo "Publish source snapshot attempt $attempt/3"
            git fetch origin main
            git reset --hard origin/main
            tar -xzf /tmp/car-api-source-output.tgz
            git add "${EXISTING[@]}"
            if git diff --cached --quiet; then
              echo "KEA source snapshots are already current."
              exit 0
            fi
            git commit -m "data: refresh validated KEA source snapshots [car-api]"
            if git push origin HEAD:main; then
              echo "Source snapshots published."
              exit 0
            fi
            sleep $((attempt * 2))
          done
          echo "Could not publish KEA source snapshots after 3 fast-forward retries."
          exit 1
      - name: Dispatch latest-main hierarchy and calculation rebuild
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/car-family-build.yml/dispatches" \
            -f ref=main
          echo "Dispatched car-family-build against the latest main revision."
      - name: Report energy source access failure
        if: steps.fetch_energy.outcome == 'failure'
        run: cat docs/car-data-preview/data/generated/kea-api-status.json || true
      - name: Report display source access failure
        if: steps.fetch_display.outcome == 'failure'
        run: cat docs/car-data-preview/data/generated/kea-display-status.json || true

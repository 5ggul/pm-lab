      - name: Validate v11.14 two-tier history trust gate
        run: node franchise-ssg-core/run-validate-v11-14-final.mjs
        env:
          SSG_PREVIEW_MODE: 'true'

      - name: Generate v11.15 tool trust and missing-value pass
        run: node franchise-ssg-core/run-generate-v11-15-final.mjs
        env:
          SSG_PREVIEW_MODE: 'true'
          SSG_SITE_URL: 'https://5ggul.github.io/pm-lab/franchise-ssg-preview'

      - name: Validate v11.15 tool trust and missing-value pass
        run: node franchise-ssg-core/run-validate-v11-15-final.mjs
        env:
          SSG_PREVIEW_MODE: 'true'

      - name: Generate v11.16 tool hub and contextual linking pass
        run: node franchise-ssg-core/run-generate-v11-16-final.mjs
        env:
          SSG_PREVIEW_MODE: 'true'
          SSG_SITE_URL: 'https://5ggul.github.io/pm-lab/franchise-ssg-preview'

      - name: Validate v11.16 tool hub and contextual linking pass
        run: node franchise-ssg-core/run-validate-v11-16-final.mjs
        env:
          SSG_PREVIEW_MODE: 'true'

      - name: Generate v11.17 compare trust and Tier B expansion
        run: node franchise-ssg-core/run-generate-v11-17-final.mjs
        env:
          SSG_PREVIEW_MODE: 'true'
          SSG_SITE_URL: 'https://5ggul.github.io/pm-lab/franchise-ssg-preview'

      - name: Validate v11.17 compare trust and Tier B expansion
        run: node franchise-ssg-core/run-validate-v11-17-final.mjs

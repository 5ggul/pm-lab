name: franchise-ssg-preview

on:
  push:
    branches: [main]
    paths:
      - 'franchise-ssg-core/**'
      - 'docs/franchise-data-preview/data-final.js'
      - 'docs/franchise-data-preview/official-brand-data-final.js'
      - 'data/franchise/official/brands-2025.json'
      - '.github/workflows/franchise-ssg-preview.yml'
  pull_request:
    paths:
      - 'franchise-ssg-core/**'
      - 'docs/franchise-data-preview/data-final.js'
      - 'docs/franchise-data-preview/official-brand-data-final.js'
      - 'data/franchise/official/brands-2025.json'
      - '.github/workflows/franchise-ssg-preview.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: franchise-ssg-preview-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  generate-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Audit official franchise data
        run: node franchise-ssg-core/run-audit-v10-data.mjs

      - name: Generate v11.3 franchise preview
        run: node franchise-ssg-core/run-generate-v11-3-final.mjs
        env:
          SSG_PREVIEW_MODE: 'true'
          SSG_BASE_PATH: '/pm-lab/franchise-ssg-preview'
          SSG_SITE_URL: 'https://5ggul.github.io/pm-lab/franchise-ssg-preview'

      - name: Validate v11.3 franchise preview
        run: node franchise-ssg-core/run-validate-v11-3-final.mjs
        env:
          SSG_PREVIEW_MODE: 'true'

      - name: Apply v11.4 direct copy and table fix
        run: node franchise-ssg-core/run-generate-v11-4-final.mjs
        env:
          SSG_PREVIEW_MODE: 'true'

      - name: Validate v11.4 copy and table fix
        run: node franchise-ssg-core/run-validate-v11-4-final.mjs
        env:
          SSG_PREVIEW_MODE: 'true'

      - name: Generate v11.5 reviewed data resolution report
        run: node franchise-ssg-core/run-generate-v11-5-final.mjs
        env:
          SSG_PREVIEW_MODE: 'true'

      - name: Validate v11.5 official merge and no-synthetic policy
        run: node franchise-ssg-core/run-validate-v11-5-final.mjs
        env:
          SSG_PREVIEW_MODE: 'true'

      - name: Audit v11.6 full static route integrity
        run: node franchise-ssg-core/run-generate-v11-6-final.mjs
        env:
          SSG_PREVIEW_MODE: 'true'

      - name: Validate v11.6 brands categories compares tools and links
        run: node franchise-ssg-core/run-validate-v11-6-final.mjs
        env:
          SSG_PREVIEW_MODE: 'true'

      - name: Generate v11.7 history trust pass
        run: node franchise-ssg-core/run-generate-v11-7-final.mjs
        env:
          SSG_PREVIEW_MODE: 'true'

      - name: Validate v11.7 history trust pass
        run: node franchise-ssg-core/run-validate-v11-7-final.mjs
        env:
          SSG_PREVIEW_MODE: 'true'

      - name: Generate v11.8 sanitized index trust pass
        run: node franchise-ssg-core/run-generate-v11-8-final.mjs
        env:
          SSG_PREVIEW_MODE: 'true'
          SSG_SITE_URL: 'https://5ggul.github.io/pm-lab/franchise-ssg-preview'

      - name: Validate v11.8 sanitized index trust pass
        run: node franchise-ssg-core/run-validate-v11-8-final.mjs
        env:
          SSG_PREVIEW_MODE: 'true'

      - name: Generate v11.9 restrained startup motion

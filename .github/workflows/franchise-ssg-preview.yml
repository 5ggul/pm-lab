      - name: Generate v11.19 budget intent explorer
        run: node franchise-ssg-core/run-generate-v11-19-final.mjs
        env:
          SSG_PREVIEW_MODE: 'true'
          SSG_BASE_PATH: '/pm-lab/franchise-ssg-preview'
          SSG_SITE_URL: 'https://5ggul.github.io/pm-lab/franchise-ssg-preview'

      - name: Validate v11.19 budget intent explorer
        run: node franchise-ssg-core/run-validate-v11-19-final.mjs
        env:
          SSG_PREVIEW_MODE: 'true'
          SSG_BASE_PATH: '/pm-lab/franchise-ssg-preview'

      - name: Generate v11.20 consolidated ranking hub
        run: node franchise-ssg-core/run-generate-v11-20-final.mjs
        env:
          SSG_PREVIEW_MODE: 'true'
          SSG_BASE_PATH: '/pm-lab/franchise-ssg-preview'
          SSG_SITE_URL: 'https://5ggul.github.io/pm-lab/franchise-ssg-preview'

      - name: Validate v11.20 consolidated ranking hub
        run: node franchise-ssg-core/run-validate-v11-20-final.mjs
        env:
          SSG_PREVIEW_MODE: 'true'
          SSG_BASE_PATH: '/pm-lab/franchise-ssg-preview'

      - name: Generate v11.21 home decision funnel
        run: node franchise-ssg-core/run-generate-v11-21-final.mjs
        env:
          SSG_PREVIEW_MODE: 'true'
          SSG_BASE_PATH: '/pm-lab/franchise-ssg-preview'

      - name: Validate v11.21 home decision funnel
        run: node franchise-ssg-core/run-validate-v11-21-final.mjs
        env:
          SSG_PREVIEW_MODE: 'true'

      - name: Generate v11.22 internal authority and crawl-depth audit
        run: node franchise-ssg-core/run-generate-v11-22-final.mjs
        env:
          SSG_PREVIEW_MODE: 'true'
          SSG_SITE_URL: 'https://5ggul.github.io/pm-lab/franchise-ssg-preview'

      - name: Validate v11.22 internal authority and crawl-depth audit
        run: node franchise-ssg-core/run-validate-v11-22-final.mjs
        env:
          SSG_PREVIEW_MODE: 'true'

      - name: Commit generated preview safely
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          if [ -z "$(git status --porcelain -- docs/franchise-ssg-preview)" ]; then
            echo 'No generated SSG changes.'
            exit 0
          fi
          SNAPSHOT_DIR="$(mktemp -d)"
          cp -a docs/franchise-ssg-preview "$SNAPSHOT_DIR/franchise-ssg-preview"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+5ggul@users.noreply.github.com'

          for attempt in 1 2 3; do
            echo "Publish attempt $attempt"
            git fetch origin main
            git reset --hard origin/main
            rm -rf docs/franchise-ssg-preview
            cp -a "$SNAPSHOT_DIR/franchise-ssg-preview" docs/franchise-ssg-preview
            if [ -z "$(git status --porcelain -- docs/franchise-ssg-preview)" ]; then
              echo 'Latest main already contains this generated output.'
              exit 0
            fi
            git add docs/franchise-ssg-preview
            git commit -m 'Regenerate franchise v11.22 preview [skip franchise-ssg]'
            if git push origin HEAD:main; then
              exit 0
            fi
            echo 'Main advanced during publish; retrying from latest origin/main.'
          done
          echo 'Failed to publish generated preview after 3 race-safe attempts.' >&2
          exit 1

# v11.22 internal authority marker: 2026-09-09

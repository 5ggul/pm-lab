name: franchise-ssg-preview

on:
  push:
    branches: [main]
    paths:
      - 'franchise-ssg-core/**'
      - 'docs/franchise-data-preview/data-final.js'
      - 'docs/franchise-data-preview/official-brand-data-final.js'
      - 'data/franchise/official/brands-2025.json'
      - '.github/workflows/franchise-ssg-preview.yml'
  pull_request:
    paths:
      - 'franchise-ssg-core/**'
      - 'docs/franchise-data-preview/data-final.js'
      - 'docs/franchise-data-preview/official-brand-data-final.js'
      - 'data/franchise/official/brands-2025.json'
      - '.github/workflows/franchise-ssg-preview.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: franchise-ssg-preview-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  generate-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Audit official franchise data
        run: node franchise-ssg-core/run-audit-v10-data.mjs

      - name: Build v11.3-v11.37 once with sales semantics
        run: node franchise-ssg-core/run-generate-v11-37-sales-semantics.mjs
        env:
          SSG_PREVIEW_MODE: 'true'
          SSG_BASE_PATH: '/pm-lab/franchise-ssg-preview'
          SSG_SITE_URL: 'https://5ggul.github.io/pm-lab/franchise-ssg-preview'

      - name: Fix and validate v11.37 structured average-sales semantics
        run: |
          node franchise-ssg-core/run-fix-v11-37-structured-sales.mjs
          node franchise-ssg-core/run-validate-v11-37-sales-semantics.mjs
        env:
          SSG_PREVIEW_MODE: 'true'
          SSG_BASE_PATH: '/pm-lab/franchise-ssg-preview'

      - name: Apply and validate v11.38 mobile safeguards
        run: |
          node franchise-ssg-core/run-generate-v11-38-mobile-safeguards.mjs
          node franchise-ssg-core/run-validate-v11-38-mobile-safeguards.mjs

      - name: Apply and validate v11.39 brand evidence
        run: |
          node franchise-ssg-core/run-generate-v11-39-brand-evidence.mjs
          node franchise-ssg-core/run-validate-v11-39-brand-evidence.mjs

      - name: Apply and validate v11.40 market design system
        run: |
          node franchise-ssg-core/run-generate-v11-40-market-design.mjs
          node franchise-ssg-core/run-validate-v11-40-market-design.mjs

      - name: Apply and validate v11.41 cinematic photo and motion system
        run: |
          node franchise-ssg-core/run-generate-v11-41-cinematic-motion.mjs
          node franchise-ssg-core/run-validate-v11-41-cinematic-motion.mjs
          node franchise-ssg-core/run-validate-v11-40-market-design.mjs

      - name: Apply and validate v11.42 data-first interface cleanup
        run: |
          node franchise-ssg-core/run-generate-v11-42-data-interface.mjs
          node franchise-ssg-core/run-validate-v11-42-data-interface.mjs

      - name: Apply and validate v11.43 user-friendly control UX
        run: |
          node franchise-ssg-core/run-generate-v11-43-control-ux.mjs
          node franchise-ssg-core/run-validate-v11-43-control-ux.mjs
          node franchise-ssg-core/run-validate-v11-42-data-interface.mjs

      - name: Restore v11.42 visual language and apply v11.44 refinement
        run: |
          node franchise-ssg-core/run-generate-v11-44-v42-refinement.mjs
          node franchise-ssg-core/run-validate-v11-44-v42-refinement.mjs
          node franchise-ssg-core/run-validate-v11-42-data-interface.mjs

      - name: Sync public counts and freshness with trusted snapshot v11.45
        run: |
          node franchise-ssg-core/run-generate-v11-45-public-freshness.mjs
          node franchise-ssg-core/run-validate-v11-45-public-freshness.mjs
          node franchise-ssg-core/run-validate-v11-44-v42-refinement.mjs
          node franchise-ssg-core/run-validate-v11-42-data-interface.mjs

      - name: Apply and validate v11.46 workflow UX
        run: |
          node franchise-ssg-core/run-generate-v11-46-workflow-ux.mjs
          node franchise-ssg-core/run-validate-v11-46-workflow-ux.mjs
          node franchise-ssg-core/run-validate-v11-45-public-freshness.mjs
          node franchise-ssg-core/run-validate-v11-44-v42-refinement.mjs
          node franchise-ssg-core/run-validate-v11-42-data-interface.mjs

      - name: Apply and validate v11.47 trust and search signals
        run: |
          node franchise-ssg-core/run-generate-v11-47-trust-signal.mjs
          node franchise-ssg-core/run-validate-v11-47-trust-signal.mjs
          node franchise-ssg-core/run-validate-v11-46-workflow-ux.mjs
          node franchise-ssg-core/run-validate-v11-45-public-freshness.mjs
          node franchise-ssg-core/run-validate-v11-44-v42-refinement.mjs
          node franchise-ssg-core/run-validate-v11-42-data-interface.mjs

      - name: Apply and validate v11.48 brand distinctness
        run: |
          node franchise-ssg-core/run-generate-v11-48-brand-distinctness.mjs
          node franchise-ssg-core/run-fix-v11-48-copy.mjs
          node franchise-ssg-core/run-validate-v11-48-brand-distinctness.mjs
          node franchise-ssg-core/run-validate-v11-46-workflow-ux.mjs
          node franchise-ssg-core/run-validate-v11-45-public-freshness.mjs
          node franchise-ssg-core/run-validate-v11-44-v42-refinement.mjs
          node franchise-ssg-core/run-validate-v11-42-data-interface.mjs
          node franchise-ssg-core/run-validate-v11-39-brand-evidence.mjs

      - name: Apply and validate v11.49 bulk usability
        run: |
          node franchise-ssg-core/run-generate-v11-49-bulk-usability.mjs
          node franchise-ssg-core/run-validate-v11-49-bulk-usability.mjs
          node franchise-ssg-core/run-validate-v11-46-workflow-ux.mjs
          node franchise-ssg-core/run-validate-v11-45-public-freshness.mjs
          node franchise-ssg-core/run-validate-v11-44-v42-refinement.mjs
          node franchise-ssg-core/run-validate-v11-42-data-interface.mjs
          node franchise-ssg-core/run-validate-v11-39-brand-evidence.mjs

      - name: Apply and validate v11.50 discovery and tools completion
        run: |
          node franchise-ssg-core/run-generate-v11-50-discovery-tools.mjs
          node franchise-ssg-core/run-validate-v11-50-discovery-tools.mjs
          node franchise-ssg-core/run-validate-v11-49-bulk-usability.mjs
          node franchise-ssg-core/run-validate-v11-46-workflow-ux.mjs
          node franchise-ssg-core/run-validate-v11-45-public-freshness.mjs
          node franchise-ssg-core/run-validate-v11-44-v42-refinement.mjs
          node franchise-ssg-core/run-validate-v11-42-data-interface.mjs
          node franchise-ssg-core/run-validate-v11-39-brand-evidence.mjs

      - name: Apply and validate v11.51 viewport guards
        run: |
          node franchise-ssg-core/run-generate-v11-51-viewport-guard.mjs
          node franchise-ssg-core/run-validate-v11-51-viewport-guard.mjs
          node franchise-ssg-core/run-validate-v11-50-discovery-tools.mjs
          node franchise-ssg-core/run-validate-v11-49-bulk-usability.mjs

      - name: Build and validate v11.52 release candidate
        run: |
          node franchise-ssg-core/run-generate-v11-52-release-candidate.mjs
          node franchise-ssg-core/run-validate-v11-52-release-candidate.mjs
          node franchise-ssg-core/run-validate-v11-51-viewport-guard.mjs
          node franchise-ssg-core/run-validate-v11-50-discovery-tools.mjs
          node franchise-ssg-core/run-validate-v11-49-bulk-usability.mjs

      - name: Revalidate inherited mobile and data semantics
        run: |
          node franchise-ssg-core/run-validate-v11-52-release-candidate.mjs
          node franchise-ssg-core/run-validate-v11-51-viewport-guard.mjs
          node franchise-ssg-core/run-validate-v11-50-discovery-tools.mjs
          node franchise-ssg-core/run-validate-v11-49-bulk-usability.mjs
          node franchise-ssg-core/run-validate-v11-46-workflow-ux.mjs
          node franchise-ssg-core/run-validate-v11-45-public-freshness.mjs
          node franchise-ssg-core/run-validate-v11-39-brand-evidence.mjs
          node franchise-ssg-core/run-validate-v11-38-mobile-safeguards.mjs
          node franchise-ssg-core/run-validate-v11-37-sales-semantics.mjs
        env:
          SSG_PREVIEW_MODE: 'true'
          SSG_BASE_PATH: '/pm-lab/franchise-ssg-preview'

      - name: Commit generated preview safely
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          if [ -z "$(git status --porcelain -- docs/franchise-ssg-preview)" ]; then
            echo 'No generated SSG changes.'
            exit 0
          fi
          SNAPSHOT_DIR="$(mktemp -d)"
          cp -a docs/franchise-ssg-preview "$SNAPSHOT_DIR/franchise-ssg-preview"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+5ggul@users.noreply.github.com'

          for attempt in 1 2 3; do
            echo "Publish attempt $attempt"
            git fetch origin main
            git reset --hard origin/main
            rm -rf docs/franchise-ssg-preview
            cp -a "$SNAPSHOT_DIR/franchise-ssg-preview" docs/franchise-ssg-preview
            if [ -z "$(git status --porcelain -- docs/franchise-ssg-preview)" ]; then
              echo 'Latest main already contains this generated output.'
              exit 0
            fi
            git add docs/franchise-ssg-preview
            git commit -m 'Regenerate franchise v11.52 release candidate preview [skip franchise-ssg]'
            if git push origin HEAD:main; then
              exit 0
            fi
            echo 'Main advanced during publish; retrying from latest origin/main.'
          done
          echo 'Failed to publish generated preview after 3 race-safe attempts.' >&2
          exit 1


      - name: Publish PR 202 final review preview safely
        if: github.event_name == 'pull_request' && github.event.pull_request.number == 202 && github.event.pull_request.head.ref == 'fix/franchise-keyboard-webkit-20260913'
        env:
          REVIEW_SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
          REVIEW_URL: https://5ggul.github.io/pm-lab/franchise-ssg-preview/
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$REVIEW_SOURCE_SHA"
          node <<'NODE'
          const fs=require('fs'),path=require('path');
          const root='docs/franchise-ssg-preview';
          const files=[];
          const walk=d=>fs.readdirSync(d,{withFileTypes:true}).forEach(e=>{const p=path.join(d,e.name);e.isDirectory()?walk(p):(e.isFile()&&e.name.endsWith('.html')&&files.push(p))});
          walk(root);
          if(files.length!==311)throw new Error('review html count '+files.length);
          for(const file of files){
            const h=fs.readFileSync(file,'utf8');
            if(!h.includes('<meta name="robots" content="noindex,nofollow,noarchive,nosnippet">'))throw new Error('review noindex missing '+file);
            if(h.includes('images.unsplash.com'))throw new Error('remote stock image leaked '+file);
          }
          NODE
          printf '{"sourceHead":"%s","uiVersion":"11.52","reviewOnly":true,"noindex":true,"productionDeploy":false}\n' "$REVIEW_SOURCE_SHA" > docs/franchise-ssg-preview/review-build.json

          SNAPSHOT_DIR="$(mktemp -d)"
          cp -a docs/franchise-ssg-preview "$SNAPSHOT_DIR/franchise-ssg-preview"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+5ggul@users.noreply.github.com'
          git fetch origin main
          git reset --hard origin/main
          rm -rf docs/franchise-ssg-preview
          cp -a "$SNAPSHOT_DIR/franchise-ssg-preview" docs/franchise-ssg-preview
          git add docs/franchise-ssg-preview

          changed="$(git -c core.quotePath=false diff --cached --name-only)"
          test -n "$changed"
          if printf '%s\n' "$changed" | grep -v '^docs/franchise-ssg-preview/' >/dev/null; then
            echo 'Review publish attempted to change files outside preview path.' >&2
            exit 1
          fi
          git commit -m "Publish franchise final review preview ${REVIEW_SOURCE_SHA:0:12}"
          git push origin HEAD:main

      - name: Verify PR 202 review preview is live and still noindex
        if: github.event_name == 'pull_request' && github.event.pull_request.number == 202 && github.event.pull_request.head.ref == 'fix/franchise-keyboard-webkit-20260913'
        env:
          REVIEW_SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
          REVIEW_URL: https://5ggul.github.io/pm-lab/franchise-ssg-preview/
        run: |
          set -euo pipefail
          ok=0
          for attempt in $(seq 1 90); do
            build="$(curl -fsSL --max-time 15 "$REVIEW_URL/review-build.json?v=$GITHUB_RUN_ID-$attempt" 2>/dev/null || true)"
            if printf '%s' "$build" | grep -Fq "\"sourceHead\":\"$REVIEW_SOURCE_SHA\"" && printf '%s' "$build" | grep -Fq '"noindex":true'; then
              home="$(curl -fsSL --max-time 15 "$REVIEW_URL?v=$GITHUB_RUN_ID-$attempt")"
              printf '%s' "$home" | grep -Fq '<meta name="robots" content="noindex,nofollow,noarchive,nosnippet">'
              printf '%s' "$home" | grep -Fq '국내 프랜차이즈 공개데이터'
              if printf '%s' "$home" | grep -Fq 'images.unsplash.com'; then
                echo 'Remote stock image leaked on live review.' >&2
                exit 1
              fi
              ok=1
              break
            fi
            sleep 4
          done
          test "$ok" -eq 1
          echo "LIVE_REVIEW=$REVIEW_URL"
          echo "LIVE_SOURCE_SHA=$REVIEW_SOURCE_SHA"

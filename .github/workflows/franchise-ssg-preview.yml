name: franchise-ssg-preview

on:
  push:
    branches: [main]
    paths:
      - 'franchise-ssg-core/**'
      - 'docs/franchise-data-preview/data-final.js'
      - 'docs/franchise-data-preview/official-brand-data-final.js'
      - '.github/workflows/franchise-ssg-preview.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: franchise-ssg-preview-main
  cancel-in-progress: true

jobs:
  generate-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Generate static preview
        run: node franchise-ssg-core/run-generate-v2.mjs
        env:
          SSG_PREVIEW_MODE: 'true'
          SSG_BASE_PATH: '/pm-lab/franchise-ssg-preview'
          SSG_SITE_URL: 'https://5ggul.github.io/pm-lab/franchise-ssg-preview'

      - name: Validate SSG output
        run: node franchise-ssg-core/validate-v2.mjs

      - name: Commit generated preview
        run: |
          if [ -z "$(git status --porcelain -- docs/franchise-ssg-preview)" ]; then
            echo 'No generated SSG changes.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/franchise-ssg-preview
          git commit -m 'Regenerate franchise SSG preview [skip franchise-ssg]'
          git pull --rebase origin main
          git push origin HEAD:main

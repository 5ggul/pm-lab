name: franchise-browser-assets

on:
  pull_request:
    paths:
      - 'franchise-ssg-core/browser-regression-assets*'
      - 'franchise-ssg-core/run-fix-v11-52-browser-regressions.mjs'
      - 'franchise-ssg-core/run-generate-v11-52-release-candidate.mjs'
      - 'franchise-ssg-core/run-validate-v11-52-release-candidate.mjs'
      - '.github/workflows/franchise-browser-assets.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: franchise-browser-assets-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  regression-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test asset repair and RC integration contracts
        run: node --test franchise-ssg-core/browser-regression-assets.test.mjs
      # Unit/contract tests use temporary fixtures only. No build, commit or deploy.

name: franchise-browser-assets

on:
  pull_request:
    paths:
      - 'franchise-ssg-core/browser-regression-assets*'
      - 'franchise-ssg-core/layout-containment-browser.mjs'
      - 'franchise-ssg-core/compare-interaction-browser.mjs'
      - 'franchise-ssg-core/monthly-profit-browser.mjs'
      - 'franchise-ssg-core/run-fix-v11-52-browser-regressions.mjs'
      - 'franchise-ssg-core/run-generate-v11-52-release-candidate.mjs'
      - 'franchise-ssg-core/run-validate-v11-52-release-candidate.mjs'
      - '.github/workflows/franchise-browser-assets.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: franchise-browser-assets-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  regression-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      SSG_QA_BASE_URL: http://127.0.0.1:8765/pm-lab/franchise-ssg-preview/
      SSG_QA_OUTPUT: artifacts/franchise-layout-containment
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test asset repair and RC integration contracts
        run: node --test franchise-ssg-core/browser-regression-assets.test.mjs
      - name: Apply preview-only repair to checked-in review copy
        run: node franchise-ssg-core/run-fix-v11-52-browser-regressions.mjs
      - name: Install isolated Chromium tooling
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/franchise-layout"
          npm install --prefix "$RUNNER_TEMP/franchise-layout" --no-save playwright@1.55.0
          "$RUNNER_TEMP/franchise-layout/node_modules/.bin/playwright" install --with-deps chromium
          echo "SSG_QA_DEP_ROOT=$RUNNER_TEMP/franchise-layout" >> "$GITHUB_ENV"
      - name: Start loopback-only review server
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/franchise-web/pm-lab"
          ln -s "$GITHUB_WORKSPACE/docs/franchise-ssg-preview" "$RUNNER_TEMP/franchise-web/pm-lab/franchise-ssg-preview"
          python3 -m http.server 8765 --bind 127.0.0.1 --directory "$RUNNER_TEMP/franchise-web" > "$RUNNER_TEMP/franchise-server.log" 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --fail --silent "$SSG_QA_BASE_URL" > /dev/null; then exit 0; fi
            sleep 1
          done
          exit 1
      - name: Verify freshness rail and long category labels in Chromium
        run: node franchise-ssg-core/layout-containment-browser.mjs
      - name: Verify four-brand compare interactions in Chromium
        run: node franchise-ssg-core/compare-interaction-browser.mjs
      - name: Verify monthly-profit URL persistence in Chromium
        run: node franchise-ssg-core/monthly-profit-browser.mjs
      - name: Preserve browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: franchise-layout-containment-${{ github.run_id }}
          path: artifacts/franchise-layout-containment/
          retention-days: 14
      - name: Prove workflow did not alter source outside generated review assets
        if: always()
        run: |
          test -z "$(git status --porcelain -- . ':!docs/franchise-ssg-preview/assets/app.js' ':!docs/franchise-ssg-preview/assets/site.css' ':!artifacts/**')"
      # No commit, deploy, index or production step.

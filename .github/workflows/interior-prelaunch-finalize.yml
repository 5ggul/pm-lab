name: interior-prelaunch-finalize

on:
  push:
    branches:
      - interior-prelaunch-final-release
    paths:
      - 'scripts/interior-prelaunch-finalize.mjs'
      - '.github/workflows/interior-prelaunch-finalize.yml'

permissions:
  contents: write

concurrency:
  group: interior-prelaunch-finalize-\${{ github.ref }}
  cancel-in-progress: true

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: interior-prelaunch-final-release
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run prelaunch finalizer
        run: node scripts/interior-prelaunch-finalize.mjs

      - name: Validate generated diff
        run: |
          git diff --check
          test -f docs/interior-cost-preview/sitemap.xml
          test -f docs/interior-cost-preview/data/index-release-allowlist-v1.json
          test -f docs/interior-cost-preview/data/prelaunch-readiness-v1.json

      - name: Commit generated prelaunch changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/interior-cost-preview
          if git diff --cached --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git commit -m "feat(interior): finalize prelaunch SEO and content"
          git push origin HEAD:interior-prelaunch-final-release

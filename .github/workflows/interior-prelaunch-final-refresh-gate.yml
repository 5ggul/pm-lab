name: interior-prelaunch-final-refresh-gate

on:
  push:
    branches:
      - interior-prelaunch-final-qa-refresh
    paths:
      - 'tests/interior-prelaunch-finalization/**'
      - 'tests/interior-final-answer-links/**'
      - 'tests/interior-final-gate/**'
      - '.github/workflows/interior-prelaunch-final-refresh-gate.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: interior-prelaunch-final-refresh-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  final-prelaunch-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout final candidate
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Syntax check
        run: |
          node --check tests/interior-prelaunch-finalization/ci-browser-qa.cjs
          node --check tests/interior-final-answer-links/sitewide-candidate.cjs
          node --check tests/interior-final-gate/sync.cjs
          node --check tests/interior-final-gate/import.cjs
          node --check tests/interior-final-gate/density.cjs
          node --check tests/interior-final-gate/allrows.cjs
          node --check scripts/interior-prelaunch-finalize.mjs
          node --check interior-cost-core/enhance-v11.mjs

      - name: Install Playwright
        run: |
          mkdir -p /tmp/interior-final-refresh
          cd /tmp/interior-final-refresh
          npm init -y >/dev/null 2>&1
          npm install --no-audit --no-fund playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Start candidate server
        run: |
          ln -sfn docs pm-lab
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/interior-final-refresh-http.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4173/pm-lab/interior-cost-preview/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/interior-final-refresh-http.log || true
          exit 1

      - name: Start HTTPS tunnel
        run: |
          curl -fsSL --retry 5 --retry-delay 2 -o /tmp/cloudflared \
            https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64
          chmod +x /tmp/cloudflared
          /tmp/cloudflared tunnel --no-autoupdate --url http://127.0.0.1:4173 >/tmp/interior-final-refresh-cloudflared.log 2>&1 &
          URL=''
          for i in $(seq 1 60); do
            URL=$(grep -Eo 'https://[-a-z0-9]+\.trycloudflare\.com' /tmp/interior-final-refresh-cloudflared.log | head -n1 || true)
            if [ -n "$URL" ]; then break; fi
            sleep 1
          done
          if [ -z "$URL" ]; then cat /tmp/interior-final-refresh-cloudflared.log || true; exit 1; fi
          echo "QA_BASE_URL=$URL" >> "$GITHUB_ENV"
          for i in $(seq 1 90); do
            if curl -fsS --connect-timeout 5 "$URL/pm-lab/interior-cost-preview/" >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/interior-final-refresh-cloudflared.log || true
          exit 1

      - name: Run prelaunch release QA
        run: |
          set +e
          PLAYWRIGHT_MODULE=/tmp/interior-final-refresh/node_modules/playwright node tests/interior-prelaunch-finalization/ci-browser-qa.cjs
          echo $? > /tmp/prelaunch.exit
          exit 0

      - name: Run sitewide answer-link QA
        run: |
          set +e
          PLAYWRIGHT_MODULE=/tmp/interior-final-refresh/node_modules/playwright QA_RESULT_PATH=sitewide-refresh.json node tests/interior-final-answer-links/sitewide-candidate.cjs
          echo $? > /tmp/sitewide.exit
          exit 0

      - name: Run deep handoff and multi-tab QA
        run: |
          set +e
          PLAYWRIGHT_MODULE=/tmp/interior-final-refresh/node_modules/playwright QA_RESULT_PATH=sync-refresh.json node tests/interior-final-gate/sync.cjs
          echo $? > /tmp/sync.exit
          exit 0

      - name: Run import integrity QA
        run: |
          set +e
          PLAYWRIGHT_MODULE=/tmp/interior-final-refresh/node_modules/playwright QA_RESULT_PATH=import-refresh.json node tests/interior-final-gate/import.cjs
          echo $? > /tmp/import.exit
          exit 0

      - name: Run compact compare QA
        run: |
          set +e
          PLAYWRIGHT_MODULE=/tmp/interior-final-refresh/node_modules/playwright QA_RESULT_PATH=density-refresh.json node tests/interior-final-gate/density.cjs
          echo $? > /tmp/density.exit
          exit 0

      - name: Run all-rows quote-check QA
        run: |
          set +e
          PLAYWRIGHT_MODULE=/tmp/interior-final-refresh/node_modules/playwright QA_RESULT_PATH=allrows-refresh.json node tests/interior-final-gate/allrows.cjs
          echo $? > /tmp/allrows.exit
          exit 0

      - name: Final gate
        run: |
          pre=$(cat /tmp/prelaunch.exit)
          site=$(cat /tmp/sitewide.exit)
          sync=$(cat /tmp/sync.exit)
          imp=$(cat /tmp/import.exit)
          density=$(cat /tmp/density.exit)
          allrows=$(cat /tmp/allrows.exit)
          echo "PRELAUNCH_EXIT=$pre"
          echo "SITEWIDE_EXIT=$site"
          echo "SYNC_EXIT=$sync"
          echo "IMPORT_EXIT=$imp"
          echo "DENSITY_EXIT=$density"
          echo "ALLROWS_EXIT=$allrows"
          node - <<'NODE'
          const fs=require('fs');
          for (const f of ['sitewide-refresh.json','sync-refresh.json','import-refresh.json','density-refresh.json','allrows-refresh.json']) {
            if (!fs.existsSync(f)) { console.log(f+': no report'); continue; }
            const r=JSON.parse(fs.readFileSync(f,'utf8'));
            console.log(f+': passed='+(r.passed??'?')+' failed='+(r.failed??'?'));
          }
          NODE
          if [ "$pre" != "0" ] || [ "$site" != "0" ] || [ "$sync" != "0" ] || [ "$imp" != "0" ] || [ "$density" != "0" ] || [ "$allrows" != "0" ]; then
            exit 1
          fi

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: interior-prelaunch-final-refresh-gate
          path: |
            sitewide-refresh.json
            sync-refresh.json
            import-refresh.json
            density-refresh.json
            allrows-refresh.json
            /tmp/interior-final-refresh-http.log
            /tmp/interior-final-refresh-cloudflared.log
          if-no-files-found: warn
          retention-days: 14

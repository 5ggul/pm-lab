name: interior-final-sitewide-live-audit

on:
  push:
    branches:
      - interior-final-live-verification
    paths:
      - 'tests/interior-final-gate/sitewide.cjs'
      - '.github/workflows/interior-final-sitewide-live-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sitewide-live-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PLAYWRIGHT_MODULE: /tmp/interior-sitewide-ci/node_modules/playwright
      QA_RESULT_PATH: sitewide-live.json
    steps:
      - name: Checkout verification branch
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Syntax check sitewide audit
        run: node --check tests/interior-final-gate/sitewide.cjs

      - name: Install isolated Playwright Chromium
        run: |
          mkdir -p /tmp/interior-sitewide-ci
          cd /tmp/interior-sitewide-ci
          npm init -y >/dev/null 2>&1
          npm install --no-audit --no-fund playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Run live sitewide audit
        run: node tests/interior-final-gate/sitewide.cjs

      - name: Upload sitewide evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: interior-final-sitewide-live-audit
          path: sitewide-live.json
          if-no-files-found: warn
          retention-days: 14

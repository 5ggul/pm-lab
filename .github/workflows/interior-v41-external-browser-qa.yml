name: interior-v41-external-browser-qa

on:
  push:
    branches:
      - interior-v40-preview
    paths:
      - 'docs/interior-v41-preview/**'
      - '.github/workflows/interior-v41-external-browser-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: interior-v41-external-browser-qa-\${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install isolated Playwright Chromium
        run: |
          mkdir -p /tmp/interior-v41-ci
          cd /tmp/interior-v41-ci
          npm init -y >/dev/null 2>&1
          npm install --no-audit --no-fund playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Start review-only static server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/interior-v41-http.log 2>&1 &
          echo $! >/tmp/interior-v41-http.pid
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4173/docs/interior-v41-preview/production-shell/self-check.html >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/interior-v41-http.log || true
          exit 1

      - name: Start ephemeral HTTPS quick tunnel
        id: tunnel
        run: |
          curl -fsSL --retry 5 --retry-delay 2 \
            -o /tmp/cloudflared \
            https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64
          chmod +x /tmp/cloudflared
          /tmp/cloudflared tunnel --no-autoupdate --url http://127.0.0.1:4173 >/tmp/interior-v41-cloudflared.log 2>&1 &
          echo $! >/tmp/interior-v41-cloudflared.pid

          URL=''
          for i in $(seq 1 60); do
            URL=$(grep -Eo 'https://[-a-z0-9]+\.trycloudflare\.com' /tmp/interior-v41-cloudflared.log | head -n1 || true)
            if [ -n "$URL" ]; then
              break
            fi
            sleep 1
          done

          if [ -z "$URL" ]; then
            cat /tmp/interior-v41-cloudflared.log || true
            exit 1
          fi

          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "QA_BASE_URL=$URL" >> "$GITHUB_ENV"

          for i in $(seq 1 30); do
            if curl -fsS "$URL/docs/interior-v41-preview/production-shell/self-check.html" >/dev/null; then
              echo "HTTPS preview ready"
              exit 0
            fi
            sleep 1
          done

          cat /tmp/interior-v41-cloudflared.log || true
          exit 1

      - name: Run external browser QA
        env:
          PLAYWRIGHT_MODULE: /tmp/interior-v41-ci/node_modules/playwright
          QA_RESULT_PATH: interior-v41-external-browser-qa.json
        run: |
          node docs/interior-v41-preview/ci-external-browser-qa.cjs

      - name: Write QA summary
        if: always()
        run: |
          {
            echo '## Interior v41 external browser QA'
            echo
            echo "- Commit: \`$GITHUB_SHA\`"
            if [ -n "$QA_BASE_URL" ]; then
              echo "- Ephemeral HTTPS origin: \`$QA_BASE_URL\`"
            else
              echo "- Ephemeral HTTPS origin: \`not-created\`"
            fi
            if [ -f interior-v41-external-browser-qa.json ]; then
              node - <<'NODE'
          const fs=require('fs');
          const r=JSON.parse(fs.readFileSync('interior-v41-external-browser-qa.json','utf8'));
          console.log('- Automatic hosted checks: \`' + (r.automaticChecks ?? 'incomplete') + '\`');
          console.log('- Browser assertions passed: \`' + (r.passed ?? 0) + '\`');
          console.log('- Failures: \`' + (r.failed ?? 0) + '\`');
          console.log('- Mobile widths: \`' + ((r.mobileWidths||[]).join(', ') || 'incomplete') + '\`');
          NODE
            else
              echo '- QA JSON: not produced'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload QA artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: interior-v41-external-browser-qa
          path: |
            interior-v41-external-browser-qa.json
            /tmp/interior-v41-http.log
            /tmp/interior-v41-cloudflared.log
          if-no-files-found: warn
          retention-days: 14

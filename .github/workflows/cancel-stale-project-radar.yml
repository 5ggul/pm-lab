name: cancel-stale-project-radar

on:
  issues:
    types: [opened]

permissions:
  actions: write
  issues: write
  contents: read

jobs:
  cancel:
    if: github.event.issue.title == 'cancel-stale-project-radar'
    runs-on: ubuntu-latest
    steps:
      - name: Cancel stale run
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST repos/5ggul/pm-lab/actions/runs/35459189703/cancel
      - name: Close trigger
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue close "${{ github.event.issue.number }}" --repo 5ggul/pm-lab --reason completed

name: interior-v24-integration-validation

on:
  push:
    branches: [interior-v24-integrated-preview]
    paths:
      - 'interior-cost-core/**'
      - '.github/workflows/interior-v24-integration-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-v24:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate integrated preview through v24
        run: |
          node interior-cost-core/run-generate-v5.mjs
          node interior-cost-core/postprocess-review-date.mjs
          node interior-cost-core/enhance-v20-g2b-costrefs.mjs
          node interior-cost-core/enhance-v20-g2b-compare.mjs
          node interior-cost-core/enhance-v22-editorial-matrix.mjs
          node interior-cost-core/enhance-v23-insulation-reference.mjs
          node interior-cost-core/enhance-v23-insulation-postfix.mjs
          node interior-cost-core/enhance-v22-quote-lines.mjs
          node interior-cost-core/enhance-v23-quote-import.mjs
      - name: Syntax checks
        run: |
          node --check interior-cost-core/enhance-v20-g2b-costrefs.mjs
          node --check interior-cost-core/enhance-v20-g2b-compare.mjs
          node --check interior-cost-core/enhance-v22-editorial-matrix.mjs
          node --check interior-cost-core/enhance-v23-insulation-reference.mjs
          node --check interior-cost-core/enhance-v23-insulation-postfix.mjs
          node --check interior-cost-core/enhance-v22-quote-lines.mjs
          node --check interior-cost-core/enhance-v23-quote-import.mjs
          node --check interior-cost-core/app-v20.js
          node --check interior-cost-core/app-v22.js
          node --check interior-cost-core/app-v23.js
          node --check interior-cost-core/validate-v24-integration.mjs
          node --check interior-cost-core/browser-v24.spec.cjs
      - name: Run prior matrix and insulation gates
        run: |
          node interior-cost-core/validate-v22-matrix-release.mjs
          node interior-cost-core/validate-v23-insulation-reference.mjs
      - name: Run v24 integration gate
        run: node interior-cost-core/validate-v24-integration.mjs
      - name: Preview safety boundary
        shell: bash
        run: |
          ROOT='docs/interior-cost-preview'
          test ! -f "$ROOT/CNAME"
          test -s "$ROOT/data/g2b-quote-compare-v20.json"
          test -s "$ROOT/data/v24-integration-audit.json"
          test -s "$ROOT/compare/quote-lines/index.html"
          grep -Fq 'noindex,nofollow' "$ROOT/compare/quote-lines/index.html"
          grep -Fq 'data-v23-import' "$ROOT/compare/quote-lines/index.html"
          grep -Fq 'data-v22-quote-lines-entry' "$ROOT/interior-cost/matrix/index.html"
          test "$(grep -R -l 'noindex,nofollow' "$ROOT/interior-cost/matrix" --include='*.html' | wc -l)" -ge 25
          if grep -R -n -E 'adsbygoogle|pagead2\.googlesyndication\.com|serviceKey|invstDeptTelNo|invstOfclNm|cntrctCorpTelNo' "$ROOT/compare/quote-lines" "$ROOT/data/v24-integration-audit.json"; then exit 1; fi

  browser-v24:
    needs: static-v24
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate integrated preview through v24
        run: |
          node interior-cost-core/run-generate-v5.mjs
          node interior-cost-core/postprocess-review-date.mjs
          node interior-cost-core/enhance-v20-g2b-costrefs.mjs
          node interior-cost-core/enhance-v20-g2b-compare.mjs
          node interior-cost-core/enhance-v22-editorial-matrix.mjs
          node interior-cost-core/enhance-v23-insulation-reference.mjs
          node interior-cost-core/enhance-v23-insulation-postfix.mjs
          node interior-cost-core/enhance-v22-quote-lines.mjs
          node interior-cost-core/enhance-v23-quote-import.mjs
          node interior-cost-core/validate-v24-integration.mjs
      - name: Install Chromium test runtime
        run: |
          npm install --no-save --package-lock=false @playwright/test@1.55.0
          npx playwright install --with-deps chromium
      - name: Serve preview at GitHub Pages path
        run: |
          SERVE=/tmp/interior-v24-site
          rm -rf "$SERVE"
          mkdir -p "$SERVE/pm-lab"
          ln -s "$GITHUB_WORKSPACE/docs/interior-cost-preview" "$SERVE/pm-lab/interior-cost-preview"
          python3 -m http.server 4173 --directory "$SERVE" >/tmp/interior-v24-http.log 2>&1 &
          for i in $(seq 1 20); do curl -fsS http://127.0.0.1:4173/pm-lab/interior-cost-preview/ >/dev/null && exit 0; sleep 1; done
          cat /tmp/interior-v24-http.log
          exit 1
      - name: Run v24 Chromium integration audits
        shell: bash
        run: |
          mkdir -p artifacts/v24-browser
          set -o pipefail
          npx playwright test interior-cost-core/browser-v24.spec.cjs --reporter=line --workers=1 2>&1 | tee artifacts/v24-browser/playwright-line.log
      - name: Upload v24 browser audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: interior-v24-browser-audit
          path: artifacts/v24-browser/
          if-no-files-found: error
          retention-days: 14

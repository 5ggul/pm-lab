name: Meme Radar Longitudinal Learning

on:
  workflow_dispatch:
    inputs:
      phase_minutes:
        description: 'Minutes per phase. Default 190 x 2 = 6h20m total.'
        required: true
        default: '190'

permissions:
  contents: read
  actions: read

# Manual only: a full run consumes substantial Actions time. Two jobs avoid the hosted-runner
# per-job ceiling while covering a true 6h horizon plus 20m headroom for entries created just
# before launch. The final cache is published only if the branch stayed unchanged and no Shadow
# Soak started after this workflow, preventing a stale long-run snapshot from overwriting newer data.
concurrency:
  group: meme-radar-longitudinal-${{ github.ref }}
  cancel-in-progress: false

env:
  SHADOW_CACHE_PREFIX: meme-radar-shadow-state-v1-${{ runner.os }}-${{ github.ref_name }}

jobs:
  phase-one:
    runs-on: ubuntu-latest
    timeout-minutes: 210
    outputs:
      workflow_started_at: ${{ steps.run-meta.outputs.started_at }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Capture workflow start and reject overlapping Shadow Soak
        id: run-meta
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          RUN_JSON="$(curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}")"
          STARTED_AT="$(printf '%s' "$RUN_JSON" | jq -r '.created_at')"
          echo "started_at=${STARTED_AT}" >> "$GITHUB_OUTPUT"
          RUNS="$(curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs?branch=${GITHUB_REF_NAME}&status=in_progress&per_page=100")"
          ACTIVE="$(printf '%s' "$RUNS" | jq '[.workflow_runs[] | select(.name == "Meme Radar Shadow Soak")] | length')"
          if [ "$ACTIVE" -gt 0 ]; then
            echo "Refusing to start while a Shadow Soak is active (${ACTIVE})." >&2
            exit 1
          fi
      - name: Restore canonical learning state
        uses: actions/cache/restore@v4
        with:
          path: meme-radar-core/shadow-soak.sqlite
          key: ${{ env.SHADOW_CACHE_PREFIX }}-${{ github.run_id }}-longitudinal-bootstrap
          restore-keys: |
            ${{ env.SHADOW_CACHE_PREFIX }}-
      - name: Install runtime dependencies
        working-directory: meme-radar-core
        run: npm install --no-audit --no-fund
      - name: Run longitudinal sampler phase 1
        working-directory: meme-radar-core
        env:
          RADAR_DB_PATH: shadow-soak.sqlite
          LONGITUDINAL_DURATION_MIN: ${{ inputs.phase_minutes }}
          HORIZON_SAMPLE_INTERVAL_MS: '30000'
          HORIZON_SAMPLE_MAX_TOKENS: '100'
          RH_ENABLE_LEGACY_POOLS: '0'
        run: npm run sample:longitudinal | tee longitudinal-phase-1.log
      - name: Save phase-1 checkpoint
        if: always()
        uses: actions/cache/save@v4
        with:
          path: meme-radar-core/shadow-soak.sqlite
          key: ${{ env.SHADOW_CACHE_PREFIX }}-${{ github.run_id }}-longitudinal-phase1
      - name: Upload phase-1 diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: meme-radar-longitudinal-phase-1
          path: |
            meme-radar-core/longitudinal-phase-1.log
            meme-radar-core/shadow-soak.sqlite
          if-no-files-found: warn
          retention-days: 7

  phase-two:
    needs: phase-one
    runs-on: ubuntu-latest
    timeout-minutes: 210
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Restore exact phase-1 checkpoint
        uses: actions/cache/restore@v4
        with:
          path: meme-radar-core/shadow-soak.sqlite
          key: ${{ env.SHADOW_CACHE_PREFIX }}-${{ github.run_id }}-longitudinal-phase1
          fail-on-cache-miss: true
      - name: Install runtime dependencies
        working-directory: meme-radar-core
        run: npm install --no-audit --no-fund
      - name: Run longitudinal sampler phase 2
        working-directory: meme-radar-core
        env:
          RADAR_DB_PATH: shadow-soak.sqlite
          LONGITUDINAL_DURATION_MIN: ${{ inputs.phase_minutes }}
          HORIZON_SAMPLE_INTERVAL_MS: '30000'
          HORIZON_SAMPLE_MAX_TOKENS: '100'
          RH_ENABLE_LEGACY_POOLS: '0'
        run: npm run sample:longitudinal | tee longitudinal-phase-2.log
      - name: Guard canonical cache publication
        id: publish-guard
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          WORKFLOW_STARTED_AT: ${{ needs.phase-one.outputs.workflow_started_at }}
        run: |
          set -euo pipefail
          PUBLISH=true
          CURRENT_SHA="$(git ls-remote origin "refs/heads/${GITHUB_REF_NAME}" | cut -f1)"
          if [ "$CURRENT_SHA" != "$GITHUB_SHA" ]; then
            echo "Branch moved from ${GITHUB_SHA} to ${CURRENT_SHA}; canonical cache will not be published."
            PUBLISH=false
          fi
          RUNS="$(curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs?branch=${GITHUB_REF_NAME}&per_page=100")"
          NEW_SHADOWS="$(printf '%s' "$RUNS" | jq --arg started "$WORKFLOW_STARTED_AT" '[.workflow_runs[] | select(.name == "Meme Radar Shadow Soak" and .created_at > $started)] | length')"
          if [ "$NEW_SHADOWS" -gt 0 ]; then
            echo "${NEW_SHADOWS} Shadow Soak run(s) started after longitudinal launch; canonical cache will not be published."
            PUBLISH=false
          fi
          echo "publish=${PUBLISH}" >> "$GITHUB_OUTPUT"
      - name: Publish final canonical learning state
        if: always() && steps.publish-guard.outputs.publish == 'true'
        uses: actions/cache/save@v4
        with:
          path: meme-radar-core/shadow-soak.sqlite
          key: ${{ env.SHADOW_CACHE_PREFIX }}-${{ github.run_id }}-longitudinal-final
      - name: Build final learning report
        if: always()
        working-directory: meme-radar-core
        env:
          RADAR_DB_PATH: shadow-soak.sqlite
          SHADOW_REPORT_OUT: longitudinal-report.json
        run: npm run report:shadow
      - name: Upload final longitudinal artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: meme-radar-longitudinal-learning
          path: |
            meme-radar-core/longitudinal-report.json
            meme-radar-core/longitudinal-phase-2.log
            meme-radar-core/shadow-soak.sqlite
          if-no-files-found: warn
          retention-days: 7

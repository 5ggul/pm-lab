name: project-radar-cloud-daemon

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/project-radar-cloud-daemon.yml'

permissions:
  actions: write
  contents: read

concurrency:
  group: project-radar-cloud-daemon
  cancel-in-progress: false

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - name: Dispatch collector every five minutes
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/$REPO/actions/workflows/project-radar-pumps.yml/dispatches"
          for i in $(seq 1 12); do
            echo "collector tick $i/12 $(date -u +%FT%TZ)"
            code=$(curl -sS -o /tmp/dispatch.out -w '%{http_code}'               -X POST               -H "Authorization: Bearer $GH_TOKEN"               -H "Accept: application/vnd.github+json"               -H "X-GitHub-Api-Version: 2022-11-28"               "$api"               -d '{"ref":"main"}')
            if [ "$code" != "204" ]; then
              echo "collector dispatch failed: HTTP $code"
              cat /tmp/dispatch.out || true
              exit 1
            fi
            if [ "$i" -lt 12 ]; then sleep 300; fi
          done

      - name: Hand off to next daemon run
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/$REPO/actions/workflows/project-radar-cloud-daemon.yml/dispatches"
          for attempt in 1 2 3; do
            code=$(curl -sS -o /tmp/daemon.out -w '%{http_code}'               -X POST               -H "Authorization: Bearer $GH_TOKEN"               -H "Accept: application/vnd.github+json"               -H "X-GitHub-Api-Version: 2022-11-28"               "$api"               -d '{"ref":"main"}' || true)
            if [ "$code" = "204" ]; then
              echo "next daemon queued"
              exit 0
            fi
            echo "daemon handoff attempt $attempt failed: HTTP $code"
            cat /tmp/daemon.out || true
            sleep 10
          done
          exit 1

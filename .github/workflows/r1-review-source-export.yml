name: r1 review source export
on:
  pull_request:
    paths:
      - '.github/workflows/r1-review-source-export.yml'
permissions:
  contents: read
jobs:
  export:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'feat/r1-oreun-release-candidate'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Archive tracked code only
        run: |
          mkdir /tmp/r1-source
          git archive --format=tar.gz HEAD apps/oreun .github/workflows > /tmp/r1-source/source.tar.gz
          git rev-parse HEAD > /tmp/r1-source/HEAD.txt
      - uses: actions/upload-artifact@v4
        with:
          name: r1-review-source
          path: /tmp/r1-source/
          retention-days: 1

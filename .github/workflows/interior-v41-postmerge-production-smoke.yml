name: interior-v41-postmerge-production-smoke

on:
  push:
    branches:
      - interior-v41-production-candidate
    paths:
      - 'tests/interior-v41-postmerge-smoke/**'
      - '.github/workflows/interior-v41-postmerge-production-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: interior-v41-postmerge-production-smoke-\${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout smoke branch
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install isolated Playwright Chromium
        run: |
          mkdir -p /tmp/interior-v41-postmerge
          cd /tmp/interior-v41-postmerge
          npm init -y >/dev/null 2>&1
          npm install --no-audit --no-fund playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Run public production smoke
        env:
          PLAYWRIGHT_MODULE: /tmp/interior-v41-postmerge/node_modules/playwright
        run: node tests/interior-v41-postmerge-smoke/production-smoke.cjs

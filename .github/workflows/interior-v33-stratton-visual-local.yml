name: interior-v33-stratton-visual-local
on:
  push:
    branches: [interior-v33-stratton-visual]
    paths:
      - 'interior-cost-core/site-v33-stratton-visual.css'
      - 'interior-cost-core/enhance-v33-stratton-visual.mjs'
      - 'interior-cost-core/run-v33-stratton-visual-local.mjs'
      - 'interior-cost-core/validate-v33-stratton-visual.mjs'
      - 'interior-cost-core/browser-v33.spec.cjs'
      - 'interior-cost-core/build-v33-local.sh'
      - 'interior-cost-core/v33-assets/**'
      - '.github/workflows/interior-v33-stratton-visual-local.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: interior-v33-stratton-visual-local
  cancel-in-progress: true
env:
  BRANCH: interior-v33-stratton-visual
jobs:
  static-v33:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: '${{ env.BRANCH }}'}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Build v33 from committed photo assets
        run: bash interior-cost-core/build-v33-local.sh
      - name: Safety gate
        run: |
          ROOT=docs/interior-cost-preview
          test ! -f "$ROOT/CNAME"
          test "$(grep -R -l 'noindex' "$ROOT" --include='*.html' | wc -l)" -eq "$(find "$ROOT" -name '*.html' | wc -l)"
          test "$(find "$ROOT/assets/v33" -name '*.jpg' | wc -l)" -eq 8
          if grep -R -n -E 'adsbygoogle|pagead2\.googlesyndication\.com|site-v32-stratton|v32-stratton|site-v30-hyper|v30-hyper' "$ROOT" --include='*.html'; then exit 1; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: interior-v33-static-local
          path: |
            docs/interior-cost-preview/data/v33-stratton-visual.json
            docs/interior-cost-preview/data/v33-stratton-visual-validation.json
            docs/interior-cost-preview/data/v33-photo-sources.json
          retention-days: 14
  browser-v33:
    needs: static-v33
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with: {ref: '${{ env.BRANCH }}'}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Build preview
        run: bash interior-cost-core/build-v33-local.sh
      - name: Install Chromium
        run: |
          npm install --no-save --package-lock=false @playwright/test@1.55.0
          npx playwright install --with-deps chromium
      - name: Serve preview
        run: |
          SERVE=/tmp/interior-v33-local
          rm -rf "$SERVE" && mkdir -p "$SERVE/pm-lab"
          ln -s "$GITHUB_WORKSPACE/docs/interior-cost-preview" "$SERVE/pm-lab/interior-cost-preview"
          python3 -m http.server 4173 --directory "$SERVE" >/tmp/interior-v33-local-http.log 2>&1 &
          for i in $(seq 1 20); do curl -fsS http://127.0.0.1:4173/pm-lab/interior-cost-preview/ >/dev/null && exit 0; sleep 1; done
          cat /tmp/interior-v33-local-http.log; exit 1
      - name: Run mobile and desktop visual QA
        run: |
          set -o pipefail
          npx playwright test interior-cost-core/browser-v33.spec.cjs --reporter=line --workers=1 2>&1 | tee artifacts-v33-local.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: interior-v33-browser-local
          path: |
            artifacts/v33-browser/
            artifacts-v33-local.log
          retention-days: 14
  publish-noindex-preview:
    needs: [static-v33,browser-v33]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: '${{ env.BRANCH }}', fetch-depth: 1}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Generate reviewed build
        run: |
          bash interior-cost-core/build-v33-local.sh
          rm -rf /tmp/v33-local-preview && mkdir -p /tmp/v33-local-preview
          cp -a docs/interior-cost-preview/. /tmp/v33-local-preview/
      - name: Publish generated noindex preview only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git reset --hard HEAD && git clean -fd
          git fetch origin main
          git checkout -B main origin/main
          rm -rf docs/interior-cost-preview && mkdir -p docs/interior-cost-preview
          cp -a /tmp/v33-local-preview/. docs/interior-cost-preview/
          test ! -f docs/interior-cost-preview/CNAME
          test "$(grep -R -l 'noindex' docs/interior-cost-preview --include='*.html' | wc -l)" -eq "$(find docs/interior-cost-preview -name '*.html' | wc -l)"
          git add docs/interior-cost-preview
          if git diff --cached --quiet; then echo 'Preview already current'; exit 0; fi
          git commit -m 'Publish v33 photo-led noindex preview'
          for attempt in 1 2 3; do if git push origin HEAD:main; then exit 0; fi; git pull --rebase origin main; done
          exit 1
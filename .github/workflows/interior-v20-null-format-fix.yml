name: interior-v20-null-format-fix

on:
  push:
    branches:
      - interior-v20-g2b-data
    paths:
      - 'interior-cost-core/scripts/fix-v20-null-format.mjs'
      - '.github/workflows/interior-v20-null-format-fix.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: interior-v20-g2b-data
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Patch null formatter
        run: node interior-cost-core/scripts/fix-v20-null-format.mjs
      - name: Verify formatter behavior
        run: |
          node - <<'NODE'
          const fmt=n=>n!==null&&n!==undefined&&n!==''&&Number.isFinite(Number(n))?Number(n).toLocaleString('ko-KR'):'-';
          if(fmt(null)!=='-'||fmt(undefined)!=='-'||fmt('')!=='-'||fmt(0)!=='0'||fmt(1234)!=='1,234') process.exit(1);
          NODE
      - name: Commit patched enhancers
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add interior-cost-core/enhance-v20-g2b.mjs interior-cost-core/enhance-v20-g2b-costrefs.mjs
          if git diff --cached --quiet; then
            echo 'No formatter changes.'
            exit 0
          fi
          git commit -m 'fix: preserve missing G2B prices as unknown'
          git push origin HEAD:interior-v20-g2b-data

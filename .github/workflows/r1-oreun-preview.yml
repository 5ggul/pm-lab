name: r1 oreun preview qa

on:
  pull_request:
    paths:
      - 'apps/oreun/**'
      - 'apps/oreun-relay-vercel/**'
      - '.github/workflows/r1-oreun-preview.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: r1-oreun-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      R1_PREVIEW_NO_INDEX: '1'
      R1_INDEX_RELEASE_CONFIRM: '0'
      R1_ROBLOX_COMMUNITY_ANALYTICS: '0'
      NEXT_PUBLIC_SITE_URL: 'http://127.0.0.1:3000'
      VERCEL_SCOPE: 'ntplqyme30-9990s-projects'
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      NEXT_PUBLIC_SUPABASE_URL: 'https://galfwxoytdcndjihdnyg.supabase.co'
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: 'sb_publishable_j7auN01lnSmQC-tQykfKyg_N81r33iI'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/oreun/package-lock.json
      - name: Install dependencies
        working-directory: apps/oreun
        run: npm ci
      - name: Dependency tree diagnostic
        working-directory: apps/oreun
        run: npm ls --all --package-lock-only
      - name: Dependency security audit
        id: dependency_audit
        continue-on-error: true
        working-directory: apps/oreun
        run: node scripts/audit-lockfile.mjs
      - name: Provider smoke check
        working-directory: apps/oreun
        run: npm run smoke:roblox
      - name: Typecheck
        working-directory: apps/oreun
        run: npm run typecheck
      - name: Unit tests
        working-directory: apps/oreun
        run: npm test
      - name: Build
        working-directory: apps/oreun
        run: npm run build
      - name: Install Chromium for browser QA
        working-directory: apps/oreun
        run: npx playwright install --with-deps chromium
      - name: Browser QA with clearly labeled preview historical fixture
        working-directory: apps/oreun
        shell: bash
        run: |
          set -euo pipefail
          R1_PREVIEW_FIXTURES=0 npm run dev -- --hostname 127.0.0.1 --port 3000 >/tmp/r1-next.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true; cat /tmp/r1-next.log || true' EXIT
          for i in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:3000 >/dev/null; then break; fi
            sleep 1
          done
          QA_BASE_URL=http://127.0.0.1:3000 npm run qa:browser
      - name: Release-mode guard QA with non-production review origin
        working-directory: apps/oreun
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .next
          R1_PREVIEW_NO_INDEX=0 \
          R1_INDEX_RELEASE_CONFIRM=1 \
          NEXT_PUBLIC_SITE_URL=https://oreun-review.example.com \
          npm run build
          R1_PREVIEW_NO_INDEX=0 \
          R1_INDEX_RELEASE_CONFIRM=1 \
          NEXT_PUBLIC_SITE_URL=https://oreun-review.example.com \
          npm run start -- --hostname 127.0.0.1 --port 3001 >/tmp/r1-release.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true; cat /tmp/r1-release.log || true' EXIT
          for i in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:3001 >/dev/null; then break; fi
            sleep 1
          done
          QA_BASE_URL=http://127.0.0.1:3001 \
          QA_EXPECTED_SITE_URL=https://oreun-review.example.com \
          npm run qa:release-guard
      - name: Live Edge review endpoint contract QA
        working-directory: apps/oreun
        env:
          R1_EDGE_PREVIEW_URL: https://galfwxoytdcndjihdnyg.supabase.co/functions/v1/r1-web-preview
        run: npm run qa:edge-preview
      - name: Hosted Preview handoff
        run: echo "Hosted Next.js deployment and external browser QA run in r1-oreun-hosted-preview.yml."

      - name: Enforce dependency security audit gate
        if: always()
        working-directory: apps/oreun
        shell: bash
        run: |
          set -euo pipefail
          status="$(cat audit-status.txt 2>/dev/null || echo unavailable)"
          echo "Dependency audit status: $status"
          if [ "$status" != "clean" ]; then
            echo "::error::Dependency security audit did not complete cleanly: $status"
            exit 1
          fi

      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r1-oreun-browser-qa
          path: |
            apps/oreun/qa-*.png
            apps/oreun/qa-edge-*.png
            apps/oreun/docs/QA-REPORT.md
            apps/oreun/preview-url.txt
          if-no-files-found: warn
          retention-days: 7


  relay:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.ref == 'feat/r1-oreun-release-candidate'
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_SCOPE: ntplqyme30-9990s-projects
      VERCEL_TEAM_ID: team_BQKteJdCX91oEdvszpFI7kQy
      VERCEL_PROJECT_NAME: oreun-r1-provider-relay-5ggul
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Require trusted Vercel credentials
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${VERCEL_TOKEN:-}" ]; then
            echo "::error::VERCEL_TOKEN is not configured."
            exit 1
          fi

      - name: Create or reuse dedicated relay project
        working-directory: apps/oreun-relay-vercel
        shell: bash
        run: |
          set -euo pipefail
          AUTH="Authorization: Bearer ${VERCEL_TOKEN}"
          STATUS="$(curl -sS -o /tmp/vercel-project.json -w '%{http_code}'             -H "$AUTH"             "https://api.vercel.com/v9/projects/${VERCEL_PROJECT_NAME}?teamId=${VERCEL_TEAM_ID}")"

          if [ "$STATUS" = "404" ]; then
            curl -fsS               -X POST               -H "$AUTH"               -H 'Content-Type: application/json'               "https://api.vercel.com/v11/projects?teamId=${VERCEL_TEAM_ID}"               --data "{"name":"${VERCEL_PROJECT_NAME}","framework":null,"skipGitConnectDuringLink":true}"               > /tmp/vercel-project.json
          elif [ "$STATUS" != "200" ]; then
            echo "::error::Vercel project lookup returned HTTP $STATUS"
            cat /tmp/vercel-project.json
            exit 1
          fi

          PROJECT_ID="$(node -e "const fs=require('fs');const x=JSON.parse(fs.readFileSync('/tmp/vercel-project.json','utf8'));if(!x.id)process.exit(2);process.stdout.write(x.id)")"
          mkdir -p .vercel
          printf '{"orgId":"%s","projectId":"%s"}\n' "$VERCEL_TEAM_ID" "$PROJECT_ID" > .vercel/project.json

      - name: Deployment dry run
        working-directory: apps/oreun-relay-vercel
        shell: bash
        run: |
          set -euo pipefail
          npx --yes vercel@59.19.1 deploy --dry --format=json             --token="$VERCEL_TOKEN"             --scope="$VERCEL_SCOPE"             > /tmp/vercel-dry-run.json
          node -e "const fs=require('fs');const x=JSON.parse(fs.readFileSync('/tmp/vercel-dry-run.json','utf8'));if(!JSON.stringify(x).includes('api/roblox.ts'))process.exit(2);console.log('relay dry-run includes api/roblox.ts')"

      - name: Deploy dedicated relay
        id: relay_deploy
        working-directory: apps/oreun-relay-vercel
        shell: bash
        run: |
          set -euo pipefail
          LOG="$(mktemp)"
          set +e
          npx --yes vercel@59.19.1 deploy --prod --yes             --token="$VERCEL_TOKEN"             --scope="$VERCEL_SCOPE" 2>&1 | tee "$LOG"
          STATUS=${PIPESTATUS[0]}
          set -e
          if [ "$STATUS" -ne 0 ]; then
            exit "$STATUS"
          fi
          URL="$(grep -Eo 'https://[^[:space:]]+\.vercel\.app' "$LOG" | tail -1 || true)"
          rm -f "$LOG"
          if [ -z "$URL" ]; then
            echo "::error::Deployment succeeded but Vercel URL was not found."
            exit 1
          fi
          printf '%s\n' "$URL" | tee relay-url.txt
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      - name: Verify relay contract
        working-directory: apps/oreun-relay-vercel
        env:
          RELAY_URL: ${{ steps.relay_deploy.outputs.url }}
        shell: bash
        run: |
          set -euo pipefail
          for i in 1 2 3; do
            curl -fsS --retry 3 --retry-delay 2               "$RELAY_URL/api/roblox?universeId=1686885941"               > "/tmp/relay-$i.json"
            node - "/tmp/relay-$i.json" <<'NODE'
          const fs = require("fs");
          const body = JSON.parse(fs.readFileSync(process.argv[2], "utf8"));
          const fetchedAt = Date.parse(body.fetchedAt || "");
          const age = Date.now() - fetchedAt;
          if (
            body.source !== "roblox_public_games_via_vercel" ||
            Number(body.game?.id) !== 1686885941 ||
            Number(body.game?.rootPlaceId) !== 4924922222 ||
            !Number.isFinite(Number(body.game?.playing)) ||
            Number(body.game?.playing) < 0 ||
            !Number.isFinite(fetchedAt) ||
            age < -30000 ||
            age > 120000
          ) {
            console.error(body);
            process.exit(1);
          }
          console.log(JSON.stringify({
            playing: body.game.playing,
            fetchedAt: body.fetchedAt,
            source: body.source
          }));
          NODE
            sleep 2
          done
          WRONG_STATUS="$(curl -sS -o /tmp/relay-wrong.json -w '%{http_code}' "$RELAY_URL/api/roblox?universeId=1")"
          test "$WRONG_STATUS" = "404"

      - name: Upload relay URL
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r1-oreun-provider-relay
          path: apps/oreun-relay-vercel/relay-url.txt
          if-no-files-found: warn
          retention-days: 7

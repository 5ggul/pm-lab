name: r1 oreun community ux qa
on:
  pull_request:
    paths:
      - 'apps/oreun/**'
      - '.github/workflows/r1-oreun-community-ux-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: r1-community-ux-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 18
    defaults:
      run:
        working-directory: apps/oreun
    env:
      R1_PREVIEW_NO_INDEX: '1'
      R1_INDEX_RELEASE_CONFIRM: '0'
      R1_PREVIEW_FIXTURES: '0'
      R1_COMMUNITY_UX_FIXTURE: '1'
      NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3100
      NEXT_PUBLIC_SUPABASE_URL: https://galfwxoytdcndjihdnyg.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_j7auN01lnSmQC-tQykfKyg_N81r33iI
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/oreun/package-lock.json
      - run: npm ci
      - name: Generate local-only component harness
        run: |
          test ! -e app/qa-community
          mkdir -p app/qa-community
          cp scripts/qa-fixtures/community-ux-page.tsx.txt app/qa-community/page.tsx
      - run: npm run typecheck && npm test && npm run build
      - run: npx playwright install --with-deps chromium webkit
      - name: Chromium and WebKit community interaction checks
        run: |
          set -euo pipefail
          npm run start -- --hostname 127.0.0.1 --port 3100 >/tmp/r1-community-ux.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true; rm -rf app/qa-community; cat /tmp/r1-community-ux.log' EXIT
          for i in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:3100/qa-community >/dev/null; then break; fi
            sleep 1
          done
          QA_BASE_URL=http://127.0.0.1:3100 node scripts/community-ux-browser-qa.mjs | tee community-ux-qa-result.json
      - name: Upload scoped QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r1-community-ux-qa
          path: |
            apps/oreun/qa-community-ux-*.png
            apps/oreun/qa-unanswered-*.png
            apps/oreun/community-ux-qa-result.json
          retention-days: 7

name: car-family-build

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'docs/car-data-preview/data/vehicle-families.json'
      - 'docs/car-data-preview/data/vehicle-generation-rules.json'
      - 'docs/car-data-preview/scripts/build-vehicle-families.mjs'
      - 'docs/car-data-preview/scripts/summarize-vehicle-families.mjs'
      - '.github/workflows/car-family-build.yml'

permissions:
  contents: write

concurrency:
  group: car-family-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build vehicle-family coverage from stored KEA snapshot
        run: node docs/car-data-preview/scripts/build-vehicle-families.mjs
      - name: Build compact vehicle-family QA summary
        run: node docs/car-data-preview/scripts/summarize-vehicle-families.mjs
      - name: Commit family staging outputs
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          FILES=(
            docs/car-data-preview/data/staging/vehicle-family-rows.json
            docs/car-data-preview/data/generated/vehicle-family-coverage.json
            docs/car-data-preview/data/generated/vehicle-family-summary.json
          )
          tar -czf /tmp/car-family-output.tgz "${FILES[@]}"
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            tar -xzf /tmp/car-family-output.tgz
            git add "${FILES[@]}"
            if git diff --cached --quiet; then
              echo "Vehicle-family outputs already current."
              exit 0
            fi
            git commit -m "data: refresh vehicle family coverage [car-family]"
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep $((attempt * 2))
          done
          exit 1

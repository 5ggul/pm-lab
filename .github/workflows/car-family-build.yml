name: car-family-build

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'docs/car-data-preview/data/raw/kea-car-efficiency.json'
      - 'docs/car-data-preview/data/raw/kea-car-display.json'
      - 'docs/car-data-preview/data/vehicle-families.json'
      - 'docs/car-data-preview/data/vehicle-generation-rules.json'
      - 'docs/car-data-preview/scripts/merge-kea-car-sources.mjs'
      - 'docs/car-data-preview/scripts/validate-kea-merge.mjs'
      - 'docs/car-data-preview/scripts/build-vehicle-families.mjs'
      - 'docs/car-data-preview/scripts/summarize-vehicle-families.mjs'
      - 'docs/car-data-preview/scripts/build-all-car-catalog.mjs'
      - 'docs/car-data-preview/scripts/validate-all-car-catalog.mjs'
      - 'docs/car-data-preview/scripts/build-service-hierarchy.mjs'
      - 'docs/car-data-preview/scripts/refine-service-hierarchy.mjs'
      - 'docs/car-data-preview/scripts/refine-hierarchy-backlog-rules.mjs'
      - 'docs/car-data-preview/scripts/write-service-hierarchy-status.mjs'
      - 'docs/car-data-preview/scripts/validate-service-hierarchy.mjs'
      - 'docs/car-data-preview/scripts/summarize-service-hierarchy.mjs'
      - 'docs/car-data-preview/scripts/report-hierarchy-backlog.mjs'
      - 'docs/car-data-preview/scripts/build-all-car-calc-index.mjs'
      - 'docs/car-data-preview/scripts/validate-all-car-calc-index.mjs'
      - 'docs/car-data-preview/scripts/validate-car-pipeline-coherence.mjs'
      - 'docs/car-data-preview/scripts/analyze-kea-join-opportunities.mjs'
      - 'docs/car-data-preview/scripts/analyze-powertrain-source-fields.mjs'
      - '.github/workflows/car-family-build.yml'
  pull_request:
    paths:
      - 'docs/car-data-preview/data/vehicle-families.json'
      - 'docs/car-data-preview/data/vehicle-generation-rules.json'
      - 'docs/car-data-preview/scripts/merge-kea-car-sources.mjs'
      - 'docs/car-data-preview/scripts/validate-kea-merge.mjs'
      - 'docs/car-data-preview/scripts/build-vehicle-families.mjs'
      - 'docs/car-data-preview/scripts/summarize-vehicle-families.mjs'
      - 'docs/car-data-preview/scripts/build-all-car-catalog.mjs'
      - 'docs/car-data-preview/scripts/validate-all-car-catalog.mjs'
      - 'docs/car-data-preview/scripts/build-service-hierarchy.mjs'
      - 'docs/car-data-preview/scripts/refine-service-hierarchy.mjs'
      - 'docs/car-data-preview/scripts/refine-hierarchy-backlog-rules.mjs'
      - 'docs/car-data-preview/scripts/write-service-hierarchy-status.mjs'
      - 'docs/car-data-preview/scripts/validate-service-hierarchy.mjs'
      - 'docs/car-data-preview/scripts/summarize-service-hierarchy.mjs'
      - 'docs/car-data-preview/scripts/report-hierarchy-backlog.mjs'
      - 'docs/car-data-preview/scripts/build-all-car-calc-index.mjs'
      - 'docs/car-data-preview/scripts/validate-all-car-calc-index.mjs'
      - 'docs/car-data-preview/scripts/validate-car-pipeline-coherence.mjs'
      - 'docs/car-data-preview/scripts/analyze-kea-join-opportunities.mjs'
      - 'docs/car-data-preview/scripts/analyze-powertrain-source-fields.mjs'
      - '.github/workflows/car-family-build.yml'

permissions:
  contents: write

concurrency:
  group: car-family-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Rebuild KEA cross-source merge from stored snapshots
        run: node docs/car-data-preview/scripts/merge-kea-car-sources.mjs
      - name: Validate KEA merge safety
        run: node docs/car-data-preview/scripts/validate-kea-merge.mjs
      - name: Build vehicle-family coverage from stored KEA snapshot
        run: node docs/car-data-preview/scripts/build-vehicle-families.mjs
      - name: Build compact vehicle-family QA summary
        run: node docs/car-data-preview/scripts/summarize-vehicle-families.mjs
      - name: Build complete rolling all-car catalog
        run: node docs/car-data-preview/scripts/build-all-car-catalog.mjs
      - name: Validate complete all-car catalog
        run: node docs/car-data-preview/scripts/validate-all-car-catalog.mjs
      - name: Build all-maker service hierarchy
        run: node docs/car-data-preview/scripts/build-service-hierarchy.mjs
      - name: Refine imported-brand and model aliases
        run: node docs/car-data-preview/scripts/refine-service-hierarchy.mjs
      - name: Refine explicit backlog model aliases
        run: node docs/car-data-preview/scripts/refine-hierarchy-backlog-rules.mjs
      - name: Refresh refined hierarchy status
        run: node docs/car-data-preview/scripts/write-service-hierarchy-status.mjs
      - name: Validate all-maker service hierarchy
        run: node docs/car-data-preview/scripts/validate-service-hierarchy.mjs
      - name: Summarize hierarchy normalization gaps
        run: node docs/car-data-preview/scripts/summarize-service-hierarchy.mjs
      - name: Build hierarchy normalization backlog
        run: node docs/car-data-preview/scripts/report-hierarchy-backlog.mjs
      - name: Analyze safe KEA join opportunities
        run: node docs/car-data-preview/scripts/analyze-kea-join-opportunities.mjs
      - name: Analyze official powertrain source fields
        run: node docs/car-data-preview/scripts/analyze-powertrain-source-fields.mjs
      - name: Build safe all-car calculation index
        run: node docs/car-data-preview/scripts/build-all-car-calc-index.mjs
      - name: Validate safe all-car calculation index
        run: node docs/car-data-preview/scripts/validate-all-car-calc-index.mjs
      - name: Validate cross-output pipeline coherence
        run: node docs/car-data-preview/scripts/validate-car-pipeline-coherence.mjs
      - name: Report hierarchy status
        run: |
          cat docs/car-data-preview/data/generated/kea-merged-status.json
          cat docs/car-data-preview/data/generated/all-car-status.json
          cat docs/car-data-preview/data/generated/service-hierarchy-status.json
          cat docs/car-data-preview/data/generated/all-car-calc-status.json
          cat docs/car-data-preview/data/generated/service-hierarchy-backlog.json | head -120
          cat docs/car-data-preview/data/generated/powertrain-source-diagnostics.json | head -120
          cat docs/car-data-preview/data/generated/kea-join-opportunities.json | head -80
          cat docs/car-data-preview/data/generated/all-car-delta.json | head -40
      - name: Commit family staging outputs
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          FILES=(
            docs/car-data-preview/data/staging/kea-all-cars-merged.json
            docs/car-data-preview/data/staging/vehicle-family-rows.json
            docs/car-data-preview/data/generated/kea-merged-status.json
            docs/car-data-preview/data/generated/vehicle-family-coverage.json
            docs/car-data-preview/data/generated/vehicle-family-summary.json
            docs/car-data-preview/data/generated/all-car-catalog.json
            docs/car-data-preview/data/generated/all-car-delta.json
            docs/car-data-preview/data/generated/all-car-status.json
            docs/car-data-preview/data/generated/service-hierarchy.json
            docs/car-data-preview/data/generated/service-hierarchy-status.json
            docs/car-data-preview/data/generated/service-hierarchy-issues.json
            docs/car-data-preview/data/generated/service-hierarchy-summary.json
            docs/car-data-preview/data/generated/service-hierarchy-backlog.json
            docs/car-data-preview/data/generated/kea-join-opportunities.json
            docs/car-data-preview/data/generated/powertrain-source-diagnostics.json
            docs/car-data-preview/data/generated/all-car-calc-index.json
            docs/car-data-preview/data/generated/all-car-calc-status.json
          )
          tar -czf /tmp/car-family-output.tgz "${FILES[@]}"
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            tar -xzf /tmp/car-family-output.tgz
            git add "${FILES[@]}"
            if git diff --cached --quiet; then
              echo "Vehicle-family outputs already current."
              exit 0
            fi
            git commit -m "data: refresh car hierarchy, calc index and diagnostics [car-family]"
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep $((attempt * 2))
          done
          exit 1

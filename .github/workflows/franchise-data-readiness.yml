name: franchise-data-readiness

on:
  workflow_dispatch:
  schedule:
    - cron: '20 17 * * *'
  push:
    paths:
      - 'franchise-data-core/**'
      - '.github/workflows/franchise-data-readiness.yml'

permissions:
  contents: write

concurrency:
  group: franchise-data-readiness
  cancel-in-progress: true

jobs:
  test-and-refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Test data core
        run: npm test --prefix franchise-data-core

      - name: Refresh source readiness
        env:
          DATA_GO_KR_SERVICE_KEY: ${{ secrets.DATA_GO_KR_SERVICE_KEY }}
          FAIRDATA_SERVICE_KEY: ${{ secrets.FAIRDATA_SERVICE_KEY }}
          FTC_FRANCHISE_INDUSTRY_ENDPOINT: ${{ vars.FTC_FRANCHISE_INDUSTRY_ENDPOINT }}
        run: node franchise-data-core/src/status.mjs

      - name: Capture Sbiz pilot snapshot
        env:
          DATA_GO_KR_SERVICE_KEY: ${{ secrets.DATA_GO_KR_SERVICE_KEY }}
        run: node franchise-data-core/src/sbiz-pilot.mjs

      - name: Validate generated outputs
        run: |
          node --check docs/franchise-data-preview/source-status-final.js
          node --check docs/franchise-data-preview/source-ui-final.js
          node --check docs/franchise-data-preview/sbiz-pilot-final.js
          node -e "const s=require('./data/franchise/source-status.json'); if(!Array.isArray(s.sources)||s.sources.length<4) process.exit(1); console.log(s.sources.map(x=>x.id+':'+(x.live||x.availability)).join('\n'))"
          node -e "const p=require('./data/franchise/snapshots/sbiz/gangnam-cafe.json'); if(!p.status) process.exit(1); console.log('pilot='+p.status+(p.totalCount!=null?' total='+p.totalCount:''))"

      - name: Commit readiness snapshots
        run: |
          FILES='docs/franchise-data-preview/source-status-final.js docs/franchise-data-preview/source-status.json docs/franchise-data-preview/sbiz-pilot-final.js data/franchise/source-status.json data/franchise/snapshots/sbiz/gangnam-cafe.json'
          if git diff --quiet -- $FILES; then
            echo 'No source readiness changes.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add $FILES
          git commit -m 'Refresh franchise source readiness [skip readiness]'
          git pull --rebase origin main
          git push origin HEAD:main

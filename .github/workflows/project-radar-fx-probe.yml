name: project-radar-fx-probe

on:
  push:
    paths:
      - '.github/workflows/project-radar-fx-probe.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Probe FxTwitter live search
        shell: bash
        run: |
          set -euo pipefail
          queries=('bitcoin' 'from:OpenAI' 'TIPPED' 'AMI' 'HUNTBROKER')
          for raw in "${queries[@]}"; do
            q=$(python -c 'import urllib.parse,sys; print(urllib.parse.quote(sys.argv[1]))' "$raw")
            code=$(curl -sS -L --max-time 12 -o /tmp/fx.json -w '%{http_code}' "https://api.fxtwitter.com/2/search?q=$q&feed=latest&count=5" || true)
            echo "query=$raw http=$code bytes=$(wc -c </tmp/fx.json 2>/dev/null || echo 0)"
            if [ "$code" = "200" ] || [ "$code" = "404" ]; then
              node -e "const fs=require('fs');const j=JSON.parse(fs.readFileSync('/tmp/fx.json','utf8'));console.log(JSON.stringify({code:j.code,count:Array.isArray(j.results)?j.results.length:-1,first:(j.results||[]).slice(0,2).map(x=>({id:x.id,url:x.url,text:String(x.text||'').slice(0,120),author:x.author?.screen_name,created_at:x.created_at}))}))"
            else
              head -c 500 /tmp/fx.json || true; echo
            fi
          done

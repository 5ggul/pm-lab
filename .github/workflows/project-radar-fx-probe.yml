name: project-radar-fx-probe

on:
  push:
    paths:
      - '.github/workflows/project-radar-fx-probe.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Probe x.md live search
        shell: bash
        run: |
          set -euo pipefail
          queries=('bitcoin' 'TIPPED' 'HOODCATS')
          for raw in "${queries[@]}"; do
            q=$(python -c 'import urllib.parse,sys; print(urllib.parse.quote(sys.argv[1]))' "$raw")
            code=$(curl -sS -L --max-time 15 -H 'Accept: application/json' -o /tmp/xmd.json -w '%{http_code}' "https://x.pcstyle.dev/api/v1/search?q=$q&feed=latest&limit=10&full=true&format=json&nocache=true" || true)
            echo "query=$raw http=$code bytes=$(wc -c </tmp/xmd.json 2>/dev/null || echo 0)"
            if [ "$code" = "200" ]; then
              node -e "const fs=require('fs');const j=JSON.parse(fs.readFileSync('/tmp/xmd.json','utf8'));console.log(JSON.stringify({source:j.source,searchDegraded:j.searchDegraded,count:Array.isArray(j.posts)?j.posts.length:-1,first:(j.posts||[]).slice(0,2).map(x=>({id:x.id,url:x.url,text:String(x.text||'').slice(0,120),author:x.author?.screen_name,created_at:x.created_at}))}))"
            else
              head -c 800 /tmp/xmd.json || true; echo
            fi
            sleep 2
          done

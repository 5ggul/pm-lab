name: Daangn Cloud Clock Checks
on:
  pull_request:
    paths:
      - 'ops/daangn-clock/**'
      - '.github/workflows/daangn-clock-check.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test ops/daangn-clock/clock.test.mjs

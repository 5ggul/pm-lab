name: interior-p1-import-parser-hotfix-qa

on:
  push:
    branches:
      - interior-p1-import-parser-hotfix
    paths:
      - 'docs/interior-cost-preview/assets/quote-local-import-v1.js'
      - 'docs/interior-cost-preview/quote-check/**'
      - 'docs/interior-cost-preview/quote-compare/**'
      - 'tests/interior-p1-import-parser-hotfix/**'
      - '.github/workflows/interior-p1-import-parser-hotfix-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: interior-p1-import-parser-hotfix-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout hotfix branch
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Syntax check hotfix
        run: |
          node --check docs/interior-cost-preview/assets/quote-local-import-v1.js
          node --check tests/interior-p1-import-parser-hotfix/ci-browser-qa.cjs

      - name: Install isolated Playwright Chromium
        run: |
          mkdir -p /tmp/interior-p1-parser-ci
          cd /tmp/interior-p1-parser-ci
          npm init -y >/dev/null 2>&1
          npm install --no-audit --no-fund playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Start hotfix static server
        run: |
          ln -sfn docs pm-lab
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/interior-p1-parser-http.log 2>&1 &
          echo $! >/tmp/interior-p1-parser-http.pid
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4173/pm-lab/interior-cost-preview/quote-check/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/interior-p1-parser-http.log || true
          exit 1

      - name: Start ephemeral HTTPS quick tunnel
        run: |
          curl -fsSL --retry 5 --retry-delay 2 -o /tmp/cloudflared \
            https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64
          chmod +x /tmp/cloudflared
          /tmp/cloudflared tunnel --no-autoupdate --url http://127.0.0.1:4173 >/tmp/interior-p1-parser-cloudflared.log 2>&1 &
          echo $! >/tmp/interior-p1-parser-cloudflared.pid
          URL=''
          for i in $(seq 1 60); do
            URL=$(grep -Eo 'https://[-a-z0-9]+\.trycloudflare\.com' /tmp/interior-p1-parser-cloudflared.log | head -n1 || true)
            if [ -n "$URL" ]; then break; fi
            sleep 1
          done
          if [ -z "$URL" ]; then
            cat /tmp/interior-p1-parser-cloudflared.log || true
            exit 1
          fi
          echo "QA_BASE_URL=$URL" >> "$GITHUB_ENV"
          for i in $(seq 1 90); do
            if curl -fsS --connect-timeout 5 "$URL/pm-lab/interior-cost-preview/quote-check/" >/dev/null; then
              echo "HTTPS hotfix ready"
              exit 0
            fi
            sleep 1
          done
          cat /tmp/interior-p1-parser-cloudflared.log || true
          exit 1

      - name: Run parser hotfix browser QA
        env:
          PLAYWRIGHT_MODULE: /tmp/interior-p1-parser-ci/node_modules/playwright
          QA_RESULT_PATH: interior-p1-import-parser-hotfix-qa.json
        run: node tests/interior-p1-import-parser-hotfix/ci-browser-qa.cjs

      - name: Write QA summary
        if: always()
        run: |
          {
            echo '## Interior P1 import parser hotfix QA'
            echo
            echo "- Commit: $GITHUB_SHA"
            if [ -n "$QA_BASE_URL" ]; then
              echo "- Ephemeral HTTPS origin: $QA_BASE_URL"
            fi
            if [ -f interior-p1-import-parser-hotfix-qa.json ]; then
              node - <<'NODE'
          const fs=require('fs');
          const r=JSON.parse(fs.readFileSync('interior-p1-import-parser-hotfix-qa.json','utf8'));
          console.log('- Assertions passed: ' + (r.passed ?? 0));
          console.log('- Failures: ' + (r.failed ?? 0));
          NODE
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload QA artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: interior-p1-import-parser-hotfix-qa
          path: |
            interior-p1-import-parser-hotfix-qa.json
            /tmp/interior-p1-parser-http.log
            /tmp/interior-p1-parser-cloudflared.log
          if-no-files-found: warn
          retention-days: 14

name: airport-now-core-test

on:
  push:
    paths:
      - 'airport-now-core/**'
      - 'docs/airport-now-preview/**'
      - 'docs/_includes/airport_now/**'
      - '.github/workflows/airport-now-core-test.yml'
  pull_request:
    paths:
      - 'airport-now-core/**'
      - 'docs/airport-now-preview/**'
      - 'docs/_includes/airport_now/**'
      - '.github/workflows/airport-now-core-test.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: airport-now-core
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - run: npm ci
      - name: Verify captured fixtures through local D1 and HTTP
        run: npm run verify:d1
      - name: Check preview JavaScript syntax
        run: node --check ../docs/airport-now-preview/site.js

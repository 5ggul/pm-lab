name: airport-now-core-test

on:
  push:
    paths:
      - 'airport-now-core/**'
      - '.github/workflows/airport-now-core-test.yml'
  pull_request:
    paths:
      - 'airport-now-core/**'
      - '.github/workflows/airport-now-core-test.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: airport-now-core
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test

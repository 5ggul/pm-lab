name: franchise-v10-branch

on:
  push:
    branches:
      - 'feat/franchise-v10-data-editorial'
    paths:
      - 'franchise-ssg-core/**'
      - 'data/franchise/official/brands-2025.json'
      - 'docs/franchise-data-preview/data-final.js'
      - '.github/workflows/franchise-v10-branch.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: franchise-v10-branch
  cancel-in-progress: true

jobs:
  generate-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/franchise-v10-data-editorial
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Audit official data readiness
        run: node franchise-ssg-core/run-audit-v10-data.mjs
      - name: Generate v10 preview
        run: node franchise-ssg-core/run-generate-v10.mjs
        env:
          SSG_PREVIEW_MODE: 'true'
          SSG_BASE_PATH: '/pm-lab/franchise-ssg-preview'
          SSG_SITE_URL: 'https://5ggul.github.io/pm-lab/franchise-ssg-preview'
      - name: Validate v10 preview
        run: node franchise-ssg-core/run-validate-v10-final.mjs
        env:
          SSG_PREVIEW_MODE: 'true'
      - name: Browser QA 320-1440
        run: node franchise-ssg-core/run-browser-qa-v10.mjs
      - name: Upload viewport screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: franchise-v10-viewport-qa
          path: |
            v10-qa-screenshots/
            v10-browser-qa.json
          retention-days: 7
      - name: Commit generated branch preview
        run: |
          if [ -z "$(git status --porcelain -- docs/franchise-ssg-preview)" ]; then
            echo 'No generated changes.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+5ggul@users.noreply.github.com'
          git add docs/franchise-ssg-preview
          git commit -m 'Generate franchise v10 branch preview [skip v10-branch]'
          git push origin HEAD:feat/franchise-v10-data-editorial

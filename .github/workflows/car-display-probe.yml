name: car-display-probe

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/car-display-probe.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fetch rich display-efficiency source
        env:
          DATA_GO_KR_SERVICE_KEY: ${{ secrets.DATA_GO_KR_SERVICE_KEY }}
        run: node docs/car-data-preview/scripts/fetch-kea-display-cars.mjs
      - name: Merge with stored energy-efficiency snapshot
        run: node docs/car-data-preview/scripts/merge-kea-car-sources.mjs
      - name: Print sanitized status
        run: |
          cat docs/car-data-preview/data/generated/kea-display-status.json
          cat docs/car-data-preview/data/generated/kea-merged-status.json
      - uses: actions/upload-artifact@v4
        with:
          name: car-display-probe-${{ github.run_id }}
          path: |
            docs/car-data-preview/data/generated/kea-display-status.json
            docs/car-data-preview/data/generated/kea-merged-status.json
            docs/car-data-preview/data/staging/kea-car-display-normalized.json
            docs/car-data-preview/data/staging/kea-all-cars-merged.json
          retention-days: 2

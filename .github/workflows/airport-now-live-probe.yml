name: airport-now-live-probe

on:
  workflow_dispatch:
    inputs:
      probe:
        description: 'Probe to run'
        required: true
        type: choice
        options:
          - iiac-depart
          - kac-depart-cju
          - kac-arrival-cju
          - iiac-arr
          - kma-metar-rksi
          - kma-metar-rkpc
  push:
    branches:
      - airport-now-p0
    paths:
      - 'airport-now-core/.probe-now'

jobs:
  probe:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      APP_ENV: development
      DATA_GO_KR_SERVICE_KEY: ${{ secrets.DATAKEY }}
      KMA_API_HUB_KEY: ${{ secrets.KMAKEY }}
    defaults:
      run:
        working-directory: airport-now-core
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run live verification
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            fail=0
            npm run probe -- iiac-depart || fail=1
            npm run probe -- kac-depart CJU || fail=1
            npm run probe -- kac-arrival CJU || fail=1
            exit "$fail"
          else
            case "${{ inputs.probe }}" in
              iiac-depart) npm run probe -- iiac-depart ;;
              kac-depart-cju) npm run probe -- kac-depart CJU ;;
              kac-arrival-cju) npm run probe -- kac-arrival CJU ;;
              iiac-arr) npm run probe -- iiac-arr ;;
              kma-metar-rksi) npm run probe -- kma-metar RKSI ;;
              kma-metar-rkpc) npm run probe -- kma-metar RKPC ;;
            esac
          fi
      - name: Upload sanitized raw fixture
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: airport-now-live-verify-${{ github.run_id }}
          path: airport-now-core/tests/fixtures/live-local/*.json
          if-no-files-found: warn
          retention-days: 7

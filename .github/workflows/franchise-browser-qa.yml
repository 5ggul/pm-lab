name: franchise-browser-qa

on:
  push:
    branches: [main]
    paths:
      - 'franchise-browser-qa/**'
      - '.github/workflows/franchise-browser-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: franchise-browser-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply candidate runtime corrections without publishing
        run: node franchise-ssg-core/run-fix-v11-54-runtime-integrity.mjs
      - name: Bundle exact tested source for offline reproduction
        run: |
          mkdir -p franchise-browser-qa/results
          tar -czf franchise-browser-qa/results/preview-source.tar.gz docs/franchise-ssg-preview franchise-ssg-core franchise-browser-qa/run.mjs
      - name: Install pinned browser test dependency
        run: npm install --prefix franchise-browser-qa --no-package-lock --ignore-scripts
      - name: Install Chromium and Korean fonts
        run: |
          cd franchise-browser-qa
          npx playwright install --with-deps chromium
          sudo apt-get install -y fonts-noto-cjk
      - name: Execute viewport and functional browser tests
        run: npm --prefix franchise-browser-qa test
      - name: Retain test results and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: franchise-browser-qa-${{ github.run_id }}
          path: franchise-browser-qa/results/
          retention-days: 14
          if-no-files-found: warn

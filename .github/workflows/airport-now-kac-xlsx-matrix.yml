name: airport-now-kac-xlsx-matrix

on:
  push:
    branches:
      - airport-now-p0
    paths:
      - 'airport-now-core/.probe-kac-xlsx-matrix'

jobs:
  download:
    strategy:
      fail-fast: false
      matrix:
        attempt: [1,2,3,4]
    runs-on: ubuntu-latest
    timeout-minutes: 4
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Download official replacement XLSX
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/kac-xlsx
          URL='https://www.data.go.kr/cmm/cmm/fileDownload.do?atchFileId=FILE_000000003655403&fileDetailSn=1'
          curl -4 --silent --show-error --location --connect-timeout 25 --max-time 70 --retry 1 --retry-delay 2 "$URL" -o /tmp/kac-xlsx/replacements.xlsx
          python - <<'PY'
          import pathlib,subprocess,sys,json
          p=pathlib.Path('/tmp/kac-xlsx/replacements.xlsx')
          if p.read_bytes()[:4] != b'PK\x03\x04':
              print(p.read_text('utf-8',errors='ignore')[:5000])
              raise SystemExit('not xlsx')
          try: import openpyxl
          except ImportError:
              subprocess.check_call([sys.executable,'-m','pip','install','--quiet','openpyxl'])
              import openpyxl
          wb=openpyxl.load_workbook(p,data_only=True,read_only=False)
          hits=[]
          for ws in wb.worksheets:
              for row in ws.iter_rows():
                  vals=[c.value for c in row]
                  links=[c.hyperlink.target if c.hyperlink else None for c in row]
                  text=' | '.join('' if v is None else str(v) for v in vals)
                  if any(k in text for k in ['항공기 운항정보','운항정보 조회_GW','실시간 항공기 운항정보','주차정보_GW','공항 소요시간']):
                      hits.append({'sheet':ws.title,'row':row[0].row,'values':vals,'links':links})
          pathlib.Path('/tmp/kac-xlsx/hits.json').write_text(json.dumps(hits,ensure_ascii=False,indent=2),encoding='utf-8')
          print(json.dumps(hits,ensure_ascii=False,indent=2)[:30000])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: airport-now-kac-xlsx-${{ matrix.attempt }}-${{ github.run_id }}
          path: /tmp/kac-xlsx
          if-no-files-found: warn
          retention-days: 3

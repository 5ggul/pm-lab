name: franchise-internal-authority-postpass

on:
  pull_request:
    paths:
      - 'franchise-ssg-core/run-generate-v11-23-final.mjs'
      - 'franchise-ssg-core/run-validate-v11-23-final.mjs'
      - 'franchise-ssg-core/run-generate-v11-24-final.mjs'
      - 'franchise-ssg-core/run-validate-v11-24-final.mjs'
      - 'franchise-ssg-core/run-generate-v11-25-final.mjs'
      - 'franchise-ssg-core/run-fix-v11-25-brand-top.mjs'
      - 'franchise-ssg-core/run-enhance-v11-25-benchmarks-compare.mjs'
      - 'franchise-ssg-core/run-validate-v11-25-final.mjs'
      - 'franchise-ssg-core/run-generate-public-copy-cleanup.mjs'
      - 'franchise-ssg-core/run-validate-public-copy-cleanup.mjs'
      - 'franchise-ssg-core/release-config.example.json'
      - 'franchise-ssg-core/run-build-production-dry-run.mjs'
      - 'franchise-ssg-core/run-validate-production-dry-run.mjs'
      - 'franchise-ssg-core/package.json'
      - 'franchise-ssg-core/run-generate-internal-authority-v11-25.mjs'
      - 'franchise-ssg-core/run-validate-internal-authority-v11-25.mjs'
      - 'franchise-ssg-core/run-audit-production-readiness.mjs'
      - 'franchise-ssg-core/run-validate-production-readiness.mjs'
      - '.github/workflows/franchise-internal-authority.yml'
  workflow_run:
    workflows: ['franchise-ssg-preview']
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: franchise-internal-authority-${{ github.event.pull_request.number || github.event.workflow_run.id || github.ref }}
  cancel-in-progress: true

jobs:
  apply-and-validate:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout pull request
        if: github.event_name != 'workflow_run'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout latest main after franchise preview
        if: github.event_name == 'workflow_run'
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Rebuild current franchise baseline on pull request
        if: github.event_name == 'pull_request'
        run: npm --prefix franchise-ssg-core run build
        env:
          SSG_PREVIEW_MODE: 'true'
          SSG_BASE_PATH: '/pm-lab/franchise-ssg-preview'
          SSG_SITE_URL: 'https://5ggul.github.io/pm-lab/franchise-ssg-preview'

      - name: Generate v11.23 cost component intent hub
        run: node franchise-ssg-core/run-generate-v11-23-final.mjs
        env:
          SSG_PREVIEW_MODE: 'true'
          SSG_BASE_PATH: '/pm-lab/franchise-ssg-preview'
          SSG_SITE_URL: 'https://5ggul.github.io/pm-lab/franchise-ssg-preview'

      - name: Validate v11.23 cost component intent hub
        run: node franchise-ssg-core/run-validate-v11-23-final.mjs
        env:
          SSG_PREVIEW_MODE: 'true'

      - name: Generate v11.24 SEO warning content polish
        run: node franchise-ssg-core/run-generate-v11-24-final.mjs
        env:
          SSG_PREVIEW_MODE: 'true'
          SSG_BASE_PATH: '/pm-lab/franchise-ssg-preview'
          SSG_SITE_URL: 'https://5ggul.github.io/pm-lab/franchise-ssg-preview'

      - name: Validate v11.24 SEO warning content polish
        run: node franchise-ssg-core/run-validate-v11-24-final.mjs
        env:
          SSG_PREVIEW_MODE: 'true'

      - name: Generate v11.25 data product redesign
        run: node franchise-ssg-core/run-generate-v11-25-final.mjs
        env:
          SSG_PREVIEW_MODE: 'true'
          SSG_BASE_PATH: '/pm-lab/franchise-ssg-preview'
          SSG_SITE_URL: 'https://5ggul.github.io/pm-lab/franchise-ssg-preview'

      - name: Validate v11.25 data product redesign
        run: node franchise-ssg-core/run-validate-v11-25-final.mjs
        env:
          SSG_PREVIEW_MODE: 'true'
          SSG_BASE_PATH: '/pm-lab/franchise-ssg-preview'

      - name: Remove visible internal QA copy
        run: node franchise-ssg-core/run-generate-public-copy-cleanup.mjs

      - name: Validate public copy cleanup
        run: node franchise-ssg-core/run-validate-public-copy-cleanup.mjs

      - name: Audit v11.25 internal authority
        run: node franchise-ssg-core/run-generate-internal-authority-v11-25.mjs
        env:
          SSG_PREVIEW_MODE: 'true'
          SSG_SITE_URL: 'https://5ggul.github.io/pm-lab/franchise-ssg-preview'

      - name: Validate v11.25 internal authority
        run: node franchise-ssg-core/run-validate-internal-authority-v11-25.mjs
        env:
          SSG_PREVIEW_MODE: 'true'

      - name: Audit production readiness without deploying
        run: node franchise-ssg-core/run-audit-production-readiness.mjs

      - name: Validate production readiness audit integrity
        run: node franchise-ssg-core/run-validate-production-readiness.mjs

      - name: Build production release dry run without mutating preview
        run: node franchise-ssg-core/run-build-production-dry-run.mjs

      - name: Validate production dry run leaves preview untouched
        run: node franchise-ssg-core/run-validate-production-dry-run.mjs

      - name: Publish postpass preview safely
        if: github.event_name == 'workflow_run' && github.event.workflow_run.head_branch == 'main'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+5ggul@users.noreply.github.com'

          for attempt in 1 2 3; do
            echo "Authority postpass publish attempt $attempt"
            git fetch origin main
            git reset --hard origin/main
            node franchise-ssg-core/run-generate-v11-23-final.mjs
            node franchise-ssg-core/run-validate-v11-23-final.mjs
            node franchise-ssg-core/run-generate-v11-24-final.mjs
            node franchise-ssg-core/run-validate-v11-24-final.mjs
            node franchise-ssg-core/run-generate-v11-25-final.mjs
            node franchise-ssg-core/run-validate-v11-25-final.mjs
            node franchise-ssg-core/run-generate-public-copy-cleanup.mjs
            node franchise-ssg-core/run-validate-public-copy-cleanup.mjs
            node franchise-ssg-core/run-generate-internal-authority-v11-25.mjs
            node franchise-ssg-core/run-validate-internal-authority-v11-25.mjs
            node franchise-ssg-core/run-audit-production-readiness.mjs
            node franchise-ssg-core/run-validate-production-readiness.mjs
            node franchise-ssg-core/run-build-production-dry-run.mjs
            node franchise-ssg-core/run-validate-production-dry-run.mjs

            if [ -z "$(git status --porcelain -- docs/franchise-ssg-preview)" ]; then
              echo 'Latest main already contains the guarded franchise release dry run.'
              exit 0
            fi

            git add docs/franchise-ssg-preview
            git commit -m 'Apply franchise guarded production dry run [skip franchise-authority]'
            if git push origin HEAD:main; then
              exit 0
            fi
            echo 'Main advanced during guarded franchise dry run publish; retrying.'
          done

          echo 'Failed to publish guarded franchise production dry run after 3 attempts.' >&2
          exit 1
        env:
          SSG_PREVIEW_MODE: 'true'
          SSG_BASE_PATH: '/pm-lab/franchise-ssg-preview'
          SSG_SITE_URL: 'https://5ggul.github.io/pm-lab/franchise-ssg-preview'

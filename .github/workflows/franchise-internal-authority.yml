name: franchise-internal-authority-postpass

on:
  pull_request:
    paths:
      - 'franchise-ssg-core/**'
      - '.github/workflows/franchise-internal-authority.yml'
  workflow_run:
    workflows: ['franchise-ssg-preview']
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: franchise-internal-authority-${{ github.event.pull_request.number || github.event.workflow_run.id || github.ref }}
  cancel-in-progress: true

jobs:
  apply-and-validate:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout pull request
        if: github.event_name != 'workflow_run'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout latest main after franchise preview
        if: github.event_name == 'workflow_run'
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Rebuild and validate canonical franchise preview through v11.45
        run: |
          node franchise-ssg-core/run-generate-v11-37-sales-semantics.mjs
          node franchise-ssg-core/run-fix-v11-37-structured-sales.mjs
          node franchise-ssg-core/run-validate-v11-37-sales-semantics.mjs
          node franchise-ssg-core/run-generate-v11-38-mobile-safeguards.mjs
          node franchise-ssg-core/run-validate-v11-38-mobile-safeguards.mjs
          node franchise-ssg-core/run-generate-v11-39-brand-evidence.mjs
          node franchise-ssg-core/run-validate-v11-39-brand-evidence.mjs
          node franchise-ssg-core/run-generate-v11-40-market-design.mjs
          node franchise-ssg-core/run-validate-v11-40-market-design.mjs
          node franchise-ssg-core/run-generate-v11-41-cinematic-motion.mjs
          node franchise-ssg-core/run-validate-v11-41-cinematic-motion.mjs
          node franchise-ssg-core/run-generate-v11-42-data-interface.mjs
          node franchise-ssg-core/run-validate-v11-42-data-interface.mjs
          node franchise-ssg-core/run-generate-v11-43-control-ux.mjs
          node franchise-ssg-core/run-validate-v11-43-control-ux.mjs
          node franchise-ssg-core/run-generate-v11-44-v42-refinement.mjs
          node franchise-ssg-core/run-validate-v11-44-v42-refinement.mjs
          node franchise-ssg-core/run-generate-v11-45-public-freshness.mjs
          node franchise-ssg-core/run-validate-v11-45-public-freshness.mjs
          node franchise-ssg-core/run-validate-v11-44-v42-refinement.mjs
          node franchise-ssg-core/run-validate-v11-42-data-interface.mjs
          node franchise-ssg-core/run-validate-v11-39-brand-evidence.mjs
          node franchise-ssg-core/run-validate-v11-38-mobile-safeguards.mjs
          node franchise-ssg-core/run-validate-v11-37-sales-semantics.mjs
        env:
          SSG_PREVIEW_MODE: 'true'
          SSG_BASE_PATH: '/pm-lab/franchise-ssg-preview'
          SSG_SITE_URL: 'https://5ggul.github.io/pm-lab/franchise-ssg-preview'

      - name: Remove visible internal QA copy
        run: node franchise-ssg-core/run-generate-public-copy-cleanup.mjs

      - name: Validate public copy cleanup
        run: node franchise-ssg-core/run-validate-public-copy-cleanup.mjs

      - name: Audit v11.25 internal authority
        run: node franchise-ssg-core/run-generate-internal-authority-v11-25.mjs
        env:
          SSG_PREVIEW_MODE: 'true'
          SSG_SITE_URL: 'https://5ggul.github.io/pm-lab/franchise-ssg-preview'

      - name: Validate v11.25 internal authority
        run: node franchise-ssg-core/run-validate-internal-authority-v11-25.mjs
        env:
          SSG_PREVIEW_MODE: 'true'

      - name: Revalidate v11.45 freshness and inherited contracts after authority postpass
        run: |
          node franchise-ssg-core/run-validate-v11-45-public-freshness.mjs
          node franchise-ssg-core/run-validate-v11-44-v42-refinement.mjs
          node franchise-ssg-core/run-validate-v11-42-data-interface.mjs
          node franchise-ssg-core/run-validate-v11-39-brand-evidence.mjs
          node franchise-ssg-core/run-validate-v11-38-mobile-safeguards.mjs
          node franchise-ssg-core/run-validate-v11-37-sales-semantics.mjs
        env:
          SSG_PREVIEW_MODE: 'true'
          SSG_BASE_PATH: '/pm-lab/franchise-ssg-preview'

      - name: Audit production readiness without deploying
        run: node franchise-ssg-core/run-audit-production-readiness.mjs

      - name: Validate production readiness audit integrity
        run: node franchise-ssg-core/run-validate-production-readiness.mjs

      - name: Build production release dry run without mutating preview
        run: node franchise-ssg-core/run-build-production-dry-run.mjs

      - name: Validate production dry run leaves preview untouched
        run: node franchise-ssg-core/run-validate-production-dry-run.mjs

      - name: Publish guarded v11.45 preview safely
        if: github.event_name == 'workflow_run' && github.event.workflow_run.head_branch == 'main'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+5ggul@users.noreply.github.com'

          for attempt in 1 2 3; do
            echo "Authority postpass publish attempt $attempt"
            git fetch origin main
            git reset --hard origin/main

            node franchise-ssg-core/run-generate-v11-37-sales-semantics.mjs
            node franchise-ssg-core/run-fix-v11-37-structured-sales.mjs
            node franchise-ssg-core/run-validate-v11-37-sales-semantics.mjs
            node franchise-ssg-core/run-generate-v11-38-mobile-safeguards.mjs
            node franchise-ssg-core/run-validate-v11-38-mobile-safeguards.mjs
            node franchise-ssg-core/run-generate-v11-39-brand-evidence.mjs
            node franchise-ssg-core/run-validate-v11-39-brand-evidence.mjs
            node franchise-ssg-core/run-generate-v11-40-market-design.mjs
            node franchise-ssg-core/run-validate-v11-40-market-design.mjs
            node franchise-ssg-core/run-generate-v11-41-cinematic-motion.mjs
            node franchise-ssg-core/run-validate-v11-41-cinematic-motion.mjs
            node franchise-ssg-core/run-generate-v11-42-data-interface.mjs
            node franchise-ssg-core/run-validate-v11-42-data-interface.mjs
            node franchise-ssg-core/run-generate-v11-43-control-ux.mjs
            node franchise-ssg-core/run-validate-v11-43-control-ux.mjs
            node franchise-ssg-core/run-generate-v11-44-v42-refinement.mjs
            node franchise-ssg-core/run-validate-v11-44-v42-refinement.mjs
            node franchise-ssg-core/run-generate-v11-45-public-freshness.mjs
            node franchise-ssg-core/run-validate-v11-45-public-freshness.mjs
            node franchise-ssg-core/run-generate-public-copy-cleanup.mjs
            node franchise-ssg-core/run-validate-public-copy-cleanup.mjs
            node franchise-ssg-core/run-generate-internal-authority-v11-25.mjs
            node franchise-ssg-core/run-validate-internal-authority-v11-25.mjs
            node franchise-ssg-core/run-validate-v11-45-public-freshness.mjs
            node franchise-ssg-core/run-validate-v11-44-v42-refinement.mjs
            node franchise-ssg-core/run-validate-v11-42-data-interface.mjs
            node franchise-ssg-core/run-validate-v11-39-brand-evidence.mjs
            node franchise-ssg-core/run-validate-v11-38-mobile-safeguards.mjs
            node franchise-ssg-core/run-validate-v11-37-sales-semantics.mjs
            node franchise-ssg-core/run-audit-production-readiness.mjs
            node franchise-ssg-core/run-validate-production-readiness.mjs
            node franchise-ssg-core/run-build-production-dry-run.mjs
            node franchise-ssg-core/run-validate-production-dry-run.mjs

            if [ -z "$(git status --porcelain -- docs/franchise-ssg-preview)" ]; then
              echo 'Latest main already contains the guarded franchise v11.45 preview.'
              exit 0
            fi

            git add docs/franchise-ssg-preview
            git commit -m 'Apply franchise v11.45 guarded freshness preview [skip franchise-authority]'
            if git push origin HEAD:main; then
              exit 0
            fi
            echo 'Main advanced during guarded franchise v11.45 publish; retrying.'
          done

          echo 'Failed to publish guarded franchise v11.45 preview after 3 attempts.' >&2
          exit 1
        env:
          SSG_PREVIEW_MODE: 'true'
          SSG_BASE_PATH: '/pm-lab/franchise-ssg-preview'
          SSG_SITE_URL: 'https://5ggul.github.io/pm-lab/franchise-ssg-preview'

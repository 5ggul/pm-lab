name: interior-v5-preview

on:
  push:
    branches: [main]
    paths:
      - 'interior-cost-core/**'
      - '.github/workflows/interior-v5-preview.yml'
  pull_request:
    branches: [main]
    paths:
      - 'interior-cost-core/**'
      - '.github/workflows/interior-v5-preview.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: interior-v5-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate preview
        run: |
          node interior-cost-core/run-generate-v5.mjs
          node interior-cost-core/postprocess-review-date.mjs
      - name: Validate v5 output
        run: |
          test -f docs/interior-cost-preview/data/v5-report.json
          node -e "const r=require('./docs/interior-cost-preview/data/v5-report.json'); if(r.v4_asset_references.length||r.h1_issues.length||r.meta_issues.length||r.internal_link_issues.length||!r.app_build||!r.build||!/^\\d{4}-\\d{2}-\\d{2}$/.test(r.reviewed_on||'')||r.quote_default_state!=='missing'||r.compare_default_state!=='missing'||r.compare_binding!=='data-vendor'||r.budget_binding!=='budget-row'||r.checklist_binding!=='check-id'||r.one_set_binding!=='one-set-type'||r.mobile_table_mode!=='readable-scroll') process.exit(1)"
          CSS='docs/interior-cost-preview/assets/site-v5.css'
          JS='docs/interior-cost-preview/assets/app-v5.js'
          QUOTE='docs/interior-cost-preview/quote-check/index.html'
          COMPARE='docs/interior-cost-preview/quote-compare/index.html'
          BUDGET='docs/interior-cost-preview/calculator/index.html'
          CHECK='docs/interior-cost-preview/checklist/index.html'
          ONESET='docs/interior-cost-preview/one-set/index.html'
          test -s "$CSS" && test -s "$JS" && node --check "$JS"
          grep -Fq "\$\$('[data-site-search]').forEach(searchForm=>" "$JS"
          grep -Fq 'value="missing" checked>미기재' "$QUOTE"
          grep -Fq 'value="missing" selected>미기재' "$COMPARE"
          grep -Fq '아직 비교 전입니다.' "$JS"
          grep -Fq 'function compareStorageKey(el)' "$JS"
          grep -Fq 'data-budget-builder' "$BUDGET"
          grep -Fq 'function budgetStorageKey(el)' "$JS"
          grep -Fq 'data-check-id=' "$CHECK"
          grep -Fq 'data-one-set-type' "$ONESET"
          grep -Fq 'v5-mobile-readable-tables' "$CSS"
          if grep -R -n -E 'site-v4\.css|app-v4\.js' docs/interior-cost-preview --include='*.html'; then exit 1; fi
          if grep -n -E '@keyframes|animation[[:space:]]*:' "$CSS"; then exit 1; fi
          grep -q 'SearchAction' docs/interior-cost-preview/index.html
          grep -q 'noindex,nofollow' docs/interior-cost-preview/index.html
      - name: Validate v6.7 enhancement
        run: |
          REPORT='docs/interior-cost-preview/data/v6-report.json'
          HOME='docs/interior-cost-preview/index.html'
          DATA='docs/interior-cost-preview/data/index.html'
          PIPE='docs/interior-cost-preview/data/quote-pipeline/index.html'
          STATPAGE='docs/interior-cost-preview/data/quote-statistics/index.html'
          SCHEMA='docs/interior-cost-preview/data/quote-sample-schema.json'
          POLICY='docs/interior-cost-preview/data/quote-publication-policy.json'
          STATS='docs/interior-cost-preview/data/quote-statistics.json'
          HEALTH='docs/interior-cost-preview/data/quote-data-health.json'
          CONTRACT='docs/interior-cost-preview/data/quote-aggregate-contract.json'
          COMPILER='interior-cost-core/compile-quote-stats-v6-7.mjs'
          test -s "$REPORT" && test -s "$DATA" && test -s "$PIPE" && test -s "$STATPAGE" && test -s "$SCHEMA" && test -s "$POLICY" && test -s "$STATS" && test -s "$HEALTH" && test -s "$CONTRACT" && test -s "$COMPILER"
          for f in app-v6.js app-v6-4.js app-v6-5.js app-v6-6.js; do node --check "docs/interior-cost-preview/assets/$f"; done
          node --check "$COMPILER"
          node --check interior-cost-core/enhance-v6-7.mjs
          node "$COMPILER" --self-test
          node -e "const r=require('./docs/interior-cost-preview/data/v6-report.json'); const checks=['home_data_first','public_unit_cost_page','public_reference_calculator','unit_normalizer','quote_pipeline_page','quote_schema_json','quote_publication_policy','quote_aggregate_compiler','quote_statistics_page','quote_data_health_json','quote_aggregate_contract_json','home_version_consistent']; if(r.version!=='6.7.0'||checks.some(k=>r[k]!==true)||r.quote_raw_rows_persisted!==false||r.quote_segment_dimensions<7||r.quote_public_sample_count!==0) process.exit(1); console.log(r)"
          node -e "const s=require('./docs/interior-cost-preview/data/quote-statistics.json'); if(s.version!=='6.7.0'||s.sample_count!==0||s.status!=='withheld'||s.methodology.raw_rows_persisted!==false||Object.keys(s.segments||{}).length<7) process.exit(1)"
          node -e "const h=require('./docs/interior-cost-preview/data/quote-data-health.json'); if(h.raw_rows_persisted!==false||h.raw_rows_written_to_docs!==false||h.source_mode!=='no_private_dataset') process.exit(1)"
          node -e "const c=require('./docs/interior-cost-preview/data/quote-aggregate-contract.json'); if(c.thresholds.overall_n!==30||c.thresholds.segment_n!==20||c.rules.mean_published!==false||c.rules.low_n_price_statistics!==false||c.raw_rows_persisted!==false) process.exit(1)"
          node -e "const s=require('./docs/interior-cost-preview/data/quote-sample-schema.json'); if(s.additionalProperties!==false||s.properties.vendor_name||s.properties.address||s.properties.phone) process.exit(1)"
          grep -Fq '데이터 v6.7.0' "$HOME"
          grep -Fq '실제 견적 집계 통계' "$DATA"
          grep -Fq '공개 집계 출력' "$PIPE"
          grep -Fq '원본 견적 행은 공개 저장하지 않습니다' "$STATPAGE"
          grep -Fq 'N ≥ 30' "$STATPAGE"
          grep -Fq 'N ≥ 20' "$STATPAGE"
          grep -Fq 'INTERIOR_QUOTE_DATASET' interior-cost-core/enhance-v6-7.mjs
          grep -Fq 'raw_rows_persisted:false' "$COMPILER"
          if [ -f docs/interior-cost-preview/data/quote-samples.json ]; then
            node -e "const rows=require('./docs/interior-cost-preview/data/quote-samples.json'); if(!Array.isArray(rows)||rows.length!==0) process.exit(1)"
          fi
          if grep -Fq '총액보다 먼저 조건을 맞춥니다.' "$HOME"; then exit 1; fi
      - name: Commit generated preview safely
        if: github.ref == 'refs/heads/main'
        run: |
          if [ -z "$(git status --porcelain -- docs/interior-cost-preview)" ]; then exit 0; fi
          SNAPSHOT_DIR="$(mktemp -d)"
          cp -a docs/interior-cost-preview "$SNAPSHOT_DIR/interior-cost-preview"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            rm -rf docs/interior-cost-preview
            cp -a "$SNAPSHOT_DIR/interior-cost-preview" docs/interior-cost-preview
            if [ -z "$(git status --porcelain -- docs/interior-cost-preview)" ]; then exit 0; fi
            git add docs/interior-cost-preview
            git commit -m 'Generate interior v6.7 preview [skip interior-v5]'
            if git push origin HEAD:main; then exit 0; fi
          done
          exit 1

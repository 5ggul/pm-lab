name: interior-v5-preview

on:
  push:
    branches: [main]
    paths:
      - 'interior-cost-core/**'
      - '.github/workflows/interior-v5-preview.yml'
  pull_request:
    branches: [main]
    paths:
      - 'interior-cost-core/**'
      - '.github/workflows/interior-v5-preview.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: interior-v5-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate preview
        run: |
          node interior-cost-core/run-generate-v5.mjs
          node interior-cost-core/postprocess-review-date.mjs
      - name: Validate legacy tools
        run: |
          test -f docs/interior-cost-preview/data/v5-report.json
          node -e "const r=require('./docs/interior-cost-preview/data/v5-report.json'); if(r.v4_asset_references.length||r.h1_issues.length||r.meta_issues.length||r.internal_link_issues.length||!r.app_build||!r.build||r.quote_default_state!=='missing'||r.compare_default_state!=='missing'||r.compare_binding!=='data-vendor'||r.budget_binding!=='budget-row'||r.checklist_binding!=='check-id'||r.one_set_binding!=='one-set-type'||r.mobile_table_mode!=='readable-scroll') process.exit(1)"
          CSS='docs/interior-cost-preview/assets/site-v5.css'
          JS='docs/interior-cost-preview/assets/app-v5.js'
          test -s "$CSS" && test -s "$JS" && node --check "$JS"
          grep -Fq 'value="missing" checked>미기재' docs/interior-cost-preview/quote-check/index.html
          grep -Fq 'value="missing" selected>미기재' docs/interior-cost-preview/quote-compare/index.html
          grep -Fq 'data-budget-builder' docs/interior-cost-preview/calculator/index.html
          grep -Fq 'data-check-id=' docs/interior-cost-preview/checklist/index.html
          grep -Fq 'data-one-set-type' docs/interior-cost-preview/one-set/index.html
          grep -Fq 'v5-mobile-readable-tables' "$CSS"
          if grep -R -n -E 'site-v4\.css|app-v4\.js' docs/interior-cost-preview --include='*.html'; then exit 1; fi
          if grep -n -E '@keyframes|animation[[:space:]]*:' "$CSS"; then exit 1; fi
          grep -q 'noindex,nofollow' docs/interior-cost-preview/index.html
      - name: Validate quote aggregate compiler
        run: |
          COMPILER='interior-cost-core/compile-quote-stats-v6-7.mjs'
          node --check "$COMPILER"
          node "$COMPILER" --self-test
          node -e "const s=require('./docs/interior-cost-preview/data/quote-statistics.json'); if(s.version!=='6.7.0'||s.sample_count!==0||s.status!=='withheld'||s.methodology.raw_rows_persisted!==false||Object.keys(s.segments||{}).length<7) process.exit(1)"
          node -e "const h=require('./docs/interior-cost-preview/data/quote-data-health.json'); if(h.raw_rows_persisted!==false||h.raw_rows_written_to_docs!==false) process.exit(1)"
          node -e "const c=require('./docs/interior-cost-preview/data/quote-aggregate-contract.json'); if(c.thresholds.overall_n!==30||c.thresholds.segment_n!==20||c.rules.mean_published!==false||c.rules.low_n_price_statistics!==false||c.raw_rows_persisted!==false) process.exit(1)"
          node -e "const s=require('./docs/interior-cost-preview/data/quote-sample-schema.json'); if(s.additionalProperties!==false||s.properties.vendor_name||s.properties.address||s.properties.phone) process.exit(1)"
      - name: Validate v7 bulk batch
        run: |
          ROOT='docs/interior-cost-preview'
          REPORT="$ROOT/data/v6-report.json"
          test -s "$REPORT"
          for f in site-v7.css app-v7.js; do test -s "$ROOT/assets/$f"; done
          node --check "$ROOT/assets/app-v7.js"
          node --check interior-cost-core/enhance-v7.mjs
          for f in data/dataset-catalog.json data/answer-index.json data/quote-intelligence.json data/catalog/index.html data/answers/index.html quote-market/index.html llms.txt; do test -s "$ROOT/$f"; done
          node -e "const r=require('./docs/interior-cost-preview/data/v6-report.json'); const checks=['v7_bulk_batch','v7_local_quote_explorer','v7_dataset_catalog','v7_answer_index','v7_machine_catalog','v7_quote_intelligence','v7_llms_txt','v7_pyeong_integration','v7_trade_integration','v7_assets_injected','home_version_consistent']; if(r.version!=='7.0.0'||checks.some(k=>r[k]!==true)) process.exit(1); console.log(r)"
          node -e "const c=require('./docs/interior-cost-preview/data/dataset-catalog.json'); if(c.version!=='7.0.0'||c.datasets.length<6||!c.datasets.some(x=>x.id==='quote-statistics')||!c.datasets.some(x=>x.id==='public-unit-cost')) process.exit(1)"
          node -e "const a=require('./docs/interior-cost-preview/data/answer-index.json'); if(a.version!=='7.0.0'||a.answers.length<6||!a.answers.some(x=>x.id==='32p-market')) process.exit(1)"
          node -e "const q=require('./docs/interior-cost-preview/data/quote-intelligence.json'); if(q.version!=='7.0.0'||q.quote.sample_count!==0||q.quote.raw_rows_public!==false||q.quote.overall_min_n!==30||q.quote.segment_min_n!==20) process.exit(1)"
          grep -Fq '데이터 v7.0.0' "$ROOT/index.html"
          grep -Fq '견적 데이터 탐색기' "$ROOT/index.html"
          grep -Fq 'CSV 파일 끌어놓기' "$ROOT/quote-market/index.html"
          grep -Fq '정규화 JSON' "$ROOT/quote-market/index.html"
          grep -Fq 'dataset-catalog.json' "$ROOT/data/catalog/index.html"
          grep -Fq '32평 인테리어 실제 견적 중앙값은?' "$ROOT/data/answers/index.html"
          grep -Fq 'Do not treat public construction standards as private apartment market averages' "$ROOT/llms.txt"
          for p in 24 30 32 34 40; do grep -Fq 'v7-pyeong-stat' "$ROOT/interior-cost/${p}-pyeong/index.html"; done
          for p in bathroom kitchen wallpaper floor carpentry electrical window; do grep -Fq 'v7-trade-stat' "$ROOT/cost/${p}/index.html"; done
          grep -Fq '_vat_included_total_manwon' "$ROOT/assets/app-v7.js"
          grep -Fq '_component_over_total' "$ROOT/assets/app-v7.js"
          grep -Fq 'SEGMENT_N=20' "$ROOT/assets/app-v7.js"
          if grep -Fq '총액보다 먼저 조건을 맞춥니다.' "$ROOT/index.html"; then exit 1; fi
      - name: Commit generated preview safely
        if: github.ref == 'refs/heads/main'
        run: |
          if [ -z "$(git status --porcelain -- docs/interior-cost-preview)" ]; then exit 0; fi
          SNAPSHOT_DIR="$(mktemp -d)"
          cp -a docs/interior-cost-preview "$SNAPSHOT_DIR/interior-cost-preview"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            rm -rf docs/interior-cost-preview
            cp -a "$SNAPSHOT_DIR/interior-cost-preview" docs/interior-cost-preview
            if [ -z "$(git status --porcelain -- docs/interior-cost-preview)" ]; then exit 0; fi
            git add docs/interior-cost-preview
            git commit -m 'Generate interior v7.0 preview [skip interior-v5]'
            if git push origin HEAD:main; then exit 0; fi
          done
          exit 1

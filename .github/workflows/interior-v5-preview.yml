name: interior-v5-preview

on:
  push:
    branches: [main]
    paths:
      - 'interior-cost-core/**'
      - '.github/workflows/interior-v5-preview.yml'
      - '.github/workflows/interior-v11-source-watch.yml'
  pull_request:
    branches: [main]
    paths:
      - 'interior-cost-core/**'
      - '.github/workflows/interior-v5-preview.yml'
      - '.github/workflows/interior-v11-source-watch.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: interior-v5-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Generate preview in runner only
        run: |
          node interior-cost-core/run-generate-v5.mjs
          node interior-cost-core/postprocess-review-date.mjs

      - name: Validate generated snapshot
        run: |
          ROOT='docs/interior-cost-preview'
          test -s "$ROOT/index.html"
          test -s "$ROOT/assets/site-v21-bundle.css"
          test -s "$ROOT/assets/app-v21-bundle.js"
          test -s "$ROOT/data/v5-report.json"
          test -s "$ROOT/data/site-quality-v13.json"
          test -s "$ROOT/data/link-audit-v13.json"
          node --check "$ROOT/assets/app-v21-bundle.js"
          node -e "const q=require('./docs/interior-cost-preview/data/site-quality-v13.json'); if(q.thin_under_500!==0||q.duplicate_titles!==0||q.duplicate_h1!==0||q.broken_internal_links!==0) process.exit(1)"
          node -e "const l=require('./docs/interior-cost-preview/data/link-audit-v13.json'); if(l.broken_count!==0) process.exit(1)"

      - name: Do not publish generated snapshot automatically
        run: |
          echo 'Generation/validation completed in the Actions runner only.'
          echo 'Reviewed docs/interior-cost-preview is not overwritten or pushed automatically.'
          echo 'Publishing a generated snapshot requires an explicit reviewed commit.'

name: interior-v5-preview

on:
  push:
    branches: [main]
    paths:
      - 'interior-cost-core/**'
      - '.github/workflows/interior-v5-preview.yml'
  pull_request:
    branches: [main]
    paths:
      - 'interior-cost-core/**'
      - '.github/workflows/interior-v5-preview.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: interior-v5-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Generate preview
        run: |
          node interior-cost-core/run-generate-v5.mjs
          node interior-cost-core/postprocess-review-date.mjs

      - name: Validate v5 output
        run: |
          test -f docs/interior-cost-preview/data/v5-report.json
          node -e "const r=require('./docs/interior-cost-preview/data/v5-report.json'); if(r.v4_asset_references.length||r.h1_issues.length||r.meta_issues.length||r.internal_link_issues.length||!r.app_build||!r.build||!/^\\d{4}-\\d{2}-\\d{2}$/.test(r.reviewed_on||'')||r.quote_default_state!=='missing'||r.compare_default_state!=='missing'||r.compare_binding!=='data-vendor'||r.budget_binding!=='budget-row'||r.checklist_binding!=='check-id'||r.one_set_binding!=='one-set-type'||r.mobile_table_mode!=='readable-scroll') process.exit(1)"
          CSS='docs/interior-cost-preview/assets/site-v5.css'
          JS='docs/interior-cost-preview/assets/app-v5.js'
          QUOTE='docs/interior-cost-preview/quote-check/index.html'
          COMPARE='docs/interior-cost-preview/quote-compare/index.html'
          BUDGET='docs/interior-cost-preview/calculator/index.html'
          CHECK='docs/interior-cost-preview/checklist/index.html'
          ONESET='docs/interior-cost-preview/one-set/index.html'
          test -s "$CSS" && test -s "$JS" && node --check "$JS"
          grep -Fq "\$\$('[data-site-search]').forEach(searchForm=>" "$JS"
          grep -Fq 'value="missing" checked>미기재' "$QUOTE"
          grep -Fq 'value="missing" selected>미기재' "$COMPARE"
          grep -Fq '아직 비교 전입니다.' "$JS"
          grep -Fq 'function compareStorageKey(el)' "$JS"
          grep -Fq 'data-budget-builder' "$BUDGET"
          grep -Fq 'function budgetStorageKey(el)' "$JS"
          grep -Fq 'data-check-id=' "$CHECK"
          grep -Fq 'data-one-set-type' "$ONESET"
          grep -Fq 'v5-mobile-readable-tables' "$CSS"
          if grep -R -n -E 'site-v4\.css|app-v4\.js' docs/interior-cost-preview --include='*.html'; then exit 1; fi
          if grep -n -E '@keyframes|animation[[:space:]]*:' "$CSS"; then exit 1; fi
          grep -q 'SearchAction' docs/interior-cost-preview/index.html
          grep -q 'noindex,nofollow' docs/interior-cost-preview/index.html

      - name: Validate v6.3 enhancement
        run: |
          REPORT='docs/interior-cost-preview/data/v6-report.json'
          HOME='docs/interior-cost-preview/index.html'
          DATA='docs/interior-cost-preview/data/index.html'
          SNAP='docs/interior-cost-preview/data/official-snapshot.json'
          UNIT='docs/interior-cost-preview/data/public-unit-cost/index.html'
          UNITJSON='docs/interior-cost-preview/data/public-unit-cost-2026-h2.json'
          BUDGET='docs/interior-cost-preview/calculator/index.html'
          test -s "$REPORT" && test -s "$DATA" && test -s "$SNAP" && test -s "$UNIT" && test -s "$UNITJSON"
          test -s docs/interior-cost-preview/assets/site-v6.css
          test -s docs/interior-cost-preview/assets/site-v6-1.css
          test -s docs/interior-cost-preview/assets/site-v6-2.css
          test -s docs/interior-cost-preview/assets/site-v6-3.css
          node --check docs/interior-cost-preview/assets/app-v6.js
          node -e "const r=require('./docs/interior-cost-preview/data/v6-report.json'); const checks=['home_data_first','removed_old_home_slogan','compare_stacked_chart','calculator_index_converter','cost_index_page','official_index_json','v6_assets_injected','verified_2026_index_series','official_wage_page','cost_wage_comparison','v61_assets_injected','data_hub_page','official_snapshot_json','pyeong_snapshots','public_unit_cost_page','public_unit_cost_json','unit_cost_mapped_pages','home_version_consistent','v63_assets_injected']; if(r.version!=='6.3.0'||checks.some(k=>r[k]!==true)||r.public_unit_cost_count!==10||r.official_wage.daily_average!==282737||r.official_index_latest.yoy_percent!==5.78) process.exit(1); console.log(r)"
          grep -Fq '데이터 v6.3.0' "$HOME"
          grep -Fq '공사비 전년동월' "$HOME"
          grep -Fq '+5.78%' "$HOME"
          grep -Fq '282,737원' "$HOME"
          grep -Fq '공공 공종 단가' "$DATA"
          grep -Fq '2026 하반기 공공 공종 단가' "$UNIT"
          grep -Fq '38,903원/㎡' "$UNIT"
          grep -Fq '5,993원/㎡' "$UNIT"
          grep -Fq '2,335원/m' "$UNIT"
          grep -Fq '"not_for": "민간 아파트 인테리어 시장평균 또는 적정가격 판정"' "$UNITJSON"
          grep -Fq 'data-v6-compare-chart' docs/interior-cost-preview/quote-compare/index.html
          grep -Fq 'data-v6-index-tool' "$BUDGET"
          for page in bathroom wallpaper carpentry floor window; do
            grep -Fq '공공 공종 단가 참고' "docs/interior-cost-preview/cost/${page}/index.html"
            grep -Fq '재료비' "docs/interior-cost-preview/cost/${page}/index.html"
          done
          if grep -Fq '총액보다 먼저 조건을 맞춥니다.' "$HOME"; then exit 1; fi

      - name: Commit generated preview safely
        if: github.ref == 'refs/heads/main'
        run: |
          if [ -z "$(git status --porcelain -- docs/interior-cost-preview)" ]; then
            echo 'No generated preview changes.'
            exit 0
          fi
          SNAPSHOT_DIR="$(mktemp -d)"
          cp -a docs/interior-cost-preview "$SNAPSHOT_DIR/interior-cost-preview"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            rm -rf docs/interior-cost-preview
            cp -a "$SNAPSHOT_DIR/interior-cost-preview" docs/interior-cost-preview
            if [ -z "$(git status --porcelain -- docs/interior-cost-preview)" ]; then exit 0; fi
            git add docs/interior-cost-preview
            git commit -m 'Generate interior v6.3 preview [skip interior-v5]'
            if git push origin HEAD:main; then exit 0; fi
          done
          exit 1

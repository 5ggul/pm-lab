name: interior-v5-preview

on:
  push:
    branches: [main]
    paths:
      - 'interior-cost-core/**'
      - '.github/workflows/interior-v5-preview.yml'
  pull_request:
    branches: [main]
    paths:
      - 'interior-cost-core/**'
      - '.github/workflows/interior-v5-preview.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: interior-v5-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate preview
        run: |
          node interior-cost-core/run-generate-v5.mjs
          node interior-cost-core/postprocess-review-date.mjs
      - name: Validate legacy tools
        run: |
          ROOT='docs/interior-cost-preview'
          test -s "$ROOT/data/v5-report.json"
          node -e "const r=require('./docs/interior-cost-preview/data/v5-report.json'); if(r.v4_asset_references.length||r.h1_issues.length||r.meta_issues.length||r.internal_link_issues.length||!r.app_build||!r.build||r.quote_default_state!=='missing'||r.compare_default_state!=='missing'||r.compare_binding!=='data-vendor'||r.budget_binding!=='budget-row'||r.checklist_binding!=='check-id'||r.one_set_binding!=='one-set-type'||r.mobile_table_mode!=='readable-scroll') process.exit(1)"
          node --check "$ROOT/assets/app-v5.js"
          grep -Fq 'value="missing" checked>미기재' "$ROOT/quote-check/index.html"
          grep -Fq 'value="missing" selected>미기재' "$ROOT/quote-compare/index.html"
          grep -Fq 'data-budget-builder' "$ROOT/calculator/index.html"
          grep -Fq 'data-check-id=' "$ROOT/checklist/index.html"
          grep -Fq 'data-one-set-type' "$ROOT/one-set/index.html"
          if grep -R -n -E 'site-v4\.css|app-v4\.js' "$ROOT" --include='*.html'; then exit 1; fi
      - name: Validate quote aggregate compiler
        run: |
          ROOT='docs/interior-cost-preview'
          COMPILER='interior-cost-core/compile-quote-stats-v6-7.mjs'
          node --check "$COMPILER"
          node "$COMPILER" --self-test
          node -e "const s=require('./docs/interior-cost-preview/data/quote-statistics.json'); if(s.sample_count!==0||s.status!=='withheld'||s.methodology.raw_rows_persisted!==false||Object.keys(s.segments||{}).length<9||!s.segments.region_pyeong_rounded||!s.segments.region_pyeong_band) process.exit(1)"
          node -e "const h=require('./docs/interior-cost-preview/data/quote-data-health.json'); if(h.raw_rows_persisted!==false||h.raw_rows_written_to_docs!==false) process.exit(1)"
          node -e "const c=require('./docs/interior-cost-preview/data/quote-aggregate-contract.json'); if(c.thresholds.overall_n!==30||c.thresholds.segment_n!==20||c.rules.mean_published!==false||c.rules.low_n_price_statistics!==false||!c.dimensions.includes('region_pyeong_rounded')||!c.dimensions.includes('region_pyeong_band')) process.exit(1)"
          node -e "const s=require('./docs/interior-cost-preview/data/quote-sample-schema.json'); if(s.additionalProperties!==false||s.properties.vendor_name||s.properties.address||s.properties.phone) process.exit(1)"
      - name: Validate v7-v9 base layers
        run: |
          ROOT='docs/interior-cost-preview'
          for f in app-v7.js app-v8.js app-v9.js; do node --check "$ROOT/assets/$f"; done
          for f in enhance-v7.mjs enhance-v8.mjs enhance-v9.mjs; do node --check "interior-cost-core/$f"; done
          for f in data/dataset-catalog.json data/answer-index.json data/quote-intelligence.json data/public-unit-cost-v8.json data/citation-map.json data/query-map.json data/public-unit-groups.json data/search-clusters.json data/publisher-readiness.json llms.txt; do test -s "$ROOT/$f"; done
          node -e "const r=require('./docs/interior-cost-preview/data/v6-report.json'); const flags=['v7_bulk_batch','v8_bulk_batch','v9_bulk_batch','v9_public_unit_topics','v9_pyeong_data_boards','v9_trade_data_boards','v9_thin_zero','v9_policy_pages_complete']; if(flags.some(k=>r[k]!==true)||r.v8_public_unit_count<50||r.v9_public_unit_topic_count!==9) process.exit(1)"
          for slug in waterproof tile window-sealing wallpaper carpentry-drywall flooring paint insulation base-finishing; do test -s "$ROOT/data/public-unit-cost/$slug/index.html"; done
      - name: Validate v10 large-scale batch
        run: |
          ROOT='docs/interior-cost-preview'
          node --check interior-cost-core/enhance-v10.mjs
          node --check interior-cost-core/app-v10.js
          node --check "$ROOT/assets/app-v10.js"
          test -s "$ROOT/assets/site-v10.css"
          if grep -n -E '@keyframes|animation[[:space:]]*:|linear-gradient|radial-gradient' "$ROOT/assets/site-v10.css"; then exit 1; fi
          for f in data/region-pyeong-map.json data/answer-index-v10.json data/internal-link-map.json data/launch-readiness-v10.json data/answers-v10/index.html data/launch-readiness/index.html quote-paste/index.html cost-combination/index.html region/index.html; do test -s "$ROOT/$f"; done
          node -e "const r=require('./docs/interior-cost-preview/data/v6-report.json'); const flags=['v10_bulk_batch','v10_region_hubs','v10_region_pyeong_routes','v10_region_pyeong_dimensions','v10_quote_paste_classifier','v10_scope_combination','v10_cost_index_period_tool','v10_answer_hub','v10_internal_link_map','v10_launch_readiness','v10_mobile_launcher','v10_assets_injected','home_version_consistent']; if(r.version!=='10.0.0'||flags.some(k=>r[k]!==true)||r.v10_region_hub_count!==17||r.v10_region_pyeong_route_count!==85||r.v10_answer_count<70) process.exit(1); console.log(r)"
          node -e "const m=require('./docs/interior-cost-preview/data/region-pyeong-map.json'); if(m.version!=='10.0.0'||m.regions!==17||m.route_count!==85||m.routes.length!==85||m.routes.some(x=>x.indexable&&x.status!=='published')) process.exit(1)"
          node -e "const a=require('./docs/interior-cost-preview/data/answer-index-v10.json'); if(a.version!=='10.0.0'||a.count<70||a.answers.length!==a.count||!a.answers.some(x=>x.category==='지역×평수')||!a.answers.some(x=>x.question.includes('견적서 텍스트'))) process.exit(1)"
          node -e "const l=require('./docs/interior-cost-preview/data/internal-link-map.json'); if(l.version!=='10.0.0'||l.pages<30||l.map.some(x=>!x.links.length)) process.exit(1)"
          node -e "const q=require('./docs/interior-cost-preview/data/launch-readiness-v10.json'); if(q.version!=='10.0.0'||q.inventory.region_hubs!==17||q.inventory.region_pyeong_routes!==85||q.inventory.answer_records<70||q.quality.thin_under_500!==0||q.quality.duplicate_titles!==0||q.quality.duplicate_h1!==0||q.quality.noindex_pages!==q.inventory.html_pages||q.quality.policy_pages_present!==q.quality.policy_pages_expected||q.data_rules.fake_market_average!==false||q.data_rules.raw_quote_rows_public!==false) process.exit(1); console.log(q)"
          for slug in seoul busan daegu incheon gwangju daejeon ulsan sejong gyeonggi gangwon chungbuk chungnam jeonbuk jeonnam gyeongbuk gyeongnam jeju; do
            test -s "$ROOT/region/$slug/index.html"
            grep -Fq '지역명으로 가격을 추정하지 않고' "$ROOT/region/$slug/index.html"
            grep -Fq '지역 × 평수' "$ROOT/region/$slug/index.html"
          done
          grep -Fq 'data-v10-paste-tool' "$ROOT/quote-paste/index.html"
          grep -Fq 'A업체 비교표로 보내기' "$ROOT/quote-paste/index.html"
          grep -Fq 'data-v10-combo-tool' "$ROOT/cost-combination/index.html"
          grep -Fq 'data-v10-index-tool' "$ROOT/data/cost-index/index.html"
          grep -Fq 'data-v10-answer-hub' "$ROOT/data/answers-v10/index.html"
          grep -Fq 'v10-mobile-launch' "$ROOT/index.html"
          grep -Fq '데이터 v10.0.0' "$ROOT/index.html"
          grep -Fq 'region_pyeong_rounded' "$ROOT/data/quote-aggregate-contract.json"
          grep -Fq 'region_pyeong_band' "$ROOT/data/quote-aggregate-contract.json"
          grep -Fq 'v10 routes and tools' "$ROOT/llms.txt"
          if grep -R -n '지역 평균 추정값' "$ROOT/region" --include='*.html'; then exit 1; fi
      - name: Commit generated preview safely
        if: github.ref == 'refs/heads/main'
        run: |
          if [ -z "$(git status --porcelain -- docs/interior-cost-preview)" ]; then exit 0; fi
          SNAPSHOT_DIR="$(mktemp -d)"
          cp -a docs/interior-cost-preview "$SNAPSHOT_DIR/interior-cost-preview"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            rm -rf docs/interior-cost-preview
            cp -a "$SNAPSHOT_DIR/interior-cost-preview" docs/interior-cost-preview
            if [ -z "$(git status --porcelain -- docs/interior-cost-preview)" ]; then exit 0; fi
            git add docs/interior-cost-preview
            git commit -m 'Generate interior v10.0 preview [skip interior-v5]'
            if git push origin HEAD:main; then exit 0; fi
          done
          exit 1

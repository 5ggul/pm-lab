name: interior-v32-stratton-reference-audit

on:
  push:
    branches: [interior-v32-stratton-system]
    paths:
      - 'interior-cost-core/inspect-stratton-reference.cjs'
      - '.github/workflows/interior-v32-stratton-reference-audit.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inspect-reference:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: interior-v32-stratton-system
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Inspect Stratton reference
        run: node interior-cost-core/inspect-stratton-reference.cjs
      - name: Commit text audit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add interior-cost-core/stratton-reference-audit.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Capture Stratton design reference metrics'
          git push origin HEAD:interior-v32-stratton-system
      - name: Upload visual reference
        uses: actions/upload-artifact@v4
        with:
          name: stratton-reference-screenshots
          path: artifacts/stratton-*.png
          if-no-files-found: error
          retention-days: 7

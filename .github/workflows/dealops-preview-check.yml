name: DealOps isolated Cloudflare preview
on:
  push:
    branches: [feat/dealops-cloudflare-v061]
    paths: ['.github/workflows/dealops-preview-check.yml', 'apps/dealops-preview/**']
permissions:
  contents: read
concurrency:
  group: dealops-isolated-preview
  cancel-in-progress: false
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          sparse-checkout: |
            apps/dealops-preview
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.16.0'
      - name: Unpack verified source capsule
        working-directory: apps/dealops-preview
        run: |
          python3 - <<'PY'
          import pathlib,hashlib,lzma,json
          root=pathlib.Path('.').resolve()
          raw=b''.join((root/'.transfer'/f'{i:02}.bin').read_bytes() for i in range(1,10))
          assert hashlib.sha256(raw).hexdigest()=='ceb1b6f7a10e1fb12883824fbb1604245b6ebb99700747da22e3156bf8f21ebe'
          files=json.loads(lzma.decompress(raw))
          assert len(files)==19
          for name,text in files.items():
            p=(root/name).resolve()
            assert p.is_relative_to(root) and isinstance(text,str)
            p.parent.mkdir(parents=True,exist_ok=True)
            p.write_text(text)
          print('Verified source files:',len(files))
          PY
      - name: Build, provision isolated free temporary preview, verify, encrypt owner receipt
        working-directory: apps/dealops-preview
        run: node --import ./.ci/settle-auth.mjs .ci/deploy-preview.mjs
      - name: Retain encrypted owner receipt and non-secret result
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: dealops-preview-receipt
          path: apps/dealops-preview/.ci/receipt/
          if-no-files-found: warn
          retention-days: 2

name: airport-now-collector
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: airport-now-collector
  cancel-in-progress: false
jobs:
  collect:
    strategy:
      fail-fast: false
      matrix:
        source: [iiacArrival, iiacDeparture, kacArrival, kacDeparture, metar]
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      DATA_GO_KR_SERVICE_KEY: ${{ secrets.DATA_GO_KR_SERVICE_KEY }}
      DATAKEY: ${{ secrets.DATAKEY }}
      KMAKEY: ${{ secrets.KMAKEY }}
      AIRPORT_NOW_INGEST_TOKEN: ${{ secrets.AIRPORT_NOW_INGEST_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node airport-now-core/scripts/collect-source.mjs '${{ matrix.source }}'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: airport-now-collector-${{ matrix.source }}
          path: airport-now-core/tests/fixtures/live-local/collector-*.json
          retention-days: 7
  availability:
    if: always()
    needs: collect
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Record observed freshness coverage
        run: curl --fail --silent --show-error --max-time 30 https://airport-now-preview-core.dhkim8704.workers.dev/api/status -o availability.json
      - uses: actions/upload-artifact@v4
        with:
          name: airport-now-availability
          path: availability.json
          retention-days: 30

name: airport-now-collector
on:
  workflow_dispatch:
    inputs:
      transferPublicKey:
        required: true
        type: string
permissions:
  contents: read
jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Encrypt approved credential transfer
        env:
          TRANSFER_PUBLIC_KEY: ${{ inputs.transferPublicKey }}
          DATA_GO_KR_SERVICE_KEY: ${{ secrets.DATA_GO_KR_SERVICE_KEY }}
          DATAKEY: ${{ secrets.DATAKEY }}
          KMAKEY: ${{ secrets.KMAKEY }}
        run: |
          node --input-type=module <<'NODE'
          import {randomBytes,createCipheriv,publicEncrypt,createPublicKey,constants} from 'node:crypto';
          import {writeFileSync} from 'node:fs';
          const data={DATA_GO_KR_SERVICE_KEY:process.env.DATA_GO_KR_SERVICE_KEY||process.env.DATAKEY,KMA_API_HUB_KEY:process.env.KMAKEY};
          if(Object.values(data).some(v=>!v))throw Error('Required existing secret unavailable');
          const key=randomBytes(32),iv=randomBytes(12),cipher=createCipheriv('aes-256-gcm',key,iv);
          const payload=Buffer.concat([cipher.update(JSON.stringify(data)),cipher.final()]);
          const wrappedKey=publicEncrypt({key:createPublicKey({key:Buffer.from(process.env.TRANSFER_PUBLIC_KEY,'base64'),format:'der',type:'spki'}),padding:constants.RSA_PKCS1_OAEP_PADDING,oaepHash:'sha256'},key);
          writeFileSync('encrypted-transfer.json',JSON.stringify(Object.fromEntries(Object.entries({wrappedKey,iv,tag:cipher.getAuthTag(),payload}).map(([k,v])=>[k,v.toString('base64')]))));
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: encrypted-cloudflare-transfer
          path: encrypted-transfer.json
          retention-days: 1

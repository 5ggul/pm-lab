name: franchise-preview-validate

on:
  push:
    paths:
      - 'docs/franchise-data-preview/**'
      - '.github/workflows/franchise-preview-validate.yml'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check JavaScript syntax
        run: |
          node --check docs/franchise-data-preview/data-final.js
          node --check docs/franchise-data-preview/pages-final.js
          node --check docs/franchise-data-preview/tools-final.js
          node --check docs/franchise-data-preview/content-final.js
          node --check docs/franchise-data-preview/app-final.js

      - name: Validate preview shell
        run: |
          node <<'NODE'
          const fs = require('fs');
          const html = fs.readFileSync('docs/franchise-data-preview/index.html', 'utf8');
          const required = [
            'noindex,nofollow,noarchive,nosnippet',
            'data-final.js',
            'pages-final.js',
            'tools-final.js',
            'content-final.js',
            'app-final.js',
            'final.css'
          ];
          for (const token of required) {
            if (!html.includes(token)) throw new Error(`Missing required token: ${token}`);
          }
          console.log('Preview shell validation passed.');
          NODE

      - name: Validate coverage declarations
        run: |
          node <<'NODE'
          const fs = require('fs');
          const vm = require('vm');
          const code = fs.readFileSync('docs/franchise-data-preview/data-final.js', 'utf8');
          const marker = code.indexOf('function bySlug');
          const prelude = code.slice(0, marker) + '\n;globalThis.__coverage={categories:Object.keys(categories).length,brands:brands.length,areas:areas.length,guides:guides.length};';
          const context = {console};
          vm.createContext(context);
          vm.runInContext(prelude, context);
          const c = context.__coverage;
          if (c.categories < 20) throw new Error(`Too few categories: ${c.categories}`);
          if (c.brands < 150) throw new Error(`Too few brands: ${c.brands}`);
          if (c.areas < 50) throw new Error(`Too few areas: ${c.areas}`);
          if (c.guides < 10) throw new Error(`Too few guides: ${c.guides}`);
          console.log(JSON.stringify(c));
          NODE

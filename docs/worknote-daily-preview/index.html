<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <meta name="theme-color" content="#07172c">
  <title>작업노트 Daily Desk — 검수용 MVP</title>
  <style>
    *{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#07172c;font-family:system-ui,-apple-system,"Noto Sans KR","Malgun Gothic",sans-serif}
    #appFrame{display:none;width:100%;height:100%;border:0;background:#f6f8fb}
    #status{position:fixed;inset:0;display:grid;place-items:center;padding:24px;color:#fff;text-align:center;background:#07172c}
    #status strong{display:block;font-size:20px;margin-bottom:8px}#status p{margin:0;color:rgba(255,255,255,.65);line-height:1.65}
    #status.error a{display:inline-block;margin-top:14px;padding:11px 16px;border-radius:12px;background:#26e0c2;color:#07172c;font-weight:800;text-decoration:none}
  </style>
</head>
<body>
  <div id="status"><div><strong>작업노트 프리뷰를 불러오는 중입니다.</strong><p>W001 카드와 일일 운영 대시보드를 준비하고 있습니다.</p></div></div>
  <iframe id="appFrame" title="작업노트 Daily Desk 검수용 MVP" allow="clipboard-write"></iframe>
  <script>
    (async()=>{
      const status=document.getElementById('status');
      const frame=document.getElementById('appFrame');
      try{
        const api='https://api.github.com/repos/5ggul/pm-lab/contents/worknote-daily-preview/index.html?ref=dcc3d714227cc4f5fcd8c4a5fcf5052aa0d5856a';
        const response=await fetch(api,{headers:{Accept:'application/vnd.github+json'}});
        if(!response.ok) throw new Error('GitHub API '+response.status);
        const data=await response.json();
        const binary=atob(String(data.content||'').replace(/\s/g,''));
        const bytes=Uint8Array.from(binary,ch=>ch.charCodeAt(0));
        const html=new TextDecoder('utf-8').decode(bytes);
        frame.onload=()=>{status.style.display='none';frame.style.display='block'};
        frame.srcdoc=html;
      }catch(error){
        status.className='error';
        status.innerHTML='<div><strong>프리뷰를 불러오지 못했습니다.</strong><p>'+String(error.message||error)+'</p><a href="https://github.com/5ggul/pm-lab/blob/dcc3d714227cc4f5fcd8c4a5fcf5052aa0d5856a/worknote-daily-preview/index.html">소스 확인</a></div>';
      }
    })();
  </script>
</body>
</html>

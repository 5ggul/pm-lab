<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="t d">
<title id="t">견적검수실</title><desc id="d">인테리어 견적 확인과 비교 도구</desc>
<rect width="1200" height="630" fill="#F6F4EE"/><rect width="22" height="630" fill="#1B3A6B"/><rect x="22" width="12" height="630" fill="#26E0C2"/>
<text x="90" y="110" font-family="Arial, Noto Sans KR, sans-serif" font-size="28" font-weight="700" fill="#1B3A6B">INTERIOR QUOTE CHECK</text>
<text x="90" y="220" font-family="Arial, Noto Sans KR, sans-serif" font-size="80" font-weight="800" fill="#131919">견적검수실</text>
<text x="90" y="315" font-family="Arial, Noto Sans KR, sans-serif" font-size="36" font-weight="700" fill="#131919">인테리어 견적을 같은 기준으로</text>
<text x="90" y="365" font-family="Arial, Noto Sans KR, sans-serif" font-size="36" font-weight="700" fill="#131919">확인하고 비교하는 도구</text>
<rect x="90" y="435" width="235" height="54" rx="8" fill="#FFFFFF" stroke="#CCC7BD"/><rect x="90" y="435" width="7" height="54" fill="#26E0C2"/>

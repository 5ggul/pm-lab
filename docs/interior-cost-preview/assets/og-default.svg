<rect x="350" y="435" width="185" height="54" rx="8" fill="#FFFFFF" stroke="#CCC7BD"/><rect x="350" y="435" width="7" height="54" fill="#EBBA42"/>
<text x="375" y="470" font-family="Arial, Noto Sans KR, sans-serif" font-size="24" font-weight="700" fill="#131919">A/B/C 비교</text>
<rect x="560" y="435" width="230" height="54" rx="8" fill="#FFFFFF" stroke="#CCC7BD"/><rect x="560" y="435" width="7" height="54" fill="#1B3A6B"/>

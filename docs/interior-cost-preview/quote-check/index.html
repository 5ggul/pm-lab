<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow,noarchive,nosnippet">
  <meta name="googlebot" content="noindex,nofollow,noarchive,nosnippet">
  <title>인테리어 견적 확인 v42 비운영 검수</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#f3f0e8;color:#171a18;font-family:-apple-system,BlinkMacSystemFont,"Pretendard","Noto Sans KR",sans-serif;text-align:center}
    strong{display:block;font-size:18px;margin-bottom:8px}p{margin:0;color:#777168;font-size:13px;line-height:1.6}
    .error{max-width:620px;border:1px solid #c9c4b8;background:#fcfbf7;padding:24px;text-align:left}
  </style>
</head>
<body>
  <div id="loader"><strong>견적 확인 v42 검수 페이지 로딩 중</strong><p>직전 검수 기준 화면에 handoff 기능을 결합합니다.</p></div>
  <script>
  (()=>{
    'use strict';
    const PAGE='quote-check';
    const RAW='https://raw.githubusercontent.com/5ggul/pm-lab/interior-v40-preview/docs/interior-cost-preview';
    const BRANCH='https://raw.githack.com/5ggul/pm-lab/interior-v42-handoff-integration/docs/interior-cost-preview';
    const COMPARE_URL=`${BRANCH}/quote-compare/index.html`;
    const V42=`${BRANCH}/assets/quote-handoff-v42.js?v=20260914-3`;

    function injection(){
      return `
        <style id="v42-review-badge-style">
          .v42-review-badge{position:fixed;right:10px;bottom:10px;z-index:2147483646;background:#171A18;color:#fff;border:1px solid #777168;padding:7px 9px;font:700 11px/1.2 -apple-system,BlinkMacSystemFont,"Pretendard","Noto Sans KR",sans-serif;box-shadow:0 2px 8px rgba(0,0,0,.16);pointer-events:none}
        </style>
        <div class="v42-review-badge" aria-hidden="true">v42 비운영 검수</div>
        <script>window.INTERIOR_HANDOFF_BASE='${BRANCH}';window.INTERIOR_HANDOFF_COMPARE_URL='${COMPARE_URL}';<\/script>
        <script src="${V42}" defer data-v42-review-script><\/script>
      `;
    }

    fetch(`${RAW}/${PAGE}/index.html`,{cache:'no-store'})
      .then(r=>{if(!r.ok)throw new Error(`원본 HTML 응답 ${r.status}`);return r.text();})
      .then(html=>{
        html=html
          .replaceAll('/pm-lab/interior-cost-preview/assets/',`${BRANCH}/assets/`)
          .replaceAll('/pm-lab/interior-cost-preview/quote-check/',`${BRANCH}/quote-check/index.html`)
          .replaceAll('/pm-lab/interior-cost-preview/quote-compare/',`${BRANCH}/quote-compare/index.html`)
          .replace('</body>',`${injection()}</body>`);
        document.open();document.write(html);document.close();
      })
      .catch(error=>{
        document.getElementById('loader').innerHTML=`<div class="error"><strong>검수 페이지를 불러오지 못했습니다.</strong><p>${String(error.message||error)}</p><p style="margin-top:10px">운영/main에는 영향이 없습니다.</p></div>`;
      });
  })();
  </script>
</body>
</html>

function gtLive(row,inc,source){
 const a=row.attributes||{},rel=row.relationships?.base_token?.data?.id,t=inc.get(rel)||{},network=row.relationships?.network?.data?.id||String(row.id||"").split("_")[0],tx=a.transactions||{},v=a.volume_usd||{},p=a.price_change_percentage||{};
 const address=t.address||String(rel||"").replace(network+"_",""),symbol=String(t.symbol||a.name?.split("/")[0]||"").replace(/^\$/,"").trim(),mc=Number(a.market_cap_usd||a.fdv_usd||0),liq=Number(a.reserve_in_usd||0);
 return {key:network+":"+address,network,token_address:address,pair_address:a.address,symbol,name:t.name||symbol,source,source_url:"https://www.geckoterminal.com/"+network+"/pools/"+a.address,pair_created_at:a.pool_created_at,market_cap:mc,fdv:Number(a.fdv_usd||0),liquidity_usd:liq,change:{m5:Number(p.m5||0),h1:Number(p.h1||0),h6:Number(p.h6||0),h24:Number(p.h24||0)},volume:{m5:Number(v.m5||0),h1:Number(v.h1||0),h6:Number(v.h6||0),h24:Number(v.h24||0)},txns:{h1:tx.h1||{},h24:tx.h24||{}}}
}
function browserQualifies(x){
 const born=Date.parse(x.pair_created_at||0),age=Number.isFinite(born)?(Date.now()-born)/3600000:9999,mc=x.market_cap||x.fdv,b=(x.txns?.h1?.buys||0)+1,s=(x.txns?.h1?.sells||0)+1,b24=(x.txns?.h24?.buys||0)+1,s24=(x.txns?.h24?.sells||0)+1;
 if(!x.symbol||/^(USDC|USDT|DAI|WETH|ETH|WBTC|BTC|SOL|WSOL|BNB)$/i.test(x.symbol)||age>168||mc<30000||mc>75000000||x.liquidity_usd<12000)return false;
 return (x.change.m5>=25&&x.volume.m5>=8000&&b/s>=1.15)||(x.change.h1>=55&&x.volume.h1>=25000&&b/s>=1.15)||(x.change.h6>=130&&x.volume.h6>=75000&&b24/s24>=1.05)||(x.change.h24>=250&&x.volume.h24>=150000&&b24/s24>=1);

  const map=new Map((LIVE_PUMPS.items||[]).map(x=>[pumpKey(x),x]));for(const x of found){const k=pumpKey(x),old=map.get(k);map.set(k,old?{...old,...x,key:k,first_qualified_at:old.first_qualified_at,first_seen_mcap:old.first_seen_mcap,peak_mcap:Math.max(Number(old.peak_mcap||0),Number(x.market_cap||x.fdv||0)),calls:old.calls||[]}:{...x,key:k})}

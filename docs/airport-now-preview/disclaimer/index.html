<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive"><title>면책 및 데이터 고지 | 공항나우</title><meta name="description" content="공항나우 데이터 지연·누락 가능성과 자체 통계에 대한 고지"><link rel="canonical" href="https://5ggul.github.io/pm-lab/airport-now-preview/disclaimer/"><link rel="stylesheet" href="../site.css"></head><body><header class="global"><div class="navin"><a class="brand" href="../">공항나우</a></div></header><main><section class="hero"><div class="wrap"><h1>면책 및 데이터 고지</h1></div></section><section class="section"><div class="wrap copy"><p>공항나우는 공항공사·항공기상 등 공식 데이터의 전송 지연, 누락, 정정 가능성을 전제로 설계합니다. 마지막 정상 수신시각과 데이터 기준시각을 함께 표시합니다.</p><p>자체 계산한 지연률과 최근 평균 비교는 공식 원인 발표가 아닙니다. 기상 정보와 지연이 동시에 나타나더라도 공식 인과 데이터가 없으면 원인을 단정하지 않습니다.</p><p>탑승 및 출국 판단은 항공사와 공항의 공식 안내를 우선해 확인해야 합니다.</p></div></section></main></body></html>

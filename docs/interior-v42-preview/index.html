<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow,noarchive,nosnippet">
  <meta name="googlebot" content="noindex,nofollow,noarchive,nosnippet">
  <title>인테리어 v42 견적 handoff 검수</title>
  <style>
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;background:#171A18;font-family:-apple-system,BlinkMacSystemFont,"Pretendard","Noto Sans KR",sans-serif}
    body{height:100vh;display:grid;grid-template-rows:auto 1fr;overflow:hidden}
    .reviewbar{min-height:44px;display:flex;align-items:center;gap:12px;padding:7px 12px;background:#171A18;color:#fff;border-bottom:1px solid #3a3d3b;font-size:12px}
    .reviewbar strong{font-size:13px;white-space:nowrap}
    .reviewbar span{color:#c9cbc9;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .reviewbar button{margin-left:auto;min-height:30px;padding:4px 9px;border:1px solid #767a77;background:#242825;color:#fff;font:inherit;font-weight:700;cursor:pointer;white-space:nowrap}
    iframe{display:block;width:100%;height:100%;border:0;background:#fff}
    @media(max-width:640px){.reviewbar{gap:8px;padding:6px 8px}.reviewbar span{display:none}.reviewbar button{font-size:11px}}
  </style>
</head>
<body>
  <div class="reviewbar" role="status">
    <strong>v42 비운영 검수</strong>
    <span id="route">견적 확인 로딩 중</span>
    <button id="restart" type="button">견적 확인으로 재시작</button>
  </div>
  <iframe id="preview" title="인테리어 견적 handoff v42 검수" src="/pm-lab/interior-cost-preview/quote-check/"></iframe>
  <script>
  (()=>{
    'use strict';
    const frame=document.getElementById('preview');
    const route=document.getElementById('route');
    const START='/pm-lab/interior-cost-preview/quote-check/';
    const ASSET='/pm-lab/interior-cost-preview/assets/quote-handoff-v42.js?v=20260914';

    function inject(){
      try{
        const doc=frame.contentDocument;
        const win=frame.contentWindow;
        if(!doc||!win) return;
        route.textContent=win.location.pathname;
        if(doc.querySelector('script[data-v42-preview-injected]')) return;
        const script=doc.createElement('script');
        script.src=ASSET;
        script.dataset.v42PreviewInjected='';
        script.addEventListener('error',()=>{route.textContent='v42 스크립트 로드 실패';});
        (doc.body||doc.documentElement).append(script);
      }catch(error){
        route.textContent='same-origin 주입 실패';
      }
    }

    frame.addEventListener('load',()=>requestAnimationFrame(inject));
    document.getElementById('restart').addEventListener('click',()=>{frame.src=START;});
  })();
  </script>
</body>
</html>

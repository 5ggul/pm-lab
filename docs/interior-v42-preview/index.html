<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow,noarchive,nosnippet">
  <meta name="googlebot" content="noindex,nofollow,noarchive,nosnippet">
  <title>인테리어 v42 비운영 검수</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;background:#f3f0e8;color:#171a18;font-family:-apple-system,BlinkMacSystemFont,"Pretendard","Noto Sans KR",sans-serif}
    .loader{min-height:100vh;display:grid;place-items:center;padding:24px;text-align:center}
    .loader strong{display:block;font-size:18px;margin-bottom:8px}
    .loader p{margin:0;color:#777168;font-size:13px;line-height:1.6}
    .error{max-width:620px;border:1px solid #c9c4b8;background:#fcfbf7;padding:24px;text-align:left}
  </style>
</head>
<body>
  <div class="loader" id="loader"><div><strong>v42 비운영 검수 페이지 로딩 중</strong><p>운영 페이지 HTML과 자산을 읽어 검수 기능만 덧씌웁니다.</p></div></div>
  <script>
  (()=>{
    'use strict';
    const params=new URLSearchParams(location.search);
    const requested=params.get('page')||'quote-check';
    const page=['quote-check','quote-compare'].includes(requested)?requested:'quote-check';
    const RAW='https://raw.githubusercontent.com/5ggul/pm-lab/interior-v40-preview/docs/interior-cost-preview';
    const LIVE='https://5ggul.github.io/pm-lab/interior-cost-preview';
    const V42='../interior-cost-preview/assets/quote-handoff-v42.js?v=20260914-2';

    function reviewInjection(){
      return `
        <style id="v42-review-badge-style">
          .v42-review-badge{position:fixed;right:10px;bottom:10px;z-index:2147483646;background:#171A18;color:#fff;border:1px solid #777168;padding:7px 9px;font:700 11px/1.2 -apple-system,BlinkMacSystemFont,"Pretendard","Noto Sans KR",sans-serif;box-shadow:0 2px 8px rgba(0,0,0,.16);pointer-events:none}
        </style>
        <div class="v42-review-badge" aria-hidden="true">v42 비운영 검수</div>
        <script>window.INTERIOR_HANDOFF_COMPARE_URL='?page=quote-compare';<\/script>
        <script src="${V42}" data-v42-review-script><\/script>
      `;
    }

    fetch(`${RAW}/${page}/index.html`,{cache:'no-store'})
      .then(response=>{
        if(!response.ok) throw new Error(`원본 HTML 응답 ${response.status}`);
        return response.text();
      })
      .then(html=>{
        html=html
          .replaceAll('/pm-lab/interior-cost-preview/assets/',`${LIVE}/assets/`)
          .replace('</body>',`${reviewInjection()}</body>`);
        document.open();
        document.write(html);
        document.close();
      })
      .catch(error=>{
        const loader=document.getElementById('loader');
        loader.innerHTML=`<div class="error"><strong>프리뷰를 불러오지 못했습니다.</strong><p>${String(error.message||error)}</p><p style="margin-top:10px">운영 페이지에는 영향이 없습니다.</p></div>`;
      });
  })();
  </script>
</body>
</html>

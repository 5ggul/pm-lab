<main><section class="db-section"><div class="db-shell" id="app"><h1>신고 사양 원문</h1><p>선택한 신고 사양은 데이터 연결 후 표시됩니다. <a href="../">차량명과 복합 효율 목록</a></p></div></section></main>

<script>
(async function(){const app=document.getElementById('app'),id=new URLSearchParams(location.search).get('id'),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),fmt=n=>n==null?'—':Number(n).toLocaleString('ko-KR'),eff=(n,u)=>n==null?'—':fmt(n)+' '+(u||'');if(!id){app.innerHTML='<div class="error"><h1>차량 ID가 없습니다.</h1><p><a href="../">전체 차량으로 돌아가기</a></p></div>';return}let data;try{const r=await fetch('../../data/generated/all-car-catalog.json',{cache:'no-store'});if(!r.ok)throw new Error();data=await r.json()}catch{app.innerHTML='<div class="error"><h1>데이터를 불러오지 못했습니다.</h1></div>';return}const g=data.groups.find(x=>x.catalog_id===id);if(!g){app.innerHTML='<div class="error"><h1>해당 차량 데이터를 찾지 못했습니다.</h1><p><a href="../">전체 차량</a></p></div>';return}document.title=`${g.model} 공식 연비 신고 데이터 | 내차데이터`;const types=g.types.length?g.types.join(' · '):'—',classes=g.vehicle_classes.length?g.vehicle_classes.join(' · '):'—';app.innerHTML=`<div class="record-head"><div class="db-kicker">한국에너지공단 신고 데이터</div><h1>${esc(g.model)}</h1><div class="record-meta">${esc(g.maker)} · ${esc(classes)} · ${g.source_status==='active'?'현재 제공 자료':'과거 제공 자료'}</div><div class="record-actions"><a href="../">전체 차량</a>${g.reviewed_detail_path?`<a class="primary" href="../..${esc(g.reviewed_detail_path)}">상세제원 보기</a>`:''}</div></div><div class="record-summary"><div><span>사양</span><b>${fmt(g.row_count)}</b></div><div><span>유형</span><b style="font-size:14px">${esc(types)}</b></div><div><span>최초 등록</span><b style="font-size:14px">${esc(g.first_seen_at)}</b></div><div><span>최근 확인</span><b style="font-size:14px">${esc(g.last_seen_at)}</b></div></div><div class="record-table-wrap"><table class="record-table"><thead><tr><th>신고 차명</th><th>유형</th><th class="num">배기량(cc)</th><th class="num">복합</th><th class="num">도심</th><th class="num">고속</th><th class="num">등급</th><th class="num">1회 충전거리</th></tr></thead><tbody>${g.records.map(r=>`<tr><td>${esc(r.model)}</td><td>${esc(r.type||'—')}</td><td class="num">${fmt(r.displacement_cc)}</td><td class="num">${eff(r.combined_efficiency,r.efficiency_unit)}</td><td class="num">${eff(r.city_efficiency,r.efficiency_unit)}</td><td class="num">${eff(r.highway_efficiency,r.efficiency_unit)}</td><td class="num">${fmt(r.efficiency_grade)}</td><td class="num">${r.range_km==null?'—':fmt(r.range_km)+' km'}</td></tr>`).join('')}</tbody></table></div><p class="note">복합·도심·고속 값 옆에 원문 효율 단위를 표시합니다. 전기차와 내연기관의 단위를 임의로 섞어 계산하지 않습니다. 연료 종류와 배기량이 있는 사양은 자동차세와 연료비를 계산할 수 있습니다.</p>`})();

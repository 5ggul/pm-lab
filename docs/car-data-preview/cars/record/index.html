<style>.record-head{border-bottom:2px solid #111;padding-bottom:20px}.record-head h1{margin:4px 0 8px;font-size:34px;letter-spacing:-.04em}.record-meta{font-size:13px;color:#666}.record-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}.record-actions a{display:inline-flex;align-items:center;min-height:44px;padding:0 13px;border:1px solid #bbb;color:#111;text-decoration:none}.record-actions a.primary{background:#111;color:#fff;border-color:#111}.record-summary{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid #ddd;border-left:1px solid #ddd;margin:24px 0}.record-summary div{padding:14px;border-right:1px solid #ddd;border-bottom:1px solid #ddd}.record-summary b{display:block;font-size:20px;margin-top:4px}.record-table-wrap{overflow-x:auto;border-top:2px solid #111}.record-table{width:100%;border-collapse:collapse;min-width:1050px}.record-table th,.record-table td{padding:11px 9px;border-bottom:1px solid #e7e7e7;text-align:left;font-size:12px;vertical-align:top}.record-table th{background:#fafafa;color:#666}.num{text-align:right!important;font-variant-numeric:tabular-nums;white-space:nowrap}.note{font-size:12px;color:#777;margin-top:14px}.error{padding:40px 0;border-top:2px solid #111}.badge{display:inline-block;padding:2px 6px;border:1px solid #bbb;font-size:11px}.current{color:#174ea6;border-color:#7293ca}@media(max-width:700px){.record-head h1{font-size:27px}.record-summary{grid-template-columns:repeat(2,1fr)}}</style>
<link rel="stylesheet" href="../../assets/pilot.css"><script src="../../assets/static-photo-fallback.js"></script><link rel="stylesheet" href="../../assets/clear-ui.css"><link rel="stylesheet" href="../../assets/utility.css"><link rel="stylesheet" href="../../assets/studio-ui.css"><link rel="stylesheet" href="../../assets/showroom-ui.css?v=4a4435051f"><link rel="stylesheet" href="../../assets/reference-ui.css?v=bcca902cd7"><link rel="stylesheet" href="../../assets/page-design.css?v=fd61a8db6b"><script defer src="../../assets/reference-ui.js?v=c3c0741eb5"></script><meta name="robots" content="noindex,nofollow,noarchive"><link rel="canonical" href="https://5ggul.github.io/pm-lab/car-data-preview/cars/record/"></head><body data-reference-page="vehicle" class="studio-ui clear-site">
<header class="db-header"><div class="db-shell"><a class="db-logo" href="../../">내차데이터</a><nav class="db-nav" aria-label="주 메뉴"><a href="../../cars/" aria-current="page">차량 찾기</a><a href="../../compare/">비교</a><a href="../../rankings/fuel-economy/">연비 순위</a><a href="../../recalls/">리콜</a></nav></div></header>
<main><section class="db-section"><div class="db-shell" id="app"><p>데이터를 불러오는 중…</p></div></section></main>
<footer class="page-footer"><strong>내차데이터</strong><p>자동차세와 연료·충전비를 같은 조건으로 비교합니다.</p><nav aria-label="이용 및 사이트 안내"><a href="../../tools/">계산 도구</a><a href="../../guide/">이용 가이드</a><a href="../../methodology/">계산 기준</a><a href="../../about/">소개</a><a href="../../terms/">이용안내</a><a href="../../privacy/">개인정보 처리방침</a><a href="../../contact/">오류 신고</a><a href="../../media-policy/">사진 이용안내</a></nav></footer>
<script>
(async function(){const app=document.getElementById('app'),id=new URLSearchParams(location.search).get('id'),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),fmt=n=>n==null?'—':Number(n).toLocaleString('ko-KR');if(!id){app.innerHTML='<div class="error"><h1>차량 ID가 없습니다.</h1><p><a href="../">전체 차량 데이터베이스로 돌아가기</a></p></div>';return}let data;try{const r=await fetch('../../data/generated/all-car-catalog.json',{cache:'no-store'});if(!r.ok)throw new Error();data=await r.json()}catch{app.innerHTML='<div class="error"><h1>데이터를 불러오지 못했습니다.</h1></div>';return}const g=data.groups.find(x=>x.catalog_id===id);if(!g){app.innerHTML='<div class="error"><h1>해당 차량 데이터를 찾지 못했습니다.</h1><p><a href="../">전체 차량 데이터베이스</a></p></div>';return}document.title=`${g.model} 공식 연비 신고 데이터 | 내차데이터`;const types=g.types.length?g.types.join(' · '):'—',classes=g.vehicle_classes.length?g.vehicle_classes.join(' · '):'—';app.innerHTML=`<div class="record-head"><div class="db-kicker">한국에너지공단 신고 데이터</div><h1>${esc(g.model)}</h1><div class="record-meta">${esc(g.maker)} · ${esc(classes)} · ${g.source_status==='active'?'현재 제공 자료':'과거 제공 자료'}</div><div class="record-actions"><a href="../">전체 차량</a>${g.reviewed_detail_path?`<a class="primary" href="../..${esc(g.reviewed_detail_path)}">상세제원 보기</a>`:''}</div></div><div class="record-summary"><div><span>사양</span><b>${fmt(g.row_count)}</b></div><div><span>유형</span><b style="font-size:14px">${esc(types)}</b></div><div><span>최초 등록</span><b style="font-size:14px">${esc(g.first_seen_at)}</b></div><div><span>최근 확인</span><b style="font-size:14px">${esc(g.last_seen_at)}</b></div></div><div class="record-table-wrap"><table class="record-table"><thead><tr><th>신고 차명</th><th>유형</th><th class="num">배기량(cc)</th><th class="num">복합</th><th class="num">도심</th><th class="num">고속</th><th class="num">등급</th><th class="num">1회 충전거리</th></tr></thead><tbody>${g.records.map(r=>`<tr><td>${esc(r.model)}</td><td>${esc(r.type||'—')}</td><td class="num">${fmt(r.displacement_cc)}</td><td class="num">${fmt(r.combined_efficiency)}</td><td class="num">${fmt(r.city_efficiency)}</td><td class="num">${fmt(r.highway_efficiency)}</td><td class="num">${fmt(r.efficiency_grade)}</td><td class="num">${r.range_km==null?'—':fmt(r.range_km)+' km'}</td></tr>`).join('')}</tbody></table></div><p class="note">복합·도심·고속 수치는 원문 데이터의 단위를 따릅니다. 전기차와 내연기관의 단위를 임의로 섞어 계산하지 않습니다. 연료 종류와 배기량이 있는 사양은 자동차세와 연료비를 계산할 수 있습니다.</p>`})();
</script></body></html>

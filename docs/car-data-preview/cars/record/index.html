<!doctype html>
<html lang="ko"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive"><title>자동차 공식 신고 데이터 | 내차데이터</title><meta name="description" content="한국에너지공단 자동차 표시연비 원문 신고행을 차량 모델 그룹별로 확인합니다."><link rel="canonical" href="https://5ggul.github.io/pm-lab/car-data-preview/cars/record/"><link rel="stylesheet" href="../../assets/site.css"><link rel="stylesheet" href="../../assets/home.css">
<style>.record-head{border-bottom:2px solid #111;padding-bottom:20px}.record-head h1{margin:4px 0 8px;font-size:34px;letter-spacing:-.04em}.record-meta{font-size:13px;color:#666}.record-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}.record-actions a{display:inline-flex;align-items:center;min-height:44px;padding:0 13px;border:1px solid #bbb;color:#111;text-decoration:none}.record-actions a.primary{background:#111;color:#fff;border-color:#111}.record-summary{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid #ddd;border-left:1px solid #ddd;margin:24px 0}.record-summary div{padding:14px;border-right:1px solid #ddd;border-bottom:1px solid #ddd}.record-summary b{display:block;font-size:20px;margin-top:4px}.record-table-wrap{overflow-x:auto;border-top:2px solid #111}.record-table{width:100%;border-collapse:collapse;min-width:1050px}.record-table th,.record-table td{padding:11px 9px;border-bottom:1px solid #e7e7e7;text-align:left;font-size:12px;vertical-align:top}.record-table th{background:#fafafa;color:#666}.num{text-align:right!important;font-variant-numeric:tabular-nums;white-space:nowrap}.note{font-size:12px;color:#777;margin-top:14px}.error{padding:40px 0;border-top:2px solid #111}.badge{display:inline-block;padding:2px 6px;border:1px solid #bbb;font-size:11px}.current{color:#174ea6;border-color:#7293ca}@media(max-width:700px){.record-head h1{font-size:27px}.record-summary{grid-template-columns:repeat(2,1fr)}}</style>
</head><body>
<header class="db-header"><div class="db-shell"><a class="db-logo" href="../../">내차데이터</a><nav class="db-nav"><a href="../">차량</a><a href="../../compare/">비교</a><a href="../../tools/annual-cost/">1년 유지비</a><a href="../../recalls/">리콜</a><a href="../../data-sources/">출처</a></nav></div></header>
<main><section class="db-section"><div class="db-shell" id="app"><p>데이터를 불러오는 중…</p></div></section></main>
<footer class="db-footer"><div class="db-shell"><div>이 화면은 공식 소스의 신고행을 그대로 확인하는 데이터 보기입니다. 세대·사양 검수를 마친 모델만 별도 상세 페이지가 연결됩니다.</div></div></footer>
<script>
(async function(){const app=document.getElementById('app'),id=new URLSearchParams(location.search).get('id'),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),fmt=n=>n==null?'—':Number(n).toLocaleString('ko-KR');if(!id){app.innerHTML='<div class="error"><h1>차량 ID가 없습니다.</h1><p><a href="../">전체 차량 데이터베이스로 돌아가기</a></p></div>';return}let data;try{const r=await fetch('../../data/generated/all-car-catalog.json',{cache:'no-store'});if(!r.ok)throw new Error();data=await r.json()}catch{app.innerHTML='<div class="error"><h1>데이터를 불러오지 못했습니다.</h1></div>';return}const g=data.groups.find(x=>x.catalog_id===id);if(!g){app.innerHTML='<div class="error"><h1>해당 차량 데이터를 찾지 못했습니다.</h1><p><a href="../">전체 차량 데이터베이스</a></p></div>';return}document.title=`${g.model} 공식 연비 신고 데이터 | 내차데이터`;const types=g.types.length?g.types.join(' · '):'—',classes=g.vehicle_classes.length?g.vehicle_classes.join(' · '):'—';app.innerHTML=`<div class="record-head"><div class="db-kicker">한국에너지공단 신고 데이터</div><h1>${esc(g.model)}</h1><div class="record-meta">${esc(g.maker)} · ${esc(classes)} · ${g.source_status==='active'?'현재 API 제공':'이전 API 제공 기록'}</div><div class="record-actions"><a href="../">전체 차량</a>${g.reviewed_detail_path?`<a class="primary" href="../..${esc(g.reviewed_detail_path)}">검수 완료 상세 보기</a>`:''}</div></div><div class="record-summary"><div><span>신고행</span><b>${fmt(g.row_count)}</b></div><div><span>유형</span><b style="font-size:14px">${esc(types)}</b></div><div><span>최초 수집</span><b style="font-size:14px">${esc(g.first_seen_at)}</b></div><div><span>최근 확인</span><b style="font-size:14px">${esc(g.last_seen_at)}</b></div></div><div class="record-table-wrap"><table class="record-table"><thead><tr><th>원문 모델명</th><th>유형</th><th class="num">배기량(cc)</th><th class="num">복합</th><th class="num">도심</th><th class="num">고속</th><th class="num">등급</th><th class="num">1회 충전거리</th><th>검수상태</th></tr></thead><tbody>${g.records.map(r=>`<tr><td>${esc(r.model)}</td><td>${esc(r.type||'—')}</td><td class="num">${fmt(r.displacement_cc)}</td><td class="num">${fmt(r.combined_efficiency)}</td><td class="num">${fmt(r.city_efficiency)}</td><td class="num">${fmt(r.highway_efficiency)}</td><td class="num">${fmt(r.efficiency_grade)}</td><td class="num">${r.range_km==null?'—':fmt(r.range_km)+' km'}</td><td>${r.reviewed_generation_ready?'<span class="badge current">검수 세대 연결</span>':r.current_generation_candidate?'<span class="badge">현행 세대 후보</span>':'<span class="badge">원문 데이터</span>'}</td></tr>`).join('')}</tbody></table></div><p class="note">복합·도심·고속 수치는 원문 데이터의 단위를 따릅니다. 전기차와 내연기관의 단위를 임의로 섞어 계산하지 않습니다. 상세 계산·세금·비교 기능은 정규화 검수를 통과한 사양에서만 제공합니다.</p>`})();
</script></body></html>

<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <title>전체 자동차 연비 데이터베이스 | 내차데이터</title>
  <meta name="description" content="한국에너지공단 자동차 표시연비 데이터의 전체 차량·신고행을 검색하고 제조사, 모델명, 연비·전비 정보를 확인합니다.">
  <link rel="canonical" href="https://5ggul.github.io/pm-lab/car-data-preview/cars/">
  <link rel="stylesheet" href="../assets/site.css">
  <link rel="stylesheet" href="../assets/home.css">
  <style>
    .allcar-head{display:flex;justify-content:space-between;gap:20px;align-items:end}.allcar-stats{font-size:13px;color:#666}.allcar-controls{display:grid;grid-template-columns:minmax(260px,2fr) repeat(2,minmax(150px,.6fr));gap:8px;margin-top:22px}.allcar-controls input,.allcar-controls select{height:46px;border:1px solid #cfcfcf;background:#fff;padding:0 12px;font:inherit}.allcar-summary{display:flex;justify-content:space-between;gap:12px;align-items:center;margin:18px 0 10px;font-size:13px;color:#666}.allcar-table-wrap{width:100%;max-width:100%;min-width:0;border-top:2px solid #111;overflow-x:auto;background:#fff}.allcar-table{width:100%;border-collapse:collapse;min-width:880px}.allcar-table th,.allcar-table td{padding:13px 11px;border-bottom:1px solid #e7e7e7;text-align:left;vertical-align:top;font-size:13px}.allcar-table th{font-size:12px;color:#666;background:#fafafa}.allcar-table tr:hover td{background:#fcfcfc}.allcar-model{font-size:15px;font-weight:700;color:#111;text-decoration:none}.allcar-model:hover{text-decoration:underline}.allcar-sub{font-size:11px;color:#777;margin-top:3px}.allcar-num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}.allcar-badge{font-size:11px;border:1px solid #ccc;padding:2px 6px;white-space:nowrap}.allcar-reviewed{border-color:#6a8ac5;color:#174ea6}.allcar-archived{color:#888}.allcar-actions{white-space:nowrap}.allcar-actions a{display:inline-block;margin-right:8px;color:#174ea6}.pager{display:flex;justify-content:center;align-items:center;gap:6px;margin:24px 0;max-width:100%;flex-wrap:wrap}.pager button{min-width:44px;height:44px;border:1px solid #ccc;background:#fff;cursor:pointer}.pager button.active{background:#111;color:#fff;border-color:#111}.pager button:disabled{opacity:.35;cursor:default}.load-error{border-top:2px solid #111;padding:28px 0;color:#8a2f20}.source-strip{font-size:12px;color:#777;margin-top:12px}
    @media(max-width:700px){.allcar-head{display:block}.allcar-stats{margin-top:8px;overflow-wrap:anywhere}.allcar-controls{grid-template-columns:minmax(0,1fr)}.allcar-controls input,.allcar-controls select{min-width:0}.allcar-summary{display:block}.allcar-summary span{display:block;margin-top:4px}.allcar-table-wrap{overflow:visible}.allcar-table{min-width:0;width:100%;display:block}.allcar-table thead{display:none}.allcar-table tbody{display:block;width:100%}.allcar-table tr{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:5px 12px;padding:15px 0;border-bottom:1px solid #e7e7e7;width:100%}.allcar-table td{display:block;width:auto;min-width:0;padding:0;border:0}.allcar-table td:first-child{grid-column:1/-1}.allcar-table td:nth-child(2){grid-column:1/2;color:#666}.allcar-table td:nth-child(3){grid-column:2/3;grid-row:2;text-align:right}.allcar-table td:nth-child(4){grid-column:1/2}.allcar-table td:nth-child(5){grid-column:1/-1;padding-top:4px}.allcar-actions{white-space:normal}.allcar-actions a{min-height:44px;display:inline-flex;align-items:center;margin-right:12px}.allcar-model{overflow-wrap:anywhere}.allcar-badge{white-space:normal;display:inline-block}}
  </style>
</head>
<body>
<header class="db-header"><div class="db-shell"><a class="db-logo" href="../">내차데이터</a><nav class="db-nav"><a href="./">차량</a><a href="../compare/">비교</a><a href="../tools/annual-cost/">1년 유지비</a><a href="../recalls/">리콜</a><a href="../data-sources/">출처</a></nav></div></header>
<main>
  <section class="page-hero"><div class="db-shell">
    <div class="allcar-head"><div><div class="db-kicker">한국에너지공단 전체 데이터</div><h1>차량 전체 데이터베이스</h1><p>검수 완료 몇 대만 보여주는 목록이 아니라, 현재 공식 소스가 제공하는 전체 모델·신고행을 검색합니다.</p></div><div class="allcar-stats" id="topStats">데이터 불러오는 중…</div></div>
    <div class="allcar-controls">
      <input id="q" type="search" placeholder="차량명·제조사·유형 검색 (예: 쏘렌토, BMW, 하이브리드)" aria-label="차량 검색">
      <select id="maker" aria-label="제조사"><option value="">모든 제조사</option></select>
      <select id="status" aria-label="데이터 상태"><option value="active">현재 API 제공</option><option value="all">전체 + 이전 제공 기록</option><option value="removed_from_latest">이전 제공 기록</option></select>
    </div>
  </div></section>
  <section class="db-section"><div class="db-shell">
    <div class="allcar-summary"><strong id="resultCount">불러오는 중…</strong><span id="updateInfo"></span></div>
    <div id="tableHost" class="allcar-table-wrap"></div>
    <div id="pager" class="pager"></div>
    <div class="source-strip">출처: 한국에너지공단 자동차 표시연비 정보 · 상세 검수 페이지가 없는 차량도 원문 신고행은 데이터베이스에서 확인할 수 있습니다.</div>
  </div></section>
</main>
<footer class="db-footer"><div class="db-shell"><div>신규 API 행은 자동 수집 후 전체 데이터베이스에 추가합니다. 개별 SEO 상세 페이지는 별도 품질 검수를 통과한 경우에만 생성합니다.</div><div class="db-footer-links"><a href="../data-sources/">데이터 출처</a><a href="../methodology/">계산 기준</a><a href="../qa/vehicle-families/">차량군 QA</a></div></div></footer>
<script>
(async function(){
  const PAGE_SIZE=50, qEl=document.getElementById('q'), makerEl=document.getElementById('maker'), statusEl=document.getElementById('status'), host=document.getElementById('tableHost'), pager=document.getElementById('pager');
  const p=new URLSearchParams(location.search); qEl.value=p.get('q')||''; statusEl.value=p.get('status')||'active'; let page=Math.max(1,Number(p.get('page')||1));
  const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const fmt=n=>n==null?'—':Number(n).toLocaleString('ko-KR');
  const norm=s=>String(s??'').toLowerCase().replace(/[\s_-]+/g,'');
  let data;
  try{const r=await fetch('../data/generated/all-car-catalog.json',{cache:'no-store'});if(!r.ok)throw new Error('HTTP '+r.status);data=await r.json()}catch(e){host.innerHTML='<div class="load-error">전체 차량 데이터베이스를 불러오지 못했습니다.</div>';return}
  document.getElementById('topStats').textContent=`현재 ${fmt(data.active_group_count)}개 모델 그룹 · ${fmt(data.active_record_count)}개 신고행 · ${fmt(data.maker_count)}개 제조사 표기`;
  document.getElementById('updateInfo').textContent=`갱신 ${String(data.source_fetched_at||data.generated_at||'').replace('T',' ').slice(0,16)}`;
  makerEl.innerHTML='<option value="">모든 제조사</option>'+data.makers.map(m=>`<option value="${esc(m.maker)}">${esc(m.maker)} (${fmt(m.count)})</option>`).join(''); makerEl.value=p.get('maker')||'';
  function updateUrl(){const u=new URL(location.href);const q=qEl.value.trim(),maker=makerEl.value,status=statusEl.value;if(q)u.searchParams.set('q',q);else u.searchParams.delete('q');if(maker)u.searchParams.set('maker',maker);else u.searchParams.delete('maker');if(status!=='active')u.searchParams.set('status',status);else u.searchParams.delete('status');if(page>1)u.searchParams.set('page',page);else u.searchParams.delete('page');history.replaceState(null,'',u)}
  function rowsFor(){const nq=norm(qEl.value),maker=makerEl.value,status=statusEl.value;return data.groups.filter(g=>(status==='all'||g.source_status===status)&&(!maker||g.maker===maker)&&(!nq||[g.maker,g.model,...g.types,...g.vehicle_classes].some(v=>norm(v).includes(nq))))}
  function render(){const list=rowsFor(),pages=Math.max(1,Math.ceil(list.length/PAGE_SIZE));if(page>pages)page=pages;const slice=list.slice((page-1)*PAGE_SIZE,page*PAGE_SIZE);document.getElementById('resultCount').textContent=`${fmt(list.length)}개 모델 그룹 · ${page}/${pages} 페이지`;
    host.innerHTML=`<table class="allcar-table"><thead><tr><th>제조사 / 모델</th><th>유형</th><th class="allcar-num">신고행</th><th>상태</th><th>보기</th></tr></thead><tbody>${slice.map(g=>`<tr><td><a class="allcar-model" href="./record/?id=${encodeURIComponent(g.catalog_id)}">${esc(g.model)}</a><div class="allcar-sub">${esc(g.maker)}${g.vehicle_classes.length?' · '+esc(g.vehicle_classes.join(', ')):''}</div></td><td>${g.types.length?esc(g.types.slice(0,3).join(' · ')):'—'}</td><td class="allcar-num">${fmt(g.row_count)}</td><td>${g.reviewed_detail_path?'<span class="allcar-badge allcar-reviewed">검수 상세 연결</span>':g.source_status==='active'?'<span class="allcar-badge">API 제공</span>':'<span class="allcar-badge allcar-archived">이전 기록</span>'}</td><td class="allcar-actions"><a href="./record/?id=${encodeURIComponent(g.catalog_id)}">신고 데이터</a>${g.reviewed_detail_path?`<a href="..${esc(g.reviewed_detail_path)}">검수 상세</a>`:''}</td></tr>`).join('')}</tbody></table>`;
    const nums=[];const start=Math.max(1,page-2),end=Math.min(pages,page+2);nums.push(`<button ${page===1?'disabled':''} data-page="${page-1}">‹</button>`);for(let n=start;n<=end;n++)nums.push(`<button class="${n===page?'active':''}" data-page="${n}">${n}</button>`);nums.push(`<button ${page===pages?'disabled':''} data-page="${page+1}">›</button>`);pager.innerHTML=nums.join('');pager.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>{if(b.disabled)return;page=Number(b.dataset.page);updateUrl();render();scrollTo({top:0,behavior:'smooth'})});updateUrl();}
  let timer; qEl.addEventListener('input',()=>{clearTimeout(timer);timer=setTimeout(()=>{page=1;render()},120)});makerEl.onchange=statusEl.onchange=()=>{page=1;render()};render();
})();
</script>
</body></html>

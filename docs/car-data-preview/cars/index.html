<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive"><title>국산차 연비·자동차세·유지비 차량 목록 | 내차데이터</title><meta name="description" content="현대·기아·제네시스 검수 완료 차량을 제조사와 차급별로 보고 사양별 연비·전비, 자동차세, 유류비·충전비 정보를 확인합니다."><link rel="canonical" href="https://5ggul.github.io/pm-lab/car-data-preview/cars/"><link rel="stylesheet" href="../assets/site.css"><link rel="stylesheet" href="../assets/home.css"></head><body><header class="db-header"><div class="db-shell"><a class="db-logo" href="../">내차데이터</a><nav class="db-nav"><a href="./">차량</a><a href="../compare/">비교</a><a href="../tools/annual-cost/">1년 유지비</a><a href="../recalls/">리콜</a><a href="../data-sources/">출처</a></nav></div></header><main><section class="page-hero"><div class="db-shell"><div class="db-kicker">차량 카탈로그</div><h1>차량 전체보기</h1><p>검수 완료된 차량만 일반 목록에 표시합니다.</p><div class="filter-bar"><button class="active" data-filter="all">전체</button><button data-filter="현대">현대</button><button data-filter="기아">기아</button><button data-filter="제네시스">제네시스</button><button data-filter="sedan">세단</button><button data-filter="suv">SUV</button><button data-filter="ev">전기차</button></div></div></section><section class="db-section"><div class="db-shell"><div id="catalog" class="catalog-grid"></div><p class="notice" id="catalogStatus"></p></div></section></main><footer class="db-footer"><div class="db-shell"><div>검수 중 차량은 직접 URL 검수만 허용하고 일반 목록에서 제외합니다.</div><div class="db-footer-links"><a href="./hyundai/">현대</a><a href="./kia/">기아</a><a href="./genesis/">제네시스</a><a href="../methodology/">계산 기준</a></div></div></footer><script src="../assets/catalog-data.js"></script><script src="../assets/car-utils.js"></script><script>(function(){const C=CAR_CATALOG,U=CAR_UTILS,cars=C.publicCars||C.cars.filter(c=>c.indexable===true),box=document.getElementById('catalog'),buttons=[...document.querySelectorAll('[data-filter]')],q=new URLSearchParams(location.search).get('type');let f=q||'all';function render(){const list=cars.filter(c=>f==='all'||c.maker===f||c.type===f||(f==='suv'&&c.segment.includes('SUV')));box.innerHTML=list.map(c=>{const unit=c.energy==='ev'?'km/kWh':'km/L',last=c.energy==='ev'?`<div class="car-number-row"><span>주행거리</span><strong>${c.rep.range} km</strong></div>`:`<div class="car-number-row"><span>20,000km 에너지비</span><strong>${Number(c.rep.annualEnergy).toLocaleString('ko-KR')}원</strong></div>`,href=c.path.replace('./cars/','./');return `<a class="car-card" href="${href}"><div class="car-card-media"><img loading="lazy" src="${c.image}" alt="${c.model}" width="900" height="600"></div>${U.imageCreditHtml(c.imageMeta)}<div class="car-card-body"><div class="car-meta">${c.maker} · ${c.segment} · ${c.yearLabel}</div><h3>${c.model}</h3><div class="car-spec">${c.rep.label}</div><div class="car-numbers"><div class="car-number-row"><span>${c.energy==='ev'?'복합전비':'복합연비'}</span><strong>${c.rep.combined} ${unit}</strong></div><div class="car-number-row"><span>연간 정상 자동차세</span><strong>${Number(c.rep.tax).toLocaleString('ko-KR')}원</strong></div>${last}</div><div class="car-arrow">사양별 상세 →</div></div></a>`}).join('');document.getElementById('catalogStatus').textContent=`현재 공개 ${cars.length}대 · 표시 ${list.length}대`;buttons.forEach(b=>b.classList.toggle('active',b.dataset.filter===f))}buttons.forEach(b=>b.onclick=()=>{f=b.dataset.filter;render()});render()})();</script></body></html>

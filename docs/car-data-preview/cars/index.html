<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive">
  <title>전체 자동차 데이터베이스 | 내차데이터</title>
  <meta name="description" content="한국에너지공단 전체 자동차 데이터를 제조사·차종·세대·파워트레인 구조로 검색하고 원문 사양까지 확인합니다.">
  <link rel="canonical" href="https://5ggul.github.io/pm-lab/car-data-preview/cars/">
  <link rel="stylesheet" href="../assets/site.css"><link rel="stylesheet" href="../assets/home.css">
  <style>
    .allcar-head{display:flex;justify-content:space-between;gap:20px;align-items:end}.allcar-stats{font-size:13px;color:#666}.view-switch{display:flex;gap:0;margin-top:20px}.view-switch button{height:44px;padding:0 15px;border:1px solid #bbb;background:#fff;cursor:pointer}.view-switch button+button{border-left:0}.view-switch button.active{background:#111;color:#fff;border-color:#111}.allcar-controls{display:grid;grid-template-columns:minmax(260px,2fr) repeat(2,minmax(160px,.65fr));gap:8px;margin-top:10px}.allcar-controls input,.allcar-controls select{height:46px;border:1px solid #cfcfcf;background:#fff;padding:0 12px;font:inherit}.allcar-summary{display:flex;justify-content:space-between;gap:12px;align-items:center;margin:18px 0 10px;font-size:13px;color:#666}.allcar-table-wrap{width:100%;max-width:100%;min-width:0;border-top:2px solid #111;overflow-x:auto;background:#fff}.allcar-table{width:100%;border-collapse:collapse;min-width:930px}.allcar-table th,.allcar-table td{padding:13px 11px;border-bottom:1px solid #e7e7e7;text-align:left;vertical-align:top;font-size:13px}.allcar-table th{font-size:12px;color:#666;background:#fafafa}.allcar-table tr:hover td{background:#fcfcfc}.allcar-model{font-size:15px;font-weight:700;color:#111;text-decoration:none}.allcar-model:hover{text-decoration:underline}.allcar-sub{font-size:11px;color:#777;margin-top:3px}.allcar-num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}.allcar-badge{font-size:11px;border:1px solid #ccc;padding:2px 6px;white-space:nowrap}.allcar-reviewed{border-color:#6a8ac5;color:#174ea6}.allcar-raw{color:#806116;border-color:#c7ad65}.allcar-archived{color:#888}.allcar-actions{white-space:nowrap}.allcar-actions a{display:inline-block;margin-right:8px;color:#174ea6}.pager{display:flex;justify-content:center;align-items:center;gap:6px;margin:24px 0;max-width:100%;flex-wrap:wrap}.pager button{min-width:44px;height:44px;border:1px solid #ccc;background:#fff;cursor:pointer}.pager button.active{background:#111;color:#fff;border-color:#111}.pager button:disabled{opacity:.35;cursor:default}.load-error{border-top:2px solid #111;padding:28px 0;color:#8a2f20}.source-strip{font-size:12px;color:#777;margin-top:12px}.family-table th:nth-child(4),.family-table td:nth-child(4){display:none}.family-table th:nth-child(4),.family-table td:nth-child(4){display:none}.family-table th:nth-child(4),.family-table td:nth-child(4){display:none}.family-table th:nth-child(4),.family-table td:nth-child(4){display:none}
    @media(max-width:700px){.allcar-head{display:block}.allcar-stats{margin-top:8px;overflow-wrap:anywhere}.view-switch{width:100%}.view-switch button{flex:1}.allcar-controls{grid-template-columns:minmax(0,1fr)}.allcar-controls input,.allcar-controls select{min-width:0}.allcar-summary{display:block}.allcar-summary span{display:block;margin-top:4px}.allcar-table-wrap{overflow:visible}.allcar-table{min-width:0;width:100%;display:block}.allcar-table thead{display:none}.allcar-table tbody{display:block;width:100%}.allcar-table tr{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:5px 12px;padding:15px 0;border-bottom:1px solid #e7e7e7;width:100%}.allcar-table td{display:block;width:auto;min-width:0;padding:0;border:0}.allcar-table td:first-child{grid-column:1/-1}.allcar-table td:nth-child(2){grid-column:1/2;color:#666}.allcar-table td:nth-child(3){grid-column:2/3;grid-row:2;text-align:right}.allcar-table td:nth-child(4){grid-column:1/2}.allcar-table td:nth-child(5){grid-column:1/-1;padding-top:4px}.allcar-actions{white-space:normal}.allcar-actions a{min-height:44px;display:inline-flex;align-items:center;margin-right:12px}.allcar-model{overflow-wrap:anywhere}.allcar-badge{white-space:normal;display:inline-block}}
  </style>
</head>
<body>
<header class="db-header"><div class="db-shell"><a class="db-logo" href="../">내차데이터</a><nav class="db-nav"><a href="./">차량</a><a href="../compare/">비교</a><a href="../tools/annual-cost/">1년 유지비</a><a href="../recalls/">리콜</a><a href="../data-sources/">출처</a></nav></div></header>
<main>
  <section class="page-hero"><div class="db-shell">
    <div class="allcar-head"><div><div class="db-kicker">한국에너지공단 전체 데이터</div><h1>전체 차량</h1><p>한국에너지공단 공식 신고 데이터를 제조사 → 차종 → 세대 → 파워트레인 순으로 한눈에 확인할 수 있습니다.</p></div><div class="allcar-stats" id="topStats">데이터 불러오는 중…</div></div>
    <div class="view-switch" hidden><button id="familyView" class="active">차종 보기</button><button id="rawView">상세 사양 보기</button></div>
    <div class="allcar-controls"><input id="q" type="search" placeholder="차량명·제조사·세대·유형 검색 (예: 쏘렌토, BMW, 하이브리드)" aria-label="차량 검색"><select id="maker" aria-label="제조사"><option value="">모든 제조사</option></select><select id="filter" aria-label="차량 상태" hidden hidden></select></div>
  </div></section>
  <section class="db-section"><div class="db-shell"><div class="allcar-summary"><strong id="resultCount">불러오는 중…</strong><span id="updateInfo"></span></div><div id="tableHost" class="allcar-table-wrap"></div><div id="pager" class="pager"></div><div class="source-strip">출처: 한국에너지공단 자동차 표시연비 정보 · 모든 공식 신고 데이터는 삭제하지 않고 상세 사양 보기에서도 그대로 확인할 수 있습니다.</div></div></section>
</main>
<footer class="db-footer"><div class="db-shell"><div>새 차량과 변경된 제원은 공식 데이터 갱신 시 자동 반영합니다.</div><div class="db-footer-links"><a href="../data-sources/">데이터 출처</a><a href="../methodology/">계산 기준</a><a href="../qa/vehicle-families/">데이터 확인</a></div></div></footer>
<script>
(async function(){
  const PAGE_SIZE=50,qEl=document.getElementById('q'),makerEl=document.getElementById('maker'),filterEl=document.getElementById('filter'),host=document.getElementById('tableHost'),pager=document.getElementById('pager'),familyBtn=document.getElementById('familyView'),rawBtn=document.getElementById('rawView');
  const p=new URLSearchParams(location.search);let view='family',page=Math.max(1,Number(p.get('page')||1));qEl.value=p.get('q')||'';
  const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),fmt=n=>n==null?'—':Number(n).toLocaleString('ko-KR'),norm=s=>String(s??'').toLowerCase().replace(/[\s_.\-/]+/g,'');
  const statusLabel={reviewed_override:'',auto_high:'',auto_medium:'',raw_only:'공식 데이터'},ptLabel={gasoline:'휘발유',diesel:'경유',lpg:'LPG',hybrid:'하이브리드',phev:'플러그인 하이브리드',electric:'전기',hydrogen:'수소',unknown:'확인 중'};
  let h,c;try{const [hr,cr]=await Promise.all([fetch('../data/generated/service-hierarchy.json',{cache:'no-store'}),fetch('../data/generated/all-car-catalog.json',{cache:'no-store'})]);if(!hr.ok||!cr.ok)throw new Error();[h,c]=await Promise.all([hr.json(),cr.json()])}catch(e){host.innerHTML='<div class="load-error">전체 차량를 불러오지 못했습니다.</div>';return}
  function setControls(){familyBtn.classList.toggle('active',view==='family');rawBtn.classList.toggle('active',view==='raw');if(view==='family'){filterEl.hidden=true;document.getElementById('topStats').textContent=`현재 ${fmt(h.active_family_count)}개 차종 · ${fmt(h.active_generation_count)}개 세대 · ${fmt(h.source_active_record_count)}개 사양`;makerEl.innerHTML='<option value="">모든 제조사</option>'+h.makers.filter(m=>m.active_record_count>0).map(m=>`<option value="${esc(m.maker)}">${esc(m.maker)} (${fmt(m.active_family_count)})</option>`).join('');filterEl.innerHTML='<option value="all">모든 차량</option>'}else{filterEl.hidden=false;document.getElementById('topStats').textContent=`현재 ${fmt(c.active_group_count)}개 상세 사양 · ${fmt(c.active_record_count)}개 사양 · ${fmt(c.maker_count)}개 제조사 표기`;makerEl.innerHTML='<option value="">모든 제조사</option>'+c.makers.map(m=>`<option value="${esc(m.maker)}">${esc(m.maker)} (${fmt(m.count)})</option>`).join('');filterEl.innerHTML='<option value="active">현재 제공</option><option value="all">전체 + 과거 데이터</option><option value="과거 데이터">과거 데이터</option>'}makerEl.value=p.get('maker')||'';filterEl.value=view==='family'?'all':(p.get('filter')||'active')}
  function updateUrl(){const u=new URL(location.href),q=qEl.value.trim(),maker=makerEl.value,filter=filterEl.value;u.searchParams.delete('view');if(q)u.searchParams.set('q',q);else u.searchParams.delete('q');if(maker)u.searchParams.set('maker',maker);else u.searchParams.delete('maker');const def=view==='family'?'all':'active';if(filter!==def)u.searchParams.set('filter',filter);else u.searchParams.delete('filter');if(page>1)u.searchParams.set('page',page);else u.searchParams.delete('page');history.replaceState(null,'',u)}
  function familyRows(){const nq=norm(qEl.value),maker=makerEl.value,filter=filterEl.value;return h.families.filter(f=>f.active_record_count>0&&(!maker||f.maker===maker)&&(filter==='all'||f.normalization_status===filter)&&(!nq||[f.maker,f.family_name,...(f.raw_models||[]),...(f.generations||[]).map(g=>g.generation_label),...(f.powertrains||[]).map(x=>ptLabel[x.powertrain]||x.powertrain)].some(v=>norm(v).includes(nq))))}
  function rawRows(){const nq=norm(qEl.value),maker=makerEl.value,filter=filterEl.value;return c.groups.filter(g=>(filter==='all'||g.source_status===filter)&&(!maker||g.maker===maker)&&(!nq||[g.maker,g.model,...g.types,...g.vehicle_classes].some(v=>norm(v).includes(nq))))}
  function familyTable(list){return `<table class="allcar-table family-table"><thead><tr><th>제조사 / 차종</th><th>세대·파워트레인</th><th class="allcar-num">사양</th><th>데이터</th><th>보기</th></tr></thead><tbody>${list.map(f=>`<tr><td><a class="allcar-model" href="./family/?id=${encodeURIComponent(f.family_id)}">${esc(f.family_name)}</a><div class="allcar-sub">${esc(f.maker)}${f.category?esc(f.category):'공식 신고 데이터'} · 등록 사양 ${fmt(f.raw_group_count)}개</div></td><td>${fmt(f.generation_count)}세대 · ${(f.powertrains||[]).slice(0,4).map(x=>esc(ptLabel[x.powertrain]||x.powertrain)).join(' · ')||'—'}</td><td class="allcar-num">${fmt(f.active_record_count)}</td><td><span class="allcar-badge ${f.normalization_status==='reviewed_override'?'allcar-reviewed':f.normalization_status==='raw_only'?'allcar-raw':''}">${esc(statusLabel[f.normalization_status]||f.normalization_status)}</span></td><td class="allcar-actions"><a href="./family/?id=${encodeURIComponent(f.family_id)}">차량 보기</a>${f.reviewed_detail_paths?.[0]?`<a href="..${esc(f.reviewed_detail_paths[0])}">상세제원</a>`:''}</td></tr>`).join('')}</tbody></table>`}
  function rawTable(list){return `<table class="allcar-table"><thead><tr><th>제조사 / 상세 사양</th><th>유형</th><th class="allcar-num">사양</th><th>상태</th><th>보기</th></tr></thead><tbody>${list.map(g=>`<tr><td><a class="allcar-model" href="./record/?id=${encodeURIComponent(g.catalog_id)}">${esc(g.model)}</a><div class="allcar-sub">${esc(g.maker)}${g.vehicle_classes.length?' · '+esc(g.vehicle_classes.join(', ')):''}</div></td><td>${g.types.length?esc(g.types.slice(0,3).join(' · ')):'—'}</td><td class="allcar-num">${fmt(g.row_count)}</td><td>${g.reviewed_detail_path?'<span class="allcar-badge allcar-reviewed">상세제원 있음</span>':g.source_status==='active'?'<span class="allcar-badge">현재 제공</span>':'<span class="allcar-badge allcar-archived">이전 기록</span>'}</td><td class="allcar-actions"><a href="./record/?id=${encodeURIComponent(g.catalog_id)}">신고 데이터</a>${g.reviewed_detail_path?`<a href="..${esc(g.reviewed_detail_path)}">상세제원</a>`:''}</td></tr>`).join('')}</tbody></table>`}
  function render(){const rows=view==='family'?familyRows():rawRows(),pages=Math.max(1,Math.ceil(rows.length/PAGE_SIZE));if(page>pages)page=pages;const slice=rows.slice((page-1)*PAGE_SIZE,page*PAGE_SIZE);document.getElementById('resultCount').textContent=`${fmt(rows.length)}개 ${view==='family'?'차종':'상세 사양'} · ${page}/${pages} 페이지`;document.getElementById('updateInfo').textContent=`갱신 ${String(h.source_fetched_at||c.source_fetched_at||c.generated_at||'').replace('T',' ').slice(0,16)}`;host.innerHTML=view==='family'?familyTable(slice):rawTable(slice);const nums=[],start=Math.max(1,page-2),end=Math.min(pages,page+2);nums.push(`<button ${page===1?'disabled':''} data-page="${page-1}">‹</button>`);for(let n=start;n<=end;n++)nums.push(`<button class="${n===page?'active':''}" data-page="${n}">${n}</button>`);nums.push(`<button ${page===pages?'disabled':''} data-page="${page+1}">›</button>`);pager.innerHTML=nums.join('');pager.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>{if(b.disabled)return;page=Number(b.dataset.page);updateUrl();render();scrollTo({top:0,behavior:'smooth'})});updateUrl()}
  function switchView(next){if(view===next)return;view=next;page=1;const currentQ=qEl.value;p.delete('maker');p.delete('filter');setControls();qEl.value=currentQ;render()}
  familyBtn.onclick=()=>switchView('family');rawBtn.onclick=()=>switchView('raw');let timer;qEl.addEventListener('input',()=>{clearTimeout(timer);timer=setTimeout(()=>{page=1;render()},120)});makerEl.onchange=filterEl.onchange=()=>{page=1;render()};setControls();render();
})();
</script>
</body></html>

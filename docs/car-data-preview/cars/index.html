<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive"><title>국산차 연비·자동차세·유지비 차량 목록 | 내차데이터</title><meta name="description" content="현대·기아·제네시스 검수 차량을 제조사와 차급별로 보고 사양별 연비, 자동차세, 유류비·전비 정보를 확인합니다."><link rel="stylesheet" href="../assets/site.css"><link rel="stylesheet" href="../assets/home.css"></head><body><header class="db-header"><div class="db-shell"><a class="db-logo" href="../">내차데이터</a><nav class="db-nav"><a href="./">차량</a><a href="../compare/">비교</a><a href="../tools/annual-cost/">1년 유지비</a><a href="../recalls/">리콜</a><a href="../data-sources/">출처</a></nav></div></header><main><section class="page-hero"><div class="db-shell"><div class="db-kicker">차량 카탈로그</div><h1>차량 전체보기</h1><p>모델명만 늘리지 않고 공식 사양과 계산값을 검수한 차량만 보여줍니다.</p><div class="filter-bar"><button class="active" data-filter="all">전체 7</button><button data-filter="현대">현대 3</button><button data-filter="기아">기아 3</button><button data-filter="제네시스">제네시스 1</button><button data-filter="sedan">세단</button><button data-filter="suv">SUV</button><button data-filter="ev">전기차</button></div></div></section><section class="db-section"><div class="db-shell"><div id="catalog" class="catalog-grid"></div></div></section></main><footer class="db-footer"><div class="db-shell"><div>차량 목록은 검수 완료 모델만 추가합니다.</div><div class="db-footer-links"><a href="./hyundai/">현대</a><a href="./kia/">기아</a><a href="./genesis/">제네시스</a><a href="../methodology/">계산 기준</a></div></div></footer><script src="../assets/catalog-data.js"></script><script>(function(){const C=CAR_CATALOG,box=document.getElementById('catalog'),buttons=[...document.querySelectorAll('[data-filter]')];const q=new URLSearchParams(location.search).get('type');let f=q||'all';function render(){const list=C.cars.filter(c=>f==='all'||c.maker===f||c.type===f||(f==='suv'&&c.segment.includes('SUV')));box.innerHTML=list.map(c=>{const unit=c.energy==='ev'?'km/kWh':'km/L',last=c.energy==='ev'?`<div class="car-number-row"><span>주행거리</span><strong>${c.rep.range} km</strong></div>`:`<div class="car-number-row"><span>2만km 유류비</span><strong>${Number(c.rep.annualEnergy).toLocaleString('ko-KR')}원</strong></div>`;return `<a class="car-card" href="${c.path}"><div class="car-card-media"><img src="${c.image}" alt="${c.model}"><small>${c.credit}</small></div><div class="car-card-body"><div class="car-meta">${c.maker} · ${c.segment} · ${c.yearLabel}</div><h3>${c.model}</h3><div class="car-spec">${c.rep.label}</div><div class="car-numbers"><div class="car-number-row"><span>${c.energy==='ev'?'복합전비':'복합연비'}</span><strong>${c.rep.combined} ${unit}</strong></div><div class="car-number-row"><span>자동차세</span><strong>${Number(c.rep.tax).toLocaleString('ko-KR')}원</strong></div>${last}</div><div class="car-arrow">사양별 상세 →</div></div></a>`}).join('');buttons.forEach(b=>b.classList.toggle('active',b.dataset.filter===f))}buttons.forEach(b=>b.onclick=()=>{f=b.dataset.filter;render()});render()})();</script></body></html>

<!doctype html>
<html lang="ko"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive">
<title>차량군 데이터 | 내차데이터</title><meta name="description" content="한국에너지공단 전체 차량 데이터를 차종·세대·파워트레인 구조로 확인합니다.">
<link rel="canonical" href="https://5ggul.github.io/pm-lab/car-data-preview/cars/family/">
<link rel="stylesheet" href="../../assets/site.css"><link rel="stylesheet" href="../../assets/home.css">
<style>
.family-head{border-bottom:2px solid #111;padding-bottom:20px}.family-head h1{font-size:36px;letter-spacing:-.045em;margin:4px 0 8px}.family-meta{font-size:13px;color:#666}.family-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}.family-actions a{display:inline-flex;align-items:center;min-height:44px;border:1px solid #bbb;padding:0 13px;text-decoration:none;color:#111}.family-actions a.primary{background:#111;color:#fff;border-color:#111}.family-stats{display:grid;grid-template-columns:repeat(5,1fr);border-left:1px solid #ddd;border-top:1px solid #ddd;margin:24px 0}.family-stats div{padding:14px;border-right:1px solid #ddd;border-bottom:1px solid #ddd}.family-stats span{font-size:11px;color:#777}.family-stats b{display:block;font-size:19px;margin-top:5px}.generation{margin:28px 0 38px}.generation-head{display:flex;justify-content:space-between;gap:12px;align-items:end;border-bottom:2px solid #111;padding-bottom:10px}.generation-head h2{font-size:22px;margin:0}.generation-meta{font-size:12px;color:#777}.pt-list{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0}.pt{border:1px solid #ccc;padding:4px 7px;font-size:11px}.raw-list{border-top:1px solid #ddd}.raw-row{display:grid;grid-template-columns:minmax(0,2fr) minmax(120px,.8fr) 90px 120px;gap:12px;padding:13px 0;border-bottom:1px solid #e5e5e5;align-items:center}.raw-model{font-weight:700;color:#111;text-decoration:none}.raw-sub{font-size:11px;color:#777;margin-top:3px}.raw-num{text-align:right;font-variant-numeric:tabular-nums}.badge{display:inline-block;border:1px solid #bbb;padding:2px 6px;font-size:11px}.badge.ok{border-color:#7293ca;color:#174ea6}.note{font-size:12px;color:#777;margin-top:20px}.error{padding:40px 0;border-top:2px solid #111}
@media(max-width:700px){.family-head h1{font-size:29px}.family-stats{grid-template-columns:repeat(2,1fr)}.generation-head{display:block}.generation-meta{margin-top:5px}.raw-row{grid-template-columns:minmax(0,1fr) auto;gap:5px 10px}.raw-row>div:first-child{grid-column:1/-1}.raw-row>div:nth-child(2){grid-column:1/2}.raw-row>div:nth-child(3){grid-column:2/3;text-align:right}.raw-row>div:nth-child(4){grid-column:1/-1}.raw-row a{min-height:44px;display:inline-flex;align-items:center}}
</style></head><body>
<header class="db-header"><div class="db-shell"><a class="db-logo" href="../../">내차데이터</a><nav class="db-nav"><a href="../">차량</a><a href="../../compare/">비교</a><a href="../../tools/annual-cost/">1년 유지비</a><a href="../../recalls/">리콜</a><a href="../../data-sources/">출처</a></nav></div></header>
<main><section class="db-section"><div class="db-shell" id="app"><p>데이터를 불러오는 중…</p></div></section></main>
<footer class="db-footer"><div class="db-shell"><div>자동 정규화 결과는 검색·탐색용입니다. 개별 SEO 상세는 별도 검수를 통과한 차량만 생성합니다.</div></div></footer>
<script>
(async function(){
const app=document.getElementById('app'),id=new URLSearchParams(location.search).get('id'),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),fmt=n=>n==null?'—':Number(n).toLocaleString('ko-KR');
if(!id){app.innerHTML='<div class="error"><h1>차량군 ID가 없습니다.</h1><p><a href="../">전체 차량으로 돌아가기</a></p></div>';return}
let h,c;try{const [hr,cr]=await Promise.all([fetch('../../data/generated/service-hierarchy.json',{cache:'no-store'}),fetch('../../data/generated/all-car-catalog.json',{cache:'no-store'})]);if(!hr.ok||!cr.ok)throw new Error();[h,c]=await Promise.all([hr.json(),cr.json()])}catch{app.innerHTML='<div class="error"><h1>차량 데이터를 불러오지 못했습니다.</h1></div>';return}
const f=h.families.find(x=>x.family_id===id);if(!f){app.innerHTML='<div class="error"><h1>해당 차량군을 찾지 못했습니다.</h1><p><a href="../">전체 차량</a></p></div>';return}
const groupMap=new Map(c.groups.map(g=>[g.catalog_id,g])),statusLabel={reviewed_override:'검수 규칙',auto_high:'자동 고신뢰',auto_medium:'자동 중신뢰',raw_only:'원문 기준'},ptLabel={gasoline:'휘발유',diesel:'경유',lpg:'LPG',hybrid:'하이브리드',phev:'플러그인 하이브리드',electric:'전기',hydrogen:'수소',unknown:'유형 미분류'};
document.title=`${f.family_name} 차량 데이터 | 내차데이터`;
const reviewed=f.reviewed_detail_paths?.[0];
let html=`<div class="family-head"><div class="db-kicker">${esc(f.maker)} · 전체 공식 신고 데이터</div><h1>${esc(f.family_name)}</h1><div class="family-meta"><span class="badge ${f.normalization_status==='reviewed_override'?'ok':''}">${esc(statusLabel[f.normalization_status]||f.normalization_status)}</span> · 정규화 신뢰도 ${Math.round((f.confidence||0)*100)}%${f.category?' · '+esc(f.category):''}</div><div class="family-actions"><a href="../">전체 차량</a><a href="../?view=raw&q=${encodeURIComponent(f.family_name)}">원문 그룹 검색</a>${reviewed?`<a class="primary" href="../..${esc(reviewed)}">검수 완료 상세</a>`:''}</div></div>`;
html+=`<div class="family-stats"><div><span>공식 신고행</span><b>${fmt(f.active_record_count)}</b></div><div><span>원문 모델 그룹</span><b>${fmt(f.raw_group_count)}</b></div><div><span>세대 그룹</span><b>${fmt(f.generation_count)}</b></div><div><span>계산 가능 행</span><b>${fmt(f.calculator_ready_record_count)}</b></div><div><span>파워트레인</span><b>${fmt(f.powertrains?.length||0)}</b></div></div>`;
for(const gen of (f.generations||[]).filter(g=>g.active_record_count>0)){
  const groups=(gen.raw_group_ids||[]).map(id=>groupMap.get(id)).filter(Boolean).filter(g=>g.source_status==='active');
  html+=`<section class="generation"><div class="generation-head"><h2>${esc(gen.generation_label)}</h2><div class="generation-meta">${fmt(gen.active_record_count)}개 신고행 · ${fmt(gen.raw_group_count)}개 원문 그룹 · 계산 가능 ${fmt(gen.calculator_ready_record_count)}</div></div><div class="pt-list">${(gen.powertrains||[]).map(p=>`<span class="pt">${esc(ptLabel[p.powertrain]||p.powertrain)} ${fmt(p.count)}</span>`).join('')}</div><div class="raw-list">${groups.map(g=>{const gi=h.group_index[g.catalog_id]||{};return `<div class="raw-row"><div><a class="raw-model" href="../record/?id=${encodeURIComponent(g.catalog_id)}">${esc(g.model)}</a><div class="raw-sub">${esc(g.maker)}${g.vehicle_classes?.length?' · '+esc(g.vehicle_classes.join(', ')):''}</div></div><div>${esc((gi.powertrains||[]).map(x=>ptLabel[x]||x).join(' · ')||'—')}</div><div class="raw-num">${fmt(g.row_count)}행</div><div><a href="../record/?id=${encodeURIComponent(g.catalog_id)}">신고 데이터 보기</a></div></div>`}).join('')}</div></section>`;
}
html+=`<p class="note">세대가 ‘세대 미분류’로 표시된 경우 원문에 안정적으로 식별 가능한 세대 코드가 없거나 아직 검수 규칙이 없는 상태입니다. 해당 차량도 원문 신고행은 누락 없이 유지합니다.</p>`;app.innerHTML=html;
})();
</script></body></html>

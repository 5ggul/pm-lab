source-health{display:inline-block;border:1px solid #bbb;padding:2px 6px;margin-left:5px}.generation{margin:28px 0 38px}.generation-head{display:flex;justify-content:space-between;gap:12px;align-items:end;border-bottom:2px solid #111;padding-bottom:10px}.generation-head h2{font-size:22px;margin:0}.generation-meta{font-size:12px;color:#777}.pt-list{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0}.pt{border:1px solid #ccc;padding:4px 7px;font-size:11px}.raw-list{border-top:1px solid #ddd}.raw-row{display:grid;grid-template-columns:minmax(0,2fr) minmax(120px,.8fr) 90px 150px;gap:12px;padding:13px 0;border-bottom:1px solid #e5e5e5;align-items:center}.raw-model{font-weight:700;color:#111;text-decoration:none}.raw-sub{font-size:11px;color:#777;margin-top:3px}.raw-num{text-align:right;font-variant-numeric:tabular-nums}.raw-actions{display:flex;gap:10px;flex-wrap:wrap}.raw-actions a{color:#174ea6}.badge{display:inline-block;border:1px solid #bbb;padding:2px 6px;font-size:11px}.badge.ok{border-color:#7293ca;color:#174ea6}.note{font-size:12px;color:#777;margin-top:20px}.error{padding:40px 0;border-top:2px solid #111}
@media(max-width:700px){.family-head h1{font-size:29px}.family-stats{grid-template-columns:repeat(2,1fr)}.calc-strip{display:block}.calc-strip span{display:block;margin-top:5px}.spec-head{display:block}.spec-head p{margin-top:8px}.spec-grid{grid-template-columns:repeat(2,1fr)}.spec-row{grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:5px 10px}.spec-row.head{display:none}.spec-row>div:first-child{grid-column:1/-1;font-weight:700}.generation-head{display:block}.generation-meta{margin-top:5px}.raw-row{grid-template-columns:minmax(0,1fr) auto;gap:5px 10px}.raw-row>div:first-child{grid-column:1/-1}.raw-row>div:nth-child(2){grid-column:1/2}.raw-row>div:nth-child(3){grid-column:2/3;text-align:right}.raw-row>div:nth-child(4){grid-column:1/-1}.raw-row a{min-height:44px;display:inline-flex;align-items:center}}
</style></head><body>
<header class="db-header"><div class="db-shell"><a class="db-logo" href="../../">내차데이터</a><nav class="db-nav"><a href="../">차량</a><a href="../../compare/">비교</a><a href="../../tools/annual-cost/">1년 유지비</a><a href="../../recalls/">리콜</a><a href="../../data-sources/">출처</a></nav></div></header>
<main><section class="db-section"><div class="db-shell" id="app"><p>데이터를 불러오는 중…</p></div></section></main>
<footer class="db-footer"><div class="db-shell"><div>자동 정규화 결과는 검색·탐색용입니다. 개별 SEO 상세는 별도 검수를 통과한 차량만 생성합니다.</div></div></footer>
<script>
(async function(){
const app=document.getElementById('app'),id=new URLSearchParams(location.search).get('id'),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),fmt=n=>n==null?'—':Number(n).toLocaleString('ko-KR');
if(!id){app.innerHTML='<div class="error"><h1>차량군 ID가 없습니다.</h1><p><a href="../">전체 차량으로 돌아가기</a></p></div>';return}
let h,c,calc,specs;try{const [hr,cr,ar,sr]=await Promise.all([fetch('../../data/generated/service-hierarchy.json',{cache:'no-store'}),fetch('../../data/generated/all-car-catalog.json',{cache:'no-store'}),fetch('../../data/generated/all-car-calc-index.json',{cache:'no-store'}),fetch('../../data/generated/manufacturer-specs.json',{cache:'no-store'})]);if(!hr.ok||!cr.ok||!ar.ok)throw new Error();[h,c,calc]=await Promise.all([hr.json(),cr.json(),ar.json()]);specs=sr.ok?await sr.json():{records:[]}}catch{app.innerHTML='<div class="error"><h1>차량 데이터를 불러오지 못했습니다.</h1></div>';return}
const f=h.families.find(x=>x.family_id===id);if(!f){app.innerHTML='<div class="error"><h1>해당 차량군을 찾지 못했습니다.</h1><p><a href="../">전체 차량</a></p></div>';return}
const groupMap=new Map(c.groups.map(g=>[g.catalog_id,g])),calcRows=calc.rows.filter(r=>r.family_id===id),calcByCatalog=new Map();for(const r of calcRows){const v=calcByCatalog.get(r.catalog_id)||{tax:0,energy:0,full:0,total:0};v.total++;if(r.tax_ready)v.tax++;if(r.energy_cost_ready)v.energy++;if(r.full_cost_ready)v.full++;calcByCatalog.set(r.catalog_id,v)}
const statusLabel={reviewed_override:'검수 규칙',auto_high:'자동 고신뢰',auto_medium:'자동 중신뢰',raw_only:'원문 기준'},ptLabel={gasoline:'휘발유',diesel:'경유',lpg:'LPG',hybrid:'하이브리드',phev:'플러그인 하이브리드',electric:'전기',hydrogen:'수소',unknown:'유형 미분류'},probeLabel={live_verified:'공식 페이지 값 일치 확인',official_pdf_reachable:'공식 PDF 연결 확인',live_reachable_unverified:'공식 페이지 연결 확인 · 자동 대조 일부 미확인',source_fetch_failed:'마지막 검수값 사용 · 원문 재확인 대기',source_http_error:'마지막 검수값 사용 · 원문 응답 오류'};
document.title=`${f.family_name} 차량 데이터 | 내차데이터`;
const reviewed=f.reviewed_detail_paths?.[0],taxReady=calcRows.filter(r=>r.tax_ready).length,energyReady=calcRows.filter(r=>r.energy_cost_ready).length,fullReady=calcRows.filter(r=>r.full_cost_ready).length,spec=(specs.records||[]).find(r=>r.family_id===id);
let html=`<div class="family-head"><div class="db-kicker">${esc(f.maker)} · 전체 공식 신고 데이터</div><h1>${esc(f.family_name)}</h1><div class="family-meta"><span class="badge ${f.normalization_status==='reviewed_override'?'ok':''}">${esc(statusLabel[f.normalization_status]||f.normalization_status)}</span> · 정규화 신뢰도 ${Math.round((f.confidence||0)*100)}%${f.category?' · '+esc(f.category):''}</div><div class="family-actions"><a href="../">전체 차량</a><a class="tool" href="../../tools/annual-cost/?fa=${encodeURIComponent(id)}">1년 유지비 계산</a><a class="tool" href="../../compare/?fa=${encodeURIComponent(id)}">이 차종 비교</a><a href="../?view=raw&q=${encodeURIComponent(f.family_name)}">원문 그룹</a>${reviewed?`<a class="primary" href="../..${esc(reviewed)}">검수 완료 상세</a>`:''}</div></div>`;
html+=`<div class="family-stats"><div><span>공식 신고행</span><b>${fmt(f.active_record_count)}</b></div><div><span>원문 모델 그룹</span><b>${fmt(f.raw_group_count)}</b></div><div><span>세대 그룹</span><b>${fmt(f.generation_count)}</b></div><div><span>세금 계산 가능</span><b>${fmt(taxReady)}</b></div><div><span>에너지비 계산 가능</span><b>${fmt(energyReady)}</b></div></div>`;
html+=`<div class="calc-strip"><strong>세금+에너지비 모두 계산 가능한 공식 신고 사양 ${fmt(fullReady)}개</strong><span>조건이 부족한 사양은 0원으로 만들지 않고 계산 제외 사유를 표시합니다.</span></div>`;
const specValue=v=>v==null?'공식 데이터 확인되지 않음':`${typeof v==='number'?fmt(v):esc(v)} mm`,powerValue=p=>p.max_power||((p.motor_output_kw!=null||p.motor_output_ps!=null)?`${p.motor_output_kw??'—'} kW${p.motor_output_ps!=null?' / '+p.motor_output_ps+' PS':''}`:'공식 데이터 확인되지 않음'),torqueValue=p=>p.max_torque||(p.motor_torque_nm!=null?`${fmt(p.motor_torque_nm)} Nm`:'공식 데이터 확인되지 않음'),energySpec=p=>p.battery_kwh!=null?`${p.battery_kwh} kWh`:p.displacement_cc!=null?`${fmt(p.displacement_cc)} cc`:'—';
if(spec){const d=spec.dimensions||{},state=probeLabel[spec.live_probe?.state]||'공식 출처 연결 상태 확인 중';html+=`<section class="spec-panel"><div class="spec-head"><div><div class="db-kicker">제조사 공식 상세제원</div><h2>${esc(spec.model)} ${esc(spec.code||'')} 제원</h2></div><p>한국에너지공단 신고 원문과 분리된 보강 계층입니다. 제조사 공식 자료에서 확인된 값만 표시하며 확인되지 않은 값은 추정하지 않습니다.</p></div><div class="spec-grid"><div class="spec-item"><span>전장</span><b>${specValue(d.length_mm)}</b></div><div class="spec-item"><span>전폭</span><b>${specValue(d.width_mm)}</b></div><div class="spec-item"><span>전고</span><b>${specValue(d.height_mm)}</b></div><div class="spec-item"><span>축거</span><b>${specValue(d.wheelbase_mm)}</b></div></div><div class="spec-table"><div class="spec-row head"><div>파워트레인</div><div>배기량 / 배터리</div><div>최고출력</div><div>최대토크</div></div>${(spec.powertrains||[]).map(p=>`<div class="spec-row"><div>${esc(p.powertrain||'사양')}</div><div>${esc(energySpec(p))}</div><div>${esc(powerValue(p))}</div><div>${esc(torqueValue(p))}</div></div>`).join('')}</div><div class="spec-source">출처: <a href="${esc(spec.source?.url||'#')}" target="_blank" rel="noopener">${esc(spec.source?.name||'제조사 공식 제원')}</a> · 검토 ${esc(spec.source?.reviewed_on||'—')} <span class="source-health">${esc(state)}</span></div></section>`}else{html+=`<section class="spec-panel"><div class="spec-head"><div><div class="db-kicker">제조사 공식 상세제원</div><h2>공식 데이터 확인되지 않음</h2></div><p>현재 이 차종군은 제조사 공식 상세제원 자동 보강 대상에 아직 포함되지 않았습니다. 추정값이나 제3자 DB 값으로 채우지 않습니다.</p></div></section>`}
for(const gen of (f.generations||[]).filter(g=>g.active_record_count>0)){
  const groups=(gen.raw_group_ids||[]).map(id=>groupMap.get(id)).filter(Boolean).filter(g=>g.source_status==='active');
  html+=`<section class="generation"><div class="generation-head"><h2>${esc(gen.generation_label)}</h2><div class="generation-meta">${fmt(gen.active_record_count)}개 신고행 · ${fmt(gen.raw_group_count)}개 원문 그룹</div></div><div class="pt-list">${(gen.powertrains||[]).map(p=>`<span class="pt">${esc(ptLabel[p.powertrain]||p.powertrain)} ${fmt(p.count)}</span>`).join('')}</div><div class="raw-list">${groups.map(g=>{const gi=h.group_index[g.catalog_id]||{},ready=calcByCatalog.get(g.catalog_id)||{tax:0,energy:0,full:0,total:g.row_count};return `<div class="raw-row"><div><a class="raw-model" href="../record/?id=${encodeURIComponent(g.catalog_id)}">${esc(g.model)}</a><div class="raw-sub">${esc(g.maker)}${g.vehicle_classes?.length?' · '+esc(g.vehicle_classes.join(', ')):''} · 세금 ${fmt(ready.tax)} / 에너지비 ${fmt(ready.energy)} / 전체 ${fmt(ready.full)}</div></div><div>${esc((gi.powertrains||[]).map(x=>ptLabel[x]||x).join(' · ')||'—')}</div><div class="raw-num">${fmt(g.row_count)}행</div><div class="raw-actions"><a href="../record/?id=${encodeURIComponent(g.catalog_id)}">신고 데이터</a><a href="../../tools/annual-cost/?fa=${encodeURIComponent(id)}">계산</a></div></div>`}).join('')}</div></section>`;
}
html+=`<p class="note">세대가 ‘세대 미분류’로 표시된 경우 원문에 안정적으로 식별 가능한 세대 코드가 없거나 아직 검수 규칙이 없는 상태입니다. 해당 차량도 원문 신고행은 누락 없이 유지합니다.</p>`;app.innerHTML=html;
})();
</script></body></html>

<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive"><title>제네시스 자동차 연비·자동차세·유지비 | 내차데이터</title><meta name="description" content="제네시스 G80 RG3의 2.5T·3.5T, 2WD·AWD 사양별 연비와 자동차세, 연간 유류비 정보를 확인합니다."><link rel="canonical" href="https://5ggul.github.io/pm-lab/car-data-preview/cars/genesis/"><link rel="stylesheet" href="../../assets/site.css"><link rel="stylesheet" href="../../assets/home.css"></head><body><header class="db-header"><div class="db-shell"><a class="db-logo" href="../../">내차데이터</a><nav class="db-nav"><a href="../">차량</a><a href="../../compare/">비교</a><a href="../../recalls/">리콜</a></nav></div></header><main><section class="page-hero"><div class="db-shell"><div class="db-kicker">제조사</div><h1>제네시스</h1><p>G80 RG3의 2.5T·3.5T, 2WD·AWD 사양별 데이터를 제공합니다.</p></div></section><section class="db-section"><div class="db-shell"><div id="catalog" class="catalog-grid"></div></div></section></main><footer class="db-footer"><div class="db-shell"><div>제네시스의 공식 사양이 확인된 차량을 제공합니다.</div><div class="db-footer-links"><a href="../">전체 차량</a><a href="../../data-sources/">출처</a></div></div></footer><script src="../../assets/catalog-data.js"></script><script>document.getElementById('catalog').innerHTML=CAR_CATALOG.cars.filter(c=>c.maker==='제네시스').map(c=>`<a class="car-card" href="${c.path.replace('./cars/genesis/','./')}"><div class="car-card-media"><img src="${c.image}" alt="${c.model}"><small>${c.credit}</small></div><div class="car-card-body"><div class="car-meta">${c.segment} · ${c.yearLabel}</div><h3>${c.model}</h3><div class="car-spec">${c.rep.label}</div><div class="car-numbers"><div class="car-number-row"><span>복합연비</span><strong>${c.rep.combined} km/L</strong></div><div class="car-number-row"><span>자동차세</span><strong>${Number(c.rep.tax).toLocaleString('ko-KR')}원</strong></div></div><div class="car-arrow">상세 보기 →</div></div></a>`).join('')</script></b

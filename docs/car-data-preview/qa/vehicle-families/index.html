<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">

  <title>차량군 데이터 QA | 자동차 데이터 프리뷰</title>
  <meta name="description" content="현대·기아·제네시스 차량군과 KEA 현행 세대 후보 매칭 상태를 검수하는 내부 프리뷰 화면입니다.">

<script src="../../assets/static-photo-fallback.js"></script><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%2317232d'/%3E%3Cpath d='M13 39h38l-5-14H18zM18 39v7m28-7v7' fill='none' stroke='white' stroke-width='5' stroke-linecap='round'/%3E%3C/svg%3E"><meta property="og:title" content="차량군 데이터 QA | 자동차 데이터 프리뷰"><meta property="og:description" content="현대·기아·제네시스 차량군과 KEA 현행 세대 후보 매칭 상태를 검수하는 내부 프리뷰 화면입니다."><meta property="og:type" content="website"><script src="../../assets/static-photo-fallback.js"></script><script src="../../assets/static-photo-fallback.js"></script><script defer src="../../assets/reference-ui.js?v=c3c0741eb5"></script><meta name="robots" content="noindex,nofollow,noarchive"><link rel="canonical" href="https://5ggul.github.io/pm-lab/car-data-preview/qa/vehicle-families/"><link rel="stylesheet" href="../../assets/tokens.css"><link rel="stylesheet" href="../../assets/base.css"></head>
<body data-reference-page="information" class="">
<main class="wrap">
  <header class="db-header"><div class="db-shell"><a class="db-logo" href="../../">내차데이터</a><nav class="db-nav" aria-label="주 메뉴"><a href="../../cars/">찾기</a><a href="../../compare/">비교</a><a href="../../rankings/">순위</a><a href="../../recalls/">리콜</a></nav><a class="site-header-search" href="../../cars/">검색</a></div></header>

  <div class="notice"><strong>내부 검수용 · noindex</strong> — 현행 세대 후보는 자동 공개 대상이 아닙니다. 제조사 공식 제원과 세대 코드를 최종 대조한 뒤에만 차량 JSON·페이지로 승격합니다.</div>

  <section class="stats" id="stats" aria-label="차량군 요약"></section>

  <section class="filters" aria-label="필터">
    <input id="q" type="search" placeholder="차량명·세대 코드 검색 (예: GN7, SP3, GV80)">
    <select id="maker"><option value="">전체 제조사</option><option>현대</option><option>기아</option><option>제네시스</option></select>
    <select id="state"><option value="">전체 상태</option><option value="current">현행 후보 있음</option><option value="page">기존 검수 페이지 있음</option><option value="pending">현행 후보 보류</option></select>
  </section>

  <div class="table-wrap">
    <table>
      <thead><tr><th>제조사 / 차량</th><th>현행 세대 후보</th><th class="num">차량군 행</th><th class="num">현행 행</th><th class="num">현행+에너지 조인</th><th>상태</th><th>현행 후보 원문</th></tr></thead>
      <tbody id="rows"><tr><td colspan="7" class="empty">데이터 불러오는 중…</td></tr></tbody>
    </table>
  </div>
  <p class="foot" id="foot"></p>
</main>
<script>
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $=s=>document.querySelector(s);
let data=null;
function stat(value,label){return `<div class="stat"><b>${esc(value)}</b><span>${esc(label)}</span></div>`}
function statusCell(f){
  if(f.page_ready) return '<span class="status reviewed">검수 JSON 있음</span>';
  if(f.current_generation_candidate_ready) return '<span class="status ok">현행 후보 있음</span>';
  return '<span class="status hold">현행 후보 보류</span>';
}
function modelDetails(f){
  const list=f.current_generation_candidate_models||[];
  if(!list.length)return '<span class="muted">—</span>';
  return `<div class="models"><details><summary>${list.length}개 원문 보기</summary><ul>${list.map(v=>`<li>${esc(v)}</li>`).join('')}</ul></details></div>`;
}
function render(){
  if(!data)return;
  const q=$('#q').value.trim().toLowerCase(), maker=$('#maker').value, state=$('#state').value;
  const all=data.families||[];
  const filtered=all.filter(f=>{
    if(maker&&f.maker!==maker)return false;
    if(state==='current'&&!f.current_generation_candidate_ready)return false;
    if(state==='page'&&!f.page_ready)return false;
    if(state==='pending'&&f.current_generation_candidate_ready)return false;
    const hay=[f.display_name,f.family_id,f.current_generation_rule_label,...(f.current_generation_candidate_models||[])].join(' ').toLowerCase();
    return !q||hay.includes(q);
  });
  $('#rows').innerHTML=filtered.length?filtered.map(f=>`<tr>
    <td><span class="name">${esc(f.display_name)}</span><span class="sub">${esc(f.maker)} · ${esc(f.category)} · ${esc(f.family_id)}</span></td>
    <td>${f.current_generation_rule_label?`<strong>${esc(f.current_generation_rule_label)}</strong>`:'<span class="muted">규칙 미확정</span>'}</td>
    <td class="num">${esc(f.unique_assigned_rows)}</td>
    <td class="num">${esc(f.current_generation_candidate_rows)}</td>
    <td class="num">${esc(f.current_generation_candidate_enriched_rows)}</td>
    <td>${statusCell(f)}</td>
    <td>${modelDetails(f)}</td>
  </tr>`).join(''):'<tr><td colspan="7" class="empty">조건에 맞는 차량군이 없습니다.</td></tr>';
  $('#foot').textContent=`${filtered.length} / ${all.length}개 차량군 표시 · 생성 ${new Date(data.generated_at).toLocaleString('ko-KR')}`;
}
fetch('../../data/generated/vehicle-family-coverage.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('HTTP '+r.status);return r.json()}).then(j=>{
  data=j;
  $('#stats').innerHTML=[
    stat(j.target_family_count,'목표 차량군'),
    stat(j.family_registry_ready_count,'차량군 매칭 완료'),
    stat(j.current_generation_candidate_family_count,'현행 세대 후보'),
    stat(j.current_generation_energy_enriched_family_count,'현행+에너지 조인'),
    stat(j.reviewed_generation_ready_count,'기존 검수 JSON'),
    stat(j.conflicted_source_rows,'교차 충돌 행')
  ].join('');
  render();
}).catch(e=>{$('#rows').innerHTML=`<tr><td colspan="7" class="empty">데이터 로드 실패: ${esc(e.message)}</td></tr>`});
['q','maker','state'].forEach(id=>$('#'+id).addEventListener(id==='q'?'input':'change',render));
</script>
<footer class="db-footer"><div class="db-shell"><div><strong>내차데이터</strong><p>차 사기 전에, 연비와 세금을 같은 조건으로 본다</p></div><nav aria-label="사이트 안내"><a href="../../methodology/">자료 기준</a><a href="../../data-sources/">출처</a><a href="../../about/">소개</a><a href="../../privacy/">개인정보</a><a href="../../terms/">이용안내</a><a href="../../contact/">연락처</a></nav></div></footer></body>
</html>

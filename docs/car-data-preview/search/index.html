<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive"><title>전체 차량 검색 | 내차데이터</title><meta name="description" content="한국에너지공단 전체 자동차 데이터를 정규화된 차종·세대와 공식 원문 신고 모델에서 함께 검색합니다."><link rel="stylesheet" href="../assets/site.css"><link rel="stylesheet" href="../assets/home.css"><style>
.search-section{margin-bottom:34px}.search-section h2{font-size:21px;margin:0;padding:0 0 10px;border-bottom:2px solid #111}.search-note{font-size:12px;color:#777;margin:8px 0 10px}.search-list{border-top:0}.search-row{display:grid;grid-template-columns:minmax(240px,1.8fr) minmax(150px,.8fr) 100px 155px;gap:14px;padding:15px 4px;border-bottom:1px solid #e5e5e5;align-items:center}.search-row a{font-weight:700;color:#111;text-decoration:none}.search-row a:hover{text-decoration:underline}.search-sub{font-size:12px;color:#777;margin-top:3px}.search-type,.search-count,.search-state{font-size:12px;color:#555}.search-count{text-align:right;font-variant-numeric:tabular-nums}.search-state{text-align:right}.search-state a{font-weight:500;color:#174ea6}.search-badge{display:inline-block;border:1px solid #bbb;padding:2px 6px;font-size:11px}.search-badge.reviewed{border-color:#7293ca;color:#174ea6}.search-more{margin-top:14px;font-size:13px}.search-more a{color:#174ea6}.empty{border-top:2px solid #111;padding-top:24px}.summary-line{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:16px;font-size:13px;color:#666}

</style></head><body><header class="db-header"><div class="db-shell"><a class="db-logo" href="../">내차데이터</a><nav class="db-nav"><a href="../cars/">차량</a><a href="../compare/">비교</a><a href="../tools/annual-cost/">1년 유지비</a><a href="../recalls/">리콜</a><a href="../data-sources/">출처</a></nav></div></header><main><section class="page-hero"><div class="db-shell"><div class="db-kicker">전체 차량 검색</div><h1 id="searchTitle">차량 검색</h1><p>정리된 차종·세대를 먼저 보여주고, 아래에서 한국에너지공단 원문 신고 모델까지 확인할 수 있습니다.</p><form class="db-search" action="./" method="get" style="max-width:760px"><input id="searchInput" name="q" aria-label="차량 검색" placeholder="쏘렌토, BMW, GV80, 하이브리드" required><button type="submit">검색</button></form></div></section><section class="db-section"><div class="db-shell"><div id="results"><p>데이터를 불러오는 중…</p></div></div></section></main><footer class="db-footer"><div class="db-shell"><div>전체 원문 신고행은 항상 보존합니다. 자동 정규화 결과는 탐색용이며, SEO 상세·세금·비교는 검수 수준에 따라 단계적으로 제공합니다.</div><div class="db-footer-links"><a href="../cars/">전체 차량 데이터베이스</a><a href="../data-sources/">출처</a></div></div></footer><script>
(async function(){
const p=new URLSearchParams(location.search),raw=(p.get('q')||'').trim(),q=raw.toLowerCase().replace(/[\s_.\-/]+/g,''),title=document.getElementById('searchTitle'),input=document.getElementById('searchInput'),r=document.getElementById('results'),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),norm=s=>String(s??'').toLowerCase().replace(/[\s_.\-/]+/g,''),fmt=n=>Number(n||0).toLocaleString('ko-KR');
const statusLabel={reviewed_override:'검수 규칙',auto_high:'자동 고신뢰',auto_medium:'자동 중신뢰',raw_only:'원문 기준'},ptLabel={gasoline:'휘발유',diesel:'경유',lpg:'LPG',hybrid:'하이브리드',phev:'플러그인 하이브리드',electric:'전기',hydrogen:'수소',unknown:'미분류'};
input.value=raw;if(!raw){r.innerHTML='<div class="empty"><p>차량명·제조사·세대·연료 유형을 입력하세요.</p><p><a href="../cars/">전체 차량 데이터베이스 보기</a></p></div>';return}
let h,c;try{const [hr,cr]=await Promise.all([fetch('../data/generated/service-hierarchy.json',{cache:'no-store'}),fetch('../data/generated/all-car-catalog.json',{cache:'no-store'})]);if(!hr.ok||!cr.ok)throw new Error();[h,c]=await Promise.all([hr.json(),cr.json()])}catch{r.innerHTML='<div class="empty"><p>전체 차량 데이터베이스를 불러오지 못했습니다.</p></div>';return}
title.textContent='“'+raw+'” 검색 결과';
const familyHits=h.families.filter(f=>f.active_record_count>0&&[f.maker,f.family_name,...(f.raw_models||[]),...(f.generations||[]).flatMap(g=>[g.generation_label,...(g.raw_models||[])]),...(f.powertrains||[]).map(x=>ptLabel[x.powertrain]||x.powertrain)].some(x=>norm(x).includes(q))).sort((a,b)=>{const ax=norm(a.family_name),bx=norm(b.family_name),ae=ax===q?0:ax.startsWith(q)?1:2,be=bx===q?0:bx.startsWith(q)?1:2;return ae-be+(b.confidence||0)-(a.confidence||0)||b.active_record_count-a.active_record_count}).slice(0,50);
const rawHits=c.groups.filter(g=>g.source_status==='active'&&[g.model,g.maker,...g.types,...g.vehicle_classes].some(x=>norm(x).includes(q))).sort((a,b)=>{const ax=norm(a.model),bx=norm(b.model),ae=ax===q?0:ax.startsWith(q)?1:2,be=bx===q?0:bx.startsWith(q)?1:2;return ae-be||b.row_count-a.row_count}).slice(0,50);
if(!familyHits.length&&!rawHits.length){r.innerHTML='<div class="empty"><h2 style="font-size:26px;margin:0 0 10px">검색 결과가 없습니다.</h2><p class="section-copy">현재 공식 소스에서 일치하는 차량을 찾지 못했습니다.</p><p><a href="../cars/">전체 차량 데이터베이스 보기</a></p></div>';return}
let html=`<div class="summary-line"><span>정규화 차종군 ${fmt(familyHits.length)}건 표시</span><span>공식 원문 모델 ${fmt(rawHits.length)}건 표시</span></div>`;
if(familyHits.length)html+=`<section class="search-section"><h2>차종·세대 검색 결과</h2><p class="search-note">같은 차의 연식·사양 원문을 차종군으로 묶은 탐색 결과입니다.</p><div class="search-list">${familyHits.map(f=>`<div class="search-row"><div><a href="../cars/family/?id=${encodeURIComponent(f.family_id)}">${esc(f.family_name)}</a><div class="search-sub">${esc(f.maker)} · ${fmt(f.generation_count)}세대 그룹 · 원문 ${fmt(f.raw_group_count)}모델</div></div><div class="search-type">${(f.powertrains||[]).slice(0,3).map(x=>esc(ptLabel[x.powertrain]||x.powertrain)).join(' · ')||'—'}</div><div class="search-count">${fmt(f.active_record_count)}행</div><div class="search-state"><span class="search-badge ${f.normalization_status==='reviewed_override'?'reviewed':''}">${esc(statusLabel[f.normalization_status]||f.normalization_status)}</span></div></div>`).join('')}</div>${familyHits.length===50?`<div class="search-more">차종군 상위 50건만 표시했습니다. <a href="../cars/?q=${encodeURIComponent(raw)}">전체 차종군 결과 보기</a></div>`:''}</section>`;
if(rawHits.length)html+=`<section class="search-section"><h2>공식 원문 신고 모델</h2><p class="search-note">한국에너지공단에서 제공한 원문 모델명을 그대로 확인합니다.</p><div class="search-list">${rawHits.map(g=>`<div class="search-row"><div><a href="../cars/record/?id=${encodeURIComponent(g.catalog_id)}">${esc(g.model)}</a><div class="search-sub">${esc(g.maker)}${g.vehicle_classes.length?' · '+esc(g.vehicle_classes.join(', ')):''}</div></div><div class="search-type">${g.types.length?esc(g.types.slice(0,2).join(' · ')):'—'}</div><div class="search-count">${fmt(g.row_count)}행</div><div class="search-state">${g.reviewed_detail_path?`<a href="..${esc(g.reviewed_detail_path)}">검수 상세</a>`:'공식 신고 데이터'}</div></div>`).join('')}</div>${rawHits.length===50?`<div class="search-more">원문 상위 50건만 표시했습니다. <a href="../cars/?view=raw&q=${encodeURIComponent(raw)}">전체 원문 결과 보기</a></div>`:''}</section>`;
r.innerHTML=html;
})();
</script></body></html>

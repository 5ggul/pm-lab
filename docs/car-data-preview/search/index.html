<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive"><title>전체 차량 검색 | 내차데이터</title><meta name="description" content="한국에너지공단 자동차 표시연비 데이터 전체에서 차량명과 제조사를 검색합니다."><link rel="stylesheet" href="../assets/site.css"><link rel="stylesheet" href="../assets/home.css"><style>.search-list{border-top:2px solid #111}.search-row{display:grid;grid-template-columns:minmax(240px,1.8fr) minmax(140px,.7fr) 90px 150px;gap:14px;padding:15px 4px;border-bottom:1px solid #e5e5e5;align-items:center}.search-row a{font-weight:700;color:#111;text-decoration:none}.search-row a:hover{text-decoration:underline}.search-sub{font-size:12px;color:#777;margin-top:3px}.search-type,.search-count,.search-state{font-size:12px;color:#555}.search-count{text-align:right;font-variant-numeric:tabular-nums}.search-state{text-align:right}.search-more{margin-top:18px;font-size:13px}.search-more a{color:#174ea6}@media(max-width:700px){.search-row{grid-template-columns:1fr 80px}.search-type{grid-column:1/2}.search-state{display:none}}</style></head><body><header class="db-header"><div class="db-shell"><a class="db-logo" href="../">내차데이터</a><nav class="db-nav"><a href="../cars/">차량</a><a href="../compare/">비교</a><a href="../tools/annual-cost/">1년 유지비</a><a href="../recalls/">리콜</a><a href="../data-sources/">출처</a></nav></div></header><main><section class="page-hero"><div class="db-shell"><div class="db-kicker">전체 차량 검색</div><h1 id="searchTitle">차량 검색</h1><p>검수 완료 차량만이 아니라 현재 공식 API가 제공하는 전체 차량·신고 모델을 검색합니다.</p><form class="db-search" action="./" method="get" style="max-width:760px"><input id="searchInput" name="q" aria-label="차량 검색" placeholder="쏘렌토, BMW, GV80, 하이브리드" required><button type="submit">검색</button></form></div></section><section class="db-section"><div class="db-shell"><div id="results"><p>데이터를 불러오는 중…</p></div></div></section></main><footer class="db-footer"><div class="db-shell"><div>전체 원문 데이터는 검색 가능하며, 세금·에너지비·비교는 품질 검수된 사양부터 제공합니다.</div><div class="db-footer-links"><a href="../cars/">전체 차량 데이터베이스</a><a href="../data-sources/">출처</a></div></div></footer><script>(async function(){const p=new URLSearchParams(location.search),raw=(p.get('q')||'').trim(),q=raw.toLowerCase().replace(/[\s_-]+/g,''),title=document.getElementById('searchTitle'),input=document.getElementById('searchInput'),r=document.getElementById('results'),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),norm=s=>String(s??'').toLowerCase().replace(/[\s_-]+/g,'');input.value=raw;if(!raw){r.innerHTML='<div style="border-top:2px solid #111;padding-top:24px"><p>차량명·제조사·유형을 입력하세요.</p><p><a href="../cars/">전체 차량 데이터베이스 보기</a></p></div>';return}let data;try{const res=await fetch('../data/generated/all-car-catalog.json',{cache:'no-store'});if(!res.ok)throw new Error();data=await res.json()}catch{r.innerHTML='<div style="border-top:2px solid #111;padding-top:24px"><p>전체 차량 데이터베이스를 불러오지 못했습니다.</p></div>';return}title.textContent='“'+raw+'” 검색 결과';const list=data.groups.filter(g=>g.source_status==='active'&&[g.model,g.maker,...g.types,...g.vehicle_classes].some(x=>norm(x).includes(q))).slice(0,100);if(!list.length){r.innerHTML='<div style="border-top:2px solid #111;padding-top:24px"><h2 style="font-size:26px;margin:0 0 10px">검색 결과가 없습니다.</h2><p class="section-copy">현재 공식 소스에서 일치하는 차량을 찾지 못했습니다.</p><p><a href="../cars/">전체 차량 데이터베이스 보기</a></p></div>';return}r.innerHTML=`<div class="search-list">${list.map(g=>`<div class="search-row"><div><a href="../cars/record/?id=${encodeURIComponent(g.catalog_id)}">${esc(g.model)}</a><div class="search-sub">${esc(g.maker)}${g.vehicle_classes.length?' · '+esc(g.vehicle_classes.join(', ')):''}</div></div><div class="search-type">${g.types.length?esc(g.types.slice(0,2).join(' · ')):'—'}</div><div class="search-count">${g.row_count}행</div><div class="search-state">${g.reviewed_detail_path?`<a href="..${esc(g.reviewed_detail_path)}">검수 상세</a>`:'공식 신고 데이터'}</div></div>`).join('')}</div>${list.length===100?`<div class="search-more">상위 100건만 표시했습니다. <a href="../cars/?q=${encodeURIComponent(raw)}">전체 결과 보기</a></div>`:''}`})();</script></body></html>

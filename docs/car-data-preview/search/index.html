id="searchInput" name="q" aria-label="차량 검색" placeholder="쏘렌토, BMW, GV80, 하이브리드" required><button type="submit">검색</button></form></div></section><section class="db-section"><div class="db-shell"><div id="results"><p>차량명과 복합 효율은 아래 목록에서도 확인할 수 있습니다.</p></div></div></section></main><footer class="db-footer"><div class="db-shell"><div><strong>내차데이터</strong><p>차 사기 전에, 연비와 세금을 같은 조건으로 본다</p></div><nav aria-label="사이트 안내"><a href="../tools/">계산 도구</a><a href="../guide/">가이드</a><a href="../methodology/">계산 기준</a><a href="../data-sources/">출처</a><a href="../about/">소개</a><a href="../terms/">이용안내</a><a href="../privacy/">개인정보</a><a href="../contact/">오류 신고</a><a href="../media-policy/">사진 출처</a></nav></div></footer><script>
(async function(){
const p=new URLSearchParams(location.search),raw=(p.get('q')||'').trim(),q=raw.toLowerCase().replace(/[\s_.\-/]+/g,''),title=document.getElementById('searchTitle'),input=document.getElementById('searchInput'),r=document.getElementById('results'),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),norm=s=>String(s??'').toLowerCase().replace(/[\s_.\-/]+/g,''),fmt=n=>Number(n||0).toLocaleString('ko-KR');
const statusLabel={confirmed_mapping:'',auto_high:'',auto_medium:'',source_only:''},ptLabel={gasoline:'휘발유',diesel:'경유',lpg:'LPG',hybrid:'하이브리드',phev:'플러그인 하이브리드',electric:'전기',hydrogen:'수소',unknown:'확인 중'};
input.value=raw;if(!raw){r.innerHTML='<div class="empty"><p>차량명·제조사·세대·연료 유형을 입력하세요.</p><p><a href="../cars/">전체 차량 보기</a></p></div>';return}
let h,c;try{const [hr,cr]=await Promise.all([fetch('../data/generated/service-hierarchy.json',{cache:'no-store'}),fetch('../data/generated/all-car-catalog.json',{cache:'no-store'})]);if(!hr.ok||!cr.ok)throw new Error();[h,c]=await Promise.all([hr.json(),cr.json()])}catch{r.innerHTML='<div class="empty"><p>전체 차량을 불러오지 못했습니다.</p></div>';return}
title.textContent='“'+raw+'” 검색 결과';
const familyHits=h.families.filter(f=>f.active_record_count>0&&[f.maker,f.family_name,...(f.raw_models||[]),...(f.generations||[]).flatMap(g=>[g.generation_label,...(g.raw_models||[])]),...(f.powertrains||[]).map(x=>ptLabel[x.powertrain]||x.powertrain)].some(x=>norm(x).includes(q))).sort((a,b)=>{const ax=norm(a.family_name),bx=norm(b.family_name),ae=ax===q?0:ax.startsWith(q)?1:2,be=bx===q?0:bx.startsWith(q)?1:2;return ae-be+(b.confidence||0)-(a.confidence||0)||b.active_record_count-a.active_record_count}).slice(0,50);
const rawHits=c.groups.filter(g=>g.source_status==='active'&&[g.model,g.maker,...g.types,...g.vehicle_classes].some(x=>norm(x).includes(q))).sort((a,b)=>{const ax=norm(a.model),bx=norm(b.model),ae=ax===q?0:ax.startsWith(q)?1:2,be=bx===q?0:bx.startsWith(q)?1:2;return ae-be||b.row_count-a.row_count}).slice(0,50);
if(!familyHits.length&&!rawHits.length){r.innerHTML='<div class="empty"><h2 style="font-size:26px;margin:0 0 10px">검색 결과가 없습니다.</h2><p class="section-copy">현재 공식 소스에서 일치하는 차량을 찾지 못했습니다.</p><p><a href="../cars/">전체 차량 보기</a></p></div>';return}
let html=`<div class="summary-line"><span>정규화 차종 ${fmt(familyHits.length)}건 표시</span><span>공식 상세 사양 ${fmt(rawHits.length)}건 표시</span></div>`;
if(familyHits.length)html+=`<section class="search-section"><h2>차종·세대 검색 결과</h2><p class="search-note">같은 차의 연식·사양 원문을 차종으로 묶은 탐색 결과입니다.</p><div class="search-list">${familyHits.map(f=>`<div class="search-row"><div><a href="../cars/family/?id=${encodeURIComponent(f.family_id)}">${esc(f.family_name)}</a><div class="search-sub">${esc(f.maker)} · ${fmt(f.generation_count)}세대 그룹 · 원문 ${fmt(f.raw_group_count)}모델</div></div><div class="search-type">${(f.powertrains||[]).slice(0,3).map(x=>esc(ptLabel[x.powertrain]||x.powertrain)).join(' · ')||'—'}</div><div class="search-count">${fmt(f.active_record_count)}행</div><div class="search-state"><span class="search-badge ${f.normalization_status==='confirmed_mapping'?'reviewed':''}">${esc(statusLabel[f.normalization_status]||f.normalization_status)}</span></div></div>`).join('')}</div>${familyHits.length===50?`<div class="search-more">차종 상위 50건만 표시했습니다. <a href="../cars/?q=${encodeURIComponent(raw)}">전체 차종 결과 보기</a></div>`:''}</section>`;
if(rawHits.length)html+=`<section class="search-section"><h2>공식 데이터 신고 모델</h2><p class="search-note">한국에너지공단에서 제공한 상세 사양명을 그대로 확인합니다.</p><div class="search-list">${rawHits.map(g=>`<div class="search-row"><div><a href="../cars/record/?id=${encodeURIComponent(g.catalog_id)}">${esc(g.model)}</a><div class="search-sub">${esc(g.maker)}${g.vehicle_classes.length?' · '+esc(g.vehicle_classes.join(', ')):''}</div></div><div class="search-type">${g.types.length?esc(g.types.slice(0,2).join(' · ')):'—'}</div><div class="search-count">${fmt(g.row_count)}행</div><div class="search-state">${g.reviewed_detail_path?`<a href="..${esc(g.reviewed_detail_path)}">상세제원</a>`:'한국에너지공단 표시연비'}</div></div>`).join('')}</div>${rawHits.length===50?`<div class="search-more">원문 상위 50건만 표시했습니다. <a href="../cars/?view=raw&q=${encodeURIComponent(raw)}">전체 원문 결과 보기</a></div>`:''}</section>`;
r.innerHTML=html;
})();
</script><script src="../assets/header-nav.js"></script></body></html>

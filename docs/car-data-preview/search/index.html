<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive"><title>차량 검색 | 내차데이터</title><link rel="stylesheet" href="../assets/site.css"><link rel="stylesheet" href="../assets/home.css"></head><body><header class="db-header"><div class="db-shell"><a class="db-logo" href="../">내차데이터</a><nav class="db-nav"><a href="../cars/">차량</a><a href="../compare/">비교</a><a href="../tools/annual-cost/">1년 유지비</a><a href="../recalls/">리콜</a><a href="../data-sources/">출처</a></nav></div></header><main><section class="page-hero"><div class="db-shell"><div class="db-kicker">차량 검색</div><h1 id="searchTitle">차량 검색</h1><p>차명·세대 코드·영문명으로 검수 완료 차량을 찾습니다.</p><form class="db-search" action="./" method="get" style="max-width:720px"><input id="searchInput" name="q" list="verifiedCars" aria-label="차량 검색" placeholder="그랜저 GN7, 쏘렌토 MQ4, K8, EV6" required><datalist id="verifiedCars"></datalist><button type="submit">검색</button></form></div></section><section class="db-section"><div class="db-shell"><div id="results" class="catalog-grid"></div></div></section></main><footer class="db-footer"><div class="db-shell"><div>검수 완료 차량만 일반 검색 결과에 표시합니다.</div><div class="db-footer-links"><a href="../cars/">차량 전체보기</a><a href="../about/">소개</a><a href="../privacy/">개인정보</a></div></div></footer><script src="../assets/catalog-data.js"></script><script src="../assets/car-utils.js"></script><script>(function(){const C=window.CAR_CATALOG,U=window.CAR_UTILS,cars=C.publicCars||C.cars.filter(c=>c.indexable===true),p=new URLSearchParams(location.search),raw=(p.get('q')||'').trim(),q=raw.toLowerCase().replace(/[\s_-]+/g,''),title=document.getElementById('searchTitle'),input=document.getElementById('searchInput'),r=document.getElementById('results');document.getElementById('verifiedCars').innerHTML=cars.map(c=>`<option value="${c.model}">`).join('');input.value=raw;const norm=s=>String(s).toLowerCase().replace(/[\s_-]+/g,'');let list=cars;if(raw){title.textContent='“'+raw+'” 검색 결과';list=cars.filter(c=>[c.model,c.maker,c.generation,c.code,...c.aliases].some(x=>norm(x).includes(q)||q.includes(norm(x))))}else title.textContent='차량 검색';if(!list.length){r.style.display='block';r.innerHTML='<div style="border-top:2px solid #111;padding-top:24px"><h2 style="font-size:28px;margin:0 0 10px">검색 결과가 없습니다.</h2><p class="section-copy">현재 검수 완료 데이터가 없는 모델입니다. 차량 전체보기에서 제공 중인 차량을 확인하세요.</p><div class="internal-cta"><a href="../cars/">차량 전체보기</a></div></div>';return}r.innerHTML=list.map(c=>{const unit=c.energy==='ev'?'km/kWh':'km/L',third=c.energy==='ev'?`<div class="car-number-row"><span>1회 충전거리</span><strong>${c.rep.range} km</strong></div>`:`<div class="car-number-row"><span>20,000km 에너지비</span><strong>${Number(c.rep.annualEnergy).toLocaleString('ko-KR')}원</strong></div>`;return `<a class="car-card" href="${c.path.replace('./','../')}"><div class="car-card-media"><img loading="lazy" src="${c.image}" alt="${c.model}" width="900" height="600"></div>${U.imageCreditHtml(c.imageMeta)}<div class="car-card-body"><div class="car-meta">${c.maker} · ${c.segment}</div><h3>${c.model}</h3><div class="car-spec">${c.rep.label}</div><div class="car-numbers"><div class="car-number-row"><span>${c.energy==='ev'?'복합전비':'복합연비'}</span><strong>${c.rep.combined} ${unit}</strong></div><div class="car-number-row"><span>연간 정상 자동차세</span><strong>${Number(c.rep.tax).toLocaleString('ko-KR')}원</strong></div>${third}</div><div class="car-arrow">상세 보기 →</div></div></a>`}).join('')})();</script></body></html>

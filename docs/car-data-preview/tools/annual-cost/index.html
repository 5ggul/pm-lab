<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive"><title>자동차 1년 유지비 계산기 | 자동차세·유류비·충전비 | 내차데이터</title><meta name="description" content="차량과 공식 사양, 차령기산 참고월, 연간 주행거리, 유가·충전단가를 선택해 연간 정상 자동차세와 에너지비를 계산합니다."><link rel="canonical" href="https://5ggul.github.io/pm-lab/car-data-preview/tools/annual-cost/"><link rel="stylesheet" href="../../assets/site.css"><link rel="stylesheet" href="../../assets/home.css"><script type="application/ld+json">{"@context":"https://schema.org","@type":"WebApplication","name":"자동차 1년 유지비 계산기","applicationCategory":"UtilitiesApplication","operatingSystem":"Any","isAccessibleForFree":true}</script></head><body><header class="db-header"><div class="db-shell"><a class="db-logo" href="../../">내차데이터</a><nav class="db-nav"><a href="../../cars/">차량</a><a href="../../compare/">비교</a><a href="./">1년 유지비</a><a href="../../recalls/">리콜</a><a href="../../methodology/">계산 기준</a></nav></div></header><main><section class="page-hero"><div class="db-shell"><div class="db-kicker">자동차세 + 에너지비</div><h1>1년 유지비 계산</h1><p>보험·정비·감가·취득세를 섞지 않고 연간 정상 자동차세와 유류비·충전비만 같은 기준으로 계산합니다.</p></div></section><section class="db-section"><div class="db-shell tool-grid"><div class="tool-panel"><h2 style="margin-top:0">계산 조건</h2><div class="tool-fields"><label>차량<select id="car"></select></label><label>사양<select id="variant"></select></label><label id="regLabel">차령기산 참고월<input id="reg" type="month"></label><p class="notice" id="regNote"></p><label>연간 주행거리<input id="km" type="number" min="1000" max="100000" step="1000" value="20000" list="kmPresets"><datalist id="kmPresets"><option value="5000"><option value="10000"><option value="15000"><option value="20000"><option value="30000"></datalist></label><label id="priceLabel"><span id="priceLabelText">연료가격</span><input id="price" type="number" step="0.01"></label></div><p class="notice" id="taxYearNote"></p><p class="notice" id="assumption"></p></div><div class="tool-panel"><div class="db-kicker">연간 정상세액 + 에너지비</div><div class="tool-result" id="total">-</div><div class="rows"><div class="row"><span>자동차세 본세</span><strong id="autoTax">-</strong></div><div class="row"><span>지방교육세 30%</span><strong id="eduTax">-</strong></div><div class="row"><span>차령 경감</span><strong id="discount">-</strong></div><div class="row"><span>연간 정상 자동차세</span><strong id="tax">-</strong></div><div class="row"><span>연간 에너지비</span><strong id="energy">-</strong></div></div><p class="notice">취득세, 연납 할인, 지자체 조례 감면, 연중 신규등록·말소에 따른 일할계산, 보험·정비·구매가격은 포함하지 않습니다.</p><div class="internal-cta"><a id="detailLink" href="../../cars/">선택 차량 상세</a><a class="light" href="../../methodology/">계산식 보기</a></div></div></div></section></main><footer class="db-footer"><div class="db-shell"><div id="fuelPriceFoot"></div><div class="db-footer-links"><a href="../../data-sources/">출처</a><a href="../../contact/">오류 신고</a></div></div></footer><script src="../../assets/catalog-data.js"></script><script src="../../assets/car-utils.js"></script><script>(function(){const C=CAR_CATALOG,U=CAR_UTILS,$=s=>document.querySelector(s),fmt=n=>Math.round(n).toLocaleString('ko-KR')+'원',cars=C.publicCars||C.cars.filter(c=>c.indexable===true),taxYear=Number(C.taxYear);const car=$('#car'),variant=$('#variant'),reg=$('#reg'),regLabel=$('#regLabel'),regNote=$('#regNote'),kmEl=$('#km'),price=$('#price'),priceLabelText=$('#priceLabelText'),assumption=$('#assumption'),autoTax=$('#autoTax'),eduTax=$('#eduTax'),discount=$('#discount'),tax=$('#tax'),energy=$('#energy'),totalEl=$('#total'),detailLink=$('#detailLink');reg.value=`${taxYear}-01`;reg.max=`${taxYear}-12`;$('#taxYearNote').textContent=`${taxYear}년 세율 기준 · 지방세법 제127조 기준 추정. 실제 고지액은 위택스·지자체 안내가 우선합니다.`;function annualTax(v,regValue){if(U.fuelKey(v)==='electric')return{auto:100000,edu:30000,total:130000,discount:0};const [ry,rm]=regValue.split('-').map(Number),base=v.cc*(v.cc<=1000?80:v.cc<=1600?140:200),half=age=>{if(age<3)return base/2;const n=Math.min(12,Math.max(2,age));return base/2-(base/2*.05*(n-2))};let a1,a2;if(rm<=6){a1=a2=taxYear-ry+1}else{a1=taxYear-ry;a2=taxYear-ry+1}a1=Math.max(0,a1);a2=Math.max(0,a2);const auto=half(a1)+half(a2),edu=auto*.3;return{auto,edu,total:auto+edu,discount:base?1-auto/base:0}}function fillCars(){car.innerHTML=cars.map(c=>`<option value="${c.id}">${c.maker} ${c.model}</option>`).join('');const qp=new URLSearchParams(location.search).get('car');if(qp&&cars.some(c=>c.id===qp))car.value=qp}function fillVariants(){const c=C.byId[car.value];variant.innerHTML=c.variants.map(v=>`<option value="${v.id}">${v.label}</option>`).join('');if(!c.variants.some(v=>v.id===c.rep.id))throw new Error(`${c.id}: representative variant missing`);variant.value=c.rep.id;reg.min=c.productionStart||`${taxYear}-01`;if(!reg.value||reg.value<reg.min)reg.value=reg.min;detailLink.href=c.path.replace('./','../../');syncPrice()}function current(){const c=C.byId[car.value],v=c.variants.find(x=>x.id===variant.value);if(!v)throw new Error(`${c.id}: selected variant missing`);return{c,v}}function syncPrice(){const {v}=current(),key=U.fuelKey(v);if(key==='electric'){priceLabelText.textContent='충전단가 (원/kWh)';price.value='';price.placeholder='직접 입력';regLabel.hidden=true;reg.disabled=true;regNote.textContent='전기차는 현재 배기량 기반 차령 경감 입력을 사용하지 않습니다.'}else{priceLabelText.textContent=`${U.getEnergyLabel(v)} 가격 (원/L)`;price.value=String(U.getEnergyPrice(v,C)||'');price.placeholder='';regLabel.hidden=false;reg.disabled=false;regNote.textContent='제작연도에 신규등록된 일반적인 경우 최초 신규등록월을 참고 입력값으로 사용할 수 있습니다. 실제 차령기산일은 예외가 있을 수 있습니다.'}render()}function render(){const {c,v}=current(),km=Math.max(1000,Number(kmEl.value)||20000),key=U.fuelKey(v),t=annualTax(v,reg.value),p=Number(price.value)||0,e=p?Math.round(km/v.combined*p):null,total=e==null?null:t.total+e;autoTax.textContent=fmt(t.auto);eduTax.textContent=fmt(t.edu);tax.textContent=fmt(t.total);discount.textContent=t.discount?Math.round(t.discount*100)+'%':'없음';energy.textContent=e==null?'충전단가 입력':fmt(e);totalEl.textContent=total==null?'충전단가 입력':fmt(total);assumption.textContent=key==='electric'?`${c.model} · ${v.label} · 연 ${km.toLocaleString('ko-KR')}km · 충전단가 사용자 입력`:`${c.model} · ${v.label} · 연 ${km.toLocaleString('ko-KR')}km · ${U.getEnergyLabel(v)} ${Number(price.value).toLocaleString('ko-KR')}원/L · ${C.fuelPriceSource} ${C.fuelPriceAsOf}`}
fillCars();fillVariants();car.addEventListener('change',fillVariants);variant.addEventListener('change',syncPrice);reg.addEventListener('change',render);kmEl.addEventListener('input',render);price.addEventListener('input',render);$('#fuelPriceFoot').textContent=C.fuelPriceStale?`유가 갱신 지연 · 마지막 정상 수신 ${C.fuelPriceAsOf} · ${C.fuelPriceSource}`:`휘발유·경유·LPG 기준값: ${C.fuelPriceSource} · ${C.fuelPriceAsOf}. 전기 충전단가는 사용자 입력입니다.`;render()})();</script></body></html>

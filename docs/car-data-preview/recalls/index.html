<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive"><title>자동차 모델 리콜 공지 | 내차데이터</title><meta name="description" content="국토교통부 자동차리콜센터 공개 공지를 모델별로 검색하고, 모델 공지와 내 차량의 최종 리콜 대상 여부를 분리해 확인합니다."><link rel="canonical" href="https://5ggul.github.io/pm-lab/car-data-preview/recalls/"><link rel="stylesheet" href="../assets/site.css"><link rel="stylesheet" href="../assets/home.css"><link rel="stylesheet" href="../assets/pilot.css"><script src="../assets/static-photo-fallback.js"></script><link rel="stylesheet" href="../assets/clear-ui.css"><link rel="stylesheet" href="../assets/utility.css"></head><body class="clear-site"><header class="db-header"><div class="db-shell"><a class="db-logo" href="../">내차데이터</a><nav class="db-nav"><a href="../cars/">차량</a><a href="../compare/">비교</a><a href="../tools/annual-cost/">1년 유지비</a><a href="./">리콜</a><a href="../data-sources/">출처</a></nav></div></header><main><section class="page-hero"><div class="db-shell"><div class="db-kicker">모델 리콜 공지</div><h1>리콜 정보</h1><p>차종별 리콜 공지를 검색하세요.</p><form class="db-search" action="./" method="get" style="max-width:720px"><input id="q" name="q" placeholder="그랜저, K8, EV6, G80" aria-label="리콜 모델 검색"><button type="submit">검색</button></form><div class="filter-bar" id="modelFilters"></div></div></section><section class="db-section"><div class="db-shell"><div class="db-heading"><div><div class="db-kicker" id="asOf">리콜 공지 기준</div><h2 id="resultTitle">최근 리콜</h2></div></div><div class="recall-grid"><div><div id="recallList" class="recall-list"></div><div id="empty" class="notice" style="display:none;margin-top:20px">검색 결과가 없습니다. 다른 차종명으로 검색해 보세요.</div></div></div></div></section></main><footer class="db-footer"><div class="db-shell"><div>내차데이터</div><div class="db-footer-links"><a href="../about/">소개</a><a href="../methodology/">계산 기준</a><a href="../data-sources/">출처</a><a href="../contact/">문의</a><a href="../privacy/">개인정보처리방침</a><a href="../terms/">이용약관</a></div></div></footer><script src="../assets/catalog-data.js"></script><script>(async function(){const C=CAR_CATALOG,$=s=>document.querySelector(s),params=new URLSearchParams(location.search),raw=(params.get('q')||'').trim(),id=params.get('id');const qEl=$('#q'),asOfEl=$('#asOf'),filtersEl=$('#modelFilters'),titleEl=$('#resultTitle'),listEl=$('#recallList'),emptyEl=$('#empty');qEl.value=raw;try{const data=await fetch('../data/recalls.json').then(r=>{if(!r.ok)throw new Error('recall data load failed');return r.json()});asOfEl.textContent='리콜 공지 기준 '+data.data_as_of.replaceAll('-','.');const filters=[['','전체'],...C.cars.map(c=>[c.model,c.model])];filtersEl.innerHTML=filters.map(([v,l])=>`<a href="./${v?'?q='+encodeURIComponent(v):''}" class="${raw===v||(!raw&&!v)?'active':''}">${l}</a>`).join('');const norm=s=>String(s||'').toLowerCase().replace(/\s+/g,'');let list=data.notices;if(id)list=list.filter(n=>n.id===id);else if(raw){const nq=norm(raw),matched=C.cars.filter(c=>[c.model,...c.aliases].some(a=>norm(a).includes(nq)||nq.includes(norm(a)))).map(c=>c.id);list=list.filter(n=>matched.some(m=>n.models.includes(m))||norm(n.title).includes(nq))}titleEl.textContent=id?(list[0]?.title||'리콜 공지'):raw?raw+' 리콜':'최근 리콜';if(!list.length){emptyEl.style.display='block';return}listEl.innerHTML=list.map(n=>{const names=n.models.map(mid=>C.byId[mid]?.model||mid).join(', ');const modelHref=C.byId[n.models[0]]?.path.replace('./','../')||'../cars/';return `<article class="recall-item" style="grid-template-columns:100px 1fr"><div class="recall-date">${n.date}</div><div><div class="recall-title">${n.title}</div><div class="recall-model">${n.maker} · ${names}</div><p style="font-size:13px;color:#686d75;line-height:1.6;margin:10px 0 0">${n.summary}</p><p style="font-size:12px;color:#686d75;margin:8px 0 0"><strong>대상 범위:</strong> ${n.scope}</p><div class="internal-cta" style="margin-top:12px"><a href="${n.official_url}" target="_blank" rel="noopener">자동차리콜센터 원문</a><a class="light" href="?id=${encodeURIComponent(n.id)}">이 공지만 보기</a><a class="light" href="${modelHref}">차량 상세</a></div></div></article>`}).join('')}catch(e){titleEl.textContent='리콜 데이터를 불러오지 못했습니다';emptyEl.style.display='block';emptyEl.textContent='현재 공지 데이터를 불러오지 못했습니다. 데이터 출처 페이지에서 공식 조회 경로를 확인하세요.'}})();</script></body></html>

<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive"><title>자동차 연비·자동차세·1년 유지비 비교 | 내차데이터</title><meta name="description" content="국산차 두 대와 각 사양을 선택해 표시연비·전비, 신차 기준 연간 정상 자동차세, 연간 유류비·충전비를 같은 조건으로 비교합니다."><link rel="canonical" href="https://5ggul.github.io/pm-lab/car-data-preview/compare/"><link rel="stylesheet" href="../assets/site.css"><link rel="stylesheet" href="../assets/home.css"><style>.variant-row.scenario-active{background:#f7f7f5;font-weight:700}.compare-answer{font-size:18px;line-height:1.55;margin:0 0 18px}.variant-row span{overflow-wrap:anywhere}@media(max-width:560px){.variant-table{overflow-x:visible}.variant-row{grid-template-columns:1.15fr 1fr 1fr!important;gap:8px}.variant-row>*:nth-child(n+4){display:none!important}}</style><script type="application/ld+json">{"@context":"https://schema.org","@type":"WebApplication","name":"자동차 1년 유지비 비교","applicationCategory":"UtilitiesApplication","operatingSystem":"Any","isAccessibleForFree":true}</script></head><body><header class="db-header"><div class="db-shell"><a class="db-logo" href="../">내차데이터</a><nav class="db-nav"><a href="../cars/">차량</a><a href="./">비교</a><a href="../tools/annual-cost/">1년 유지비</a><a href="../recalls/">리콜</a><a href="../data-sources/">출처</a></nav></div></header><main><section class="page-hero"><div class="db-shell"><div class="db-kicker">차량 비교</div><h1>같은 조건으로 비교</h1><p>두 차량의 실제 신고 사양을 고른 뒤 같은 연간 주행거리와 각 연료의 같은 기준일 가격으로 세금+에너지비를 비교합니다.</p></div></section><section class="db-section"><div class="db-shell"><div class="tool-grid"><div class="tool-panel"><h2 style="margin-top:0">비교 조건</h2><div class="tool-fields"><label>차량 A<select id="carA"></select></label><label>사양 A<select id="varA"></select></label><label>차량 B<select id="carB"></select></label><label>사양 B<select id="varB"></select></label><label>연간 주행거리<input id="km" type="number" min="1000" max="100000" step="1000" value="20000" list="kmPresets"><datalist id="kmPresets"><option value="5000"><option value="10000"><option value="15000"><option value="20000"><option value="30000"></datalist></label><label>휘발유 (원/L)<input id="gas" type="number" step="0.01"></label><label>경유 (원/L)<input id="diesel" type="number" step="0.01"></label><label>LPG (원/L)<input id="lpg" type="number" step="0.01"></label><label>전기 충전단가 (원/kWh)<input id="elec" type="number" placeholder="전기차 비교 시 입력"></label></div><p class="notice" id="compareAssumption"></p></div><div class="tool-panel"><p class="compare-answer" id="compareAnswer"></p><div id="compareTable"></div><p class="notice" id="compareConclusion"></p></div></div></div></section><section class="db-section soft"><div class="db-shell"><div class="db-heading"><div><div class="db-kicker">리콜</div><h2>리콜 건수는 우열 점수가 아닙니다.</h2></div><p>리콜은 생산기간·세부 사양에 따라 대상이 달라 비교표의 안전점수로 쓰지 않습니다. 각 모델 공지는 리콜 페이지에서 별도로 확인합니다.</p></div><div class="internal-cta"><a href="../recalls/">모델 리콜 확인</a><a class="light" href="../methodology/">계산 기준</a></div></div></section></main><footer class="db-footer"><div class="db-shell"><div>비교 결과는 선택 사양과 입력 가정에 따른 계산값이며 구매가격 차이는 포함하지 않습니다.</div><div class="db-footer-links"><a href="../cars/">차량</a><a href="../data-sources/">출처</a></div></div></footer><script src="../assets/catalog-data.js"></script><script src="../assets/car-utils.js"></script><script>(function(){const C=CAR_CATALOG,U=CAR_UTILS,$=s=>document.querySelector(s),fmt=n=>n==null?'단가 입력':Math.round(Number(n)).toLocaleString('ko-KR')+'원',cars=C.publicCars||C.cars.filter(c=>c.indexable===true),params=new URLSearchParams(location.search);function fillCars(sel){sel.innerHTML=cars.map(c=>`<option value="${c.id}">${c.maker} ${c.model}</option>`).join('')}function validCar(id,fallback){return cars.some(c=>c.id===id)?id:fallback}fillCars($('#carA'));fillCars($('#carB'));$('#carA').value=validCar(params.get('a'),'grandeur-gn7');$('#carB').value=validCar(params.get('b'),'k8-gl3');$('#gas').value=params.get('gas')||C.gasPrice;$('#diesel').value=params.get('diesel')||C.dieselPrice;$('#lpg').value=params.get('lpg')||C.lpgPrice;$('#elec').value=params.get('elec')||'';$('#km').value=params.get('km')||20000;function fillVars(carSel,varSel,paramId){const c=C.byId[carSel.value];varSel.innerHTML=c.variants.map(v=>`<option value="${v.id}">${v.label}</option>`).join('');const wanted=paramId&&c.variants.some(v=>v.id===paramId)?paramId:c.rep.id;if(!c.variants.some(v=>v.id===wanted))throw new Error(`${c.id}: representative variant missing`);varSel.value=wanted}fillVars($('#carA'),$('#varA'),params.get('av'));fillVars($('#carB'),$('#varB'),params.get('bv'));function selected(carSel,varSel){const c=C.byId[carSel.value],v=c.variants.find(x=>x.id===varSel.value);if(!v)throw new Error(`${c.id}: variant ${varSel.value} missing`);return{c,v}}function price(v){const k=U.fuelKey(v);return k==='gasoline'||k==='hybrid'?Number($('#gas').value):k==='diesel'?Number($('#diesel').value):k==='lpg'?Number($('#lpg').value):Number($('#elec').value)||null}function calc(carSel,varSel,km){const {c,v}=selected(carSel,varSel),p=price(v),tax=U.fuelKey(v)==='electric'?130000:C.taxForCc(v.cc),energy=p?C.energyCost(v,km,p):null;return{c,v,tax,energy,total:energy==null?null:tax+energy}}function energyAt(x,km){const p=price(x.v);return p?C.energyCost(x.v,km,p):null}function updateUrl(a,b,km){const p=new URLSearchParams({a:a.c.id,av:a.v.id,b:b.c.id,bv:b.v.id,km:String(km)});p.set('gas',$('#gas').value);p.set('diesel',$('#diesel').value);p.set('lpg',$('#lpg').value);if($('#elec').value)p.set('elec',$('#elec').value);history.replaceState(null,'','?'+p.toString())}function render(){const km=Math.max(1000,Number($('#km').value)||20000),a=calc($('#carA'),$('#varA'),km),b=calc($('#carB'),$('#varB'),km),scenarios=[10000,20000,30000],scenarioRows=scenarios.map(d=>`<div class="variant-row${d===km?' scenario-active':''}"><strong>${d.toLocaleString('ko-KR')}km 에너지비${d===km?' · 선택':''}</strong><span>${fmt(energyAt(a,d))}</span><span>${fmt(energyAt(b,d))}</span><span></span><span></span></div>`).join(''),customRow=scenarios.includes(km)?'':`<div class="variant-row scenario-active"><strong>선택 ${km.toLocaleString('ko-KR')}km 에너지비</strong><span>${fmt(a.energy)}</span><span>${fmt(b.energy)}</span><span></span><span></span></div>`;$('#compareTable').innerHTML=`<div class="variant-table"><div class="variant-row head"><div>항목</div><div>${a.c.model}</div><div>${b.c.model}</div><div></div><div></div></div><div class="variant-row"><strong>선택 사양</strong><span>${a.v.label}</span><span>${b.v.label}</span><span></span><span></span></div><div class="variant-row"><strong>연료</strong><span>${U.getFuelDisplay(a.v)}</span><span>${U.getFuelDisplay(b.v)}</span><span></span><span></span></div><div class="variant-row"><strong>배기량</strong><span>${a.v.cc?Number(a.v.cc).toLocaleString('ko-KR')+' cc':'전기차'}</span><span>${b.v.cc?Number(b.v.cc).toLocaleString('ko-KR')+' cc':'전기차'}</span><span></span><span></span></div><div class="variant-row"><strong>구동 / 휠</strong><span>${a.v.drive||'—'} · ${a.v.wheel||'—'}인치</span><span>${b.v.drive||'—'} · ${b.v.wheel||'—'}인치</span><span></span><span></span></div><div class="variant-row"><strong>복합 효율</strong><span>${a.v.combined} ${U.getEfficiencyUnit(a.v)}</span><span>${b.v.combined} ${U.getEfficiencyUnit(b.v)}</span><span></span><span></span></div><div class="variant-row"><strong>도심 / 고속</strong><span>${a.v.city??'—'} / ${a.v.highway??'—'} ${U.getEfficiencyUnit(a.v)}</span><span>${b.v.city??'—'} / ${b.v.highway??'—'} ${U.getEfficiencyUnit(b.v)}</span><span></span><span></span></div><div class="variant-row"><strong>1회 충전거리</strong><span>${a.v.range?Number(a.v.range).toLocaleString('ko-KR')+' km':'해당 없음'}</span><span>${b.v.range?Number(b.v.range).toLocaleString('ko-KR')+' km':'해당 없음'}</span><span></span><span></span></div><div class="variant-row"><strong>신차 기준 연간 정상 자동차세</strong><span>${fmt(a.tax)}</span><span>${fmt(b.tax)}</span><span></span><span></span></div>${scenarioRows}${customRow}<div class="variant-row"><strong>세금 + 선택 주행거리 에너지비</strong><span>${fmt(a.total)}</span><span>${fmt(b.total)}</span><span></span><span></span></div></div>`;const diff=a.total==null||b.total==null?null:Math.abs(a.total-b.total);$('#compareAnswer').textContent=diff==null?`연 ${km.toLocaleString('ko-KR')}km 기준 비교입니다. 전기차가 포함되면 충전단가 입력 후 세금+에너지비 차이를 계산합니다.`:`연 ${km.toLocaleString('ko-KR')}km 기준 ${a.c.model} ${a.v.powertrain}과 ${b.c.model} ${b.v.powertrain}의 세금+에너지비 차이는 약 ${Math.round(diff).toLocaleString('ko-KR')}원입니다.`;if(a.total==null||b.total==null)$('#compareConclusion').textContent='충전단가가 필요한 차량은 단가 입력 전 합계를 비교하지 않습니다. 구매가격 차이 미포함.';else{const lower=a.total<=b.total?a:b,higher=a.total<=b.total?b:a;$('#compareConclusion').textContent=`같은 주행거리·같은 기준일 에너지 가격 가정 시 ${lower.c.model} ${lower.v.label}이 ${higher.c.model} ${higher.v.label}보다 연 약 ${Math.round(diff/10000).toLocaleString('ko-KR')}만 원 낮게 계산됩니다. 구매가격 차이 미포함.`}$('#compareAssumption').textContent=`연 ${km.toLocaleString('ko-KR')}km · 유가 ${C.fuelPriceAsOf||C.dataAsOf} ${C.fuelPriceSource||'오피넷 전국 평균'}. 자동차세는 신차 기준 연간 정상세액이며 구매가격·보험·정비·감가·취득세는 포함하지 않습니다.`;updateUrl(a,b,km)}function carChanged(carSel,varSel){fillVars(carSel,varSel,null);render()}$('#carA').onchange=()=>carChanged($('#carA'),$('#varA'));$('#carB').onchange=()=>carChanged($('#carB'),$('#varB'));['varA','varB'].forEach(id=>$('#'+id).addEventListener('change',render));['km','gas','diesel','lpg','elec'].forEach(id=>$('#'+id).addEventListener('input',render));render()})();</script></body></html>

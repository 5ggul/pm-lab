<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive,nosnippet"><title>견적 확인 v41 프리뷰</title><style>:root{--canvas:#F3F0E8;--paper:#FCFBF7;--ink:#171A18;--muted:#777168;--line:#C9C4B8;--accent:#9C2B1A}*{box-sizing:border-box}body{font-family:-apple-system,BlinkMacSystemFont,"Pretendard","Noto Sans KR",sans-serif;background:var(--canvas);color:var(--ink);max-width:980px;margin:auto;padding:28px 22px}h1{font-size:38px;letter-spacing:-.05em}.qrow{border-top:1px solid var(--line);padding:12px 0}.q-fields{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:8px}.tool-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:20px;padding-top:18px;border-top:2px solid var(--ink)}button{min-height:44px;border:1px solid var(--ink);background:var(--paper);font-weight:800;padding:8px 13px}input{width:100%;padding:8px;border:1px solid var(--line);background:var(--paper)}.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}@media(max-width:640px){body{padding:20px 16px}.q-fields{grid-template-columns:1fr 1fr}.tool-actions>*{flex:1 1 45%}}</style></head><body><h1>인테리어 견적서 확인</h1><form data-quote-form><label>지역<input data-context="region" value="서울"></label><div id="rows"></div></form><section data-quote-report><h2>확인 결과</h2><div class="tool-actions"><button type="button">브라우저에 저장</button><button type="button">결과 복사</button></div></section><pre id="test"></pre><script>const items=[['demolition','철거'],['waste','폐기물'],['waterproof','방수'],['bathroom','욕실'],['kitchen','주방'],['wallpaper','도배'],['flooring','바닥'],['carpentry','목공'],['electrical','전기'],['window','샷시'],['management','현장관리비'],['vat','VAT']];document.getElementById('rows').innerHTML=items.map(([id,name],i)=>`<section class="qrow" data-qrow="${id}"><div class="qrow-title"><strong>${name}</strong></div><label><input type="radio" name="state-${id}" value="included" ${i===0?'checked':''}>기재</label><label><input type="radio" name="state-${id}" value="separate">별도</label><label><input type="radio" name="state-${id}" value="missing" ${i!==0?'checked':''}>미기재</label><div class="q-fields"><input data-q-amount value="${i===0?'120':''}"><input data-q-qty value="${i===0?'1':''}"><input data-q-unit value="${i===0?'식':''}"><input data-q-spec value="${i===0?'전체 철거':''}"><input data-q-memo value="${i===0?'샘플':''}"></div></section>`).join('');</script><script src="../assets/quote-check-handoff-v41.js"></script><script>addEventListener('DOMContentLoaded',()=>{const q=InteriorQuoteHandoff41.readCurrentQuote();document.getElementById('test').textContent=JSON.stringify({button:!!document.querySelector('[data-send-to-compare]'),demolition:q.items.demolition,region:q.context.region});});</script></body></html>

<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive,nosnippet"><title>견적 확인 v41 프리뷰</title><style>:root{--canvas:#F3F0E8;--paper:#FCFBF7;--ink:#171A18;--muted:#777168;--line:#C9C4B8;--accent:#9C2B1A}*{box-sizing:border-box}body{font-family:-apple-system,BlinkMacSystemFont,"Pretendard","Noto Sans KR",sans-serif;background:var(--canvas);color:var(--ink);max-width:980px;margin:auto;padding:28px 22px}h1{font-size:38px;letter-spacing:-.05em}.context-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:18px 0;padding:0;border:0}.context-grid label,.q-fields label{display:grid;gap:4px;font-size:12px;color:var(--muted)}.qrow{border-top:1px solid var(--line);padding:12px 0}.q-fields{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:8px}.tool-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:20px;padding-top:18px;border-top:2px solid var(--ink)}button{min-height:44px;border:1px solid var(--ink);background:var(--paper);font-weight:800;padding:8px 13px}input,select{width:100%;min-height:40px;padding:8px;border:1px solid var(--line);background:var(--paper)}.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}#test{white-space:pre-wrap;word-break:break-word;font-size:11px;color:var(--muted)}@media(max-width:640px){body{padding:20px 16px}.context-grid,.q-fields{grid-template-columns:1fr 1fr}.tool-actions>*{flex:1 1 45%}}@media(max-width:380px){.context-grid{grid-template-columns:1fr}}</style></head><body><h1>인테리어 견적서 확인</h1><form data-quote-form><fieldset class="context-grid"><legend class="sr-only">기본 조건</legend><label>공급평수<input data-context="supply" inputmode="decimal" value="32"></label><label>전용평수<input data-context="exclusive" inputmode="decimal" value="25.7"></label><label>건물유형<select data-context="building"><option selected>아파트</option><option>빌라</option><option>주택</option></select></label><label>지역<input data-context="region" value="서울"></label><label>공사범위<select data-context="scope"><option selected>올수리</option><option>부분</option></select></label><label>욕실 수<input data-context="bathrooms" inputmode="numeric" value="2"></label></fieldset><div id="rows"></div></form><section data-quote-report><h2>확인 결과</h2><div class="tool-actions"><button type="button">브라우저에 저장</button><button type="button">결과 복사</button></div></section><pre id="test"></pre><script>const items=[['demolition','철거'],['waste','폐기물'],['waterproof','방수'],['bathroom','욕실'],['kitchen','주방'],['wallpaper','도배'],['flooring','바닥'],['carpentry','목공'],['electrical','전기'],['window','샷시'],['management','현장관리비'],['vat','VAT']];document.getElementById('rows').innerHTML=items.map(([id,name],i)=>`<section class="qrow" data-qrow="${id}"><div class="qrow-title"><strong>${name}</strong></div><label><input type="radio" name="state-${id}" value="included" ${i===0?'checked':''}>기재</label><label><input type="radio" name="state-${id}" value="separate">별도</label><label><input type="radio" name="state-${id}" value="missing" ${i!==0?'checked':''}>미기재</label><div class="q-fields"><label>금액<input data-q-amount type="number" min="0" value="${i===0?'120':''}"></label><label>수량<input data-q-qty inputmode="decimal" value="${i===0?'1':''}"></label><label>단위<input data-q-unit value="${i===0?'식':''}"></label><label>사양<input data-q-spec value="${i===0?'전체 철거':''}"></label><label>메모<input data-q-memo value="${i===0?'샘플':''}"></label></div></section>`).join('');</script><script src="../assets/quote-check-handoff-v41.js"></script><script>addEventListener('DOMContentLoaded',()=>{const q=InteriorQuoteHandoff41.readCurrentQuote();document.getElementById('test').textContent=JSON.stringify({button:!!document.querySelector('[data-send-to-compare]'),context:q.context,demolition:q.items.demolition});});</script></body></html>

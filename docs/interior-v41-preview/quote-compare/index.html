<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive,nosnippet"><title>견적 비교 v41 same-origin 검수</title><style>:root{--canvas:#F3F0E8;--paper:#FCFBF7;--ink:#171A18;--muted:#777168;--line:#C9C4B8;--accent:#9C2B1A}*{box-sizing:border-box}body{font-family:-apple-system,BlinkMacSystemFont,"Pretendard","Noto Sans KR",sans-serif;background:var(--canvas);color:var(--ink);max-width:980px;margin:auto;padding:28px 22px}h1{font-size:38px;letter-spacing:-.05em}.notice{border-left:5px solid var(--accent);background:var(--paper);padding:14px;margin:18px 0}.preview{border-top:2px solid var(--ink);border-bottom:1px solid var(--line);padding:18px 0}.targets{display:flex;gap:8px;flex-wrap:wrap}.targets button,button{min-height:44px;border:1px solid var(--ink);background:var(--paper);font-weight:800;padding:8px 13px}.grid{display:grid;grid-template-columns:160px repeat(3,1fr);border-top:1px solid var(--line);margin-top:20px}.grid>div{padding:10px;border-bottom:1px solid var(--line)}.muted{color:var(--muted);font-size:13px}@media(max-width:640px){body{padding:20px 16px}.grid{grid-template-columns:110px repeat(3,minmax(85px,1fr));overflow:auto;font-size:12px}}</style></head><body><h1>업체 견적 비교</h1><p class="muted">v41 same-origin 저장·handoff 검수 하네스입니다. 실제 운영 데이터는 전송하지 않습니다.</p><div id="status" class="notice">handoff 확인 중</div><section id="preview" class="preview" hidden><h2>가져오기 미리보기</h2><p id="targetText"></p><div class="targets"><button id="apply" type="button">이 칸에 적용</button><button id="cancel" type="button">취소</button></div></section><div id="result"></div><script>(()=>{'use strict';const QUOTE_KEY='interior-quote-v5',HANDOFF_KEY='interior-quote-compare-handoff-v41';const ITEMS=[['demolition','철거'],['waste','폐기물'],['waterproof','방수'],['bathroom','욕실'],['kitchen','주방'],['wallpaper','도배'],['flooring','바닥'],['carpentry','목공'],['electrical','전기'],['window','샷시'],['management','현장관리비'],['vat','VAT']];const status=document.getElementById('status'),preview=document.getElementById('preview'),targetText=document.getElementById('targetText'),result=document.getElementById('result');let handoff=null,quote=null;try{handoff=JSON.parse(localStorage.getItem(HANDOFF_KEY)||'null');quote=JSON.parse(localStorage.getItem(QUOTE_KEY)||'null');}catch{}if(handoff&&quote&&['a','b','c'].includes(handoff.target)){status.textContent='handoff 감지됨 · 자동 적용하지 않음';targetText.textContent=`${handoff.target.toUpperCase()} 업체 칸으로 가져옵니다.`;preview.hidden=false;}else{status.textContent='handoff 없음 · 견적 확인 페이지에서 비교표로 보내기를 실행하세요.';}function render(target){const rows=ITEMS.map(([id,name])=>{const x=quote?.items?.[id]||{};return `<div>${name}</div><div>${target==='a'?(x.amount||'—'):'—'}</div><div>${target==='b'?(x.amount||'—'):'—'}</div><div>${target==='c'?(x.amount||'—'):'—'}</div>`}).join('');result.innerHTML=`<h2>적용 결과</h2><div class="grid"><div>공종</div><div>A</div><div>B</div><div>C</div>${rows}</div>`;}document.getElementById('apply').addEventListener('click',()=>{if(!handoff||!quote)return;render(handoff.target);localStorage.removeItem(HANDOFF_KEY);preview.hidden=true;status.textContent='미리보기 확인 후 적용됨 · handoff 플래그 삭제 완료';});document.getElementById('cancel').addEventListener('click',()=>{localStorage.removeItem(HANDOFF_KEY);preview.hidden=true;status.textContent='가져오기 취소 · 원본 견적 저장값은 유지';});})();</script></body></html>

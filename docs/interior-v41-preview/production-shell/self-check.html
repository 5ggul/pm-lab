<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow,noarchive,nosnippet">
  <title>Interior v41 production-shell self-check</title>
  <style>
    body{font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif;max-width:920px;margin:0 auto;padding:28px 18px;background:#f3f0e8;color:#171a18}
    table{width:100%;border-collapse:collapse;background:#fff}th,td{padding:10px;border:1px solid #c9c4b8;text-align:left;vertical-align:top}code{word-break:break-all}.pass{font-weight:800}.fail{font-weight:800;text-decoration:underline}.muted{color:#6f6a62}
  </style>
</head>
<body>
  <h1>production-shell self-check</h1>
  <p class="muted">고정된 main snapshot, wrapper 경로, 저장키 격리 규칙을 브라우저에서 검증합니다. main의 무관한 bot commit 이동 자체는 실패 조건이 아닙니다.</p>
  <table><thead><tr><th>검사</th><th>결과</th><th>상세</th></tr></thead><tbody id="rows"></tbody></table>
  <p id="summary" aria-live="polite"></p>
  <script>
  (()=>{
    'use strict';
    const rows=document.getElementById('rows');
    const summary=document.getElementById('summary');
    const results=[];
    function add(name,ok,detail=''){
      results.push(ok);
      const tr=document.createElement('tr');
      const a=document.createElement('td');a.textContent=name;
      const b=document.createElement('td');b.textContent=ok?'PASS':'FAIL';b.className=ok?'pass':'fail';
      const c=document.createElement('td');const code=document.createElement('code');code.textContent=detail;c.append(code);
      tr.append(a,b,c);rows.append(tr);
    }
    async function gitBlobSha(text){
      const enc=new TextEncoder();
      const body=enc.encode(text);
      const head=enc.encode(`blob ${body.length}\0`);
      const all=new Uint8Array(head.length+body.length);all.set(head);all.set(body,head.length);
      const digest=new Uint8Array(await crypto.subtle.digest('SHA-1',all));
      return [...digest].map(x=>x.toString(16).padStart(2,'0')).join('');
    }
    function count(hay,needle){return hay.split(needle).length-1;}
    function transformCheck(html,type){
      const finalScript=type==='check'?'../../assets/quote-check-handoff-v41.js':'../../assets/quote-compare-production-adapter-v41.js';
      const guard='../../assets/production-shell-guard-v41.js';
      let out=html
        .replaceAll('href="/pm-lab/interior-cost-preview/quote-check/"','href="../quote-check/"')
        .replaceAll('href="/pm-lab/interior-cost-preview/quote-compare/"','href="../quote-compare/"')
        .replace(/href="\/pm-lab\/interior-cost-preview\/assets\/site-v21-bundle\.css\?v=[^"]+"/,'href="../snapshot-assets/site-v21-bundle.css"')
        .replace(/<script src="\/pm-lab\/interior-cost-preview\/assets\/app-v21-bundle\.js\?v=[^"]+" defer><\/script>/,`<script src="../snapshot-assets/app-v21-bundle.js" defer><\/script><script src="${guard}" defer><\/script><script src="${finalScript}" defer><\/script>`);
      return {out,finalScript,guard};
    }
    async function getText(path){
      return fetch(path,{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error(`${path} ${r.status}`);return r.text();});
    }
    (async()=>{
      try{
        const manifest=await fetch('SNAPSHOT-MANIFEST.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error(`manifest ${r.status}`);return r.json();});
        add('manifest captured commit',manifest.captured_from_commit==='26b8f66b14316743e3bfaff73912a5b15901c48c',manifest.captured_from_commit||'missing');
        add('manifest verified-through commit',/^[0-9a-f]{40}$/.test(manifest.verified_unchanged_through_commit||''),manifest.verified_unchanged_through_commit||'missing');
        add('manifest writer concurrency probe',manifest.entrypoints?.writer_concurrency_probe==='writer-concurrency-probe.html',manifest.entrypoints?.writer_concurrency_probe||'missing');
        const loaded={};
        for(const [path,expected] of Object.entries(manifest.files||{})){
          const text=await getText(path);
          loaded[path]=text;
          const actual=await gitBlobSha(text);
          add(`blob ${path}`,actual===expected,`${actual} / expected ${expected}`);
        }
        const check=loaded['snapshots/quote-check-main.html']||'';
        const compare=loaded['snapshots/quote-compare-main.html']||'';
        add('quote-check 12 qrows',count(check,'data-qrow=')===12,String(count(check,'data-qrow=')));
        add('quote-check context 6',count(check,'data-context=')===6,String(count(check,'data-context=')));
        add('quote-check report marker',check.includes('data-quote-report'),'data-quote-report');
        add('quote-compare 12 rows',count(compare,'data-compare-row=')===12,String(count(compare,'data-compare-row=')));
        add('quote-compare save marker',compare.includes('data-save-compare'),'data-save-compare');

        const tc=transformCheck(check,'check');
        add('quote-check local CSS rewrite',tc.out.includes('../snapshot-assets/site-v21-bundle.css'),'snapshot CSS');
        add('quote-check shell guard injection',tc.out.includes(tc.guard),tc.guard);
        add('quote-check handoff injection',tc.out.includes(tc.finalScript),tc.finalScript);
        add('quote-check load order app→guard→handoff',tc.out.indexOf('../snapshot-assets/app-v21-bundle.js')<tc.out.indexOf(tc.guard)&&tc.out.indexOf(tc.guard)<tc.out.indexOf(tc.finalScript),'app-v21 → guard → handoff');

        const tp=transformCheck(compare,'compare');
        add('quote-compare local app rewrite',tp.out.includes('../snapshot-assets/app-v21-bundle.js'),'snapshot app-v21');
        add('quote-compare shell guard injection',tp.out.includes(tp.guard),tp.guard);
        add('quote-compare adapter injection',tp.out.includes(tp.finalScript),tp.finalScript);
        add('quote-compare load order app→guard→adapter',tp.out.indexOf('../snapshot-assets/app-v21-bundle.js')<tp.out.indexOf(tp.guard)&&tp.out.indexOf(tp.guard)<tp.out.indexOf(tp.finalScript),'app-v21 → guard → adapter');

        const checkWrapper=await getText('quote-check/');
        const compareWrapper=await getText('quote-compare/');
        add('quote-check wrapper pinned snapshot path',checkWrapper.includes('../snapshots/quote-check-main.html'),'../snapshots/quote-check-main.html');
        add('quote-compare wrapper pinned snapshot path',compareWrapper.includes('../snapshots/quote-compare-main.html'),'../snapshots/quote-compare-main.html');
        add('quote-check wrapper guard marker',checkWrapper.includes('../../assets/production-shell-guard-v41.js'),'guard marker');
        add('quote-compare wrapper guard marker',compareWrapper.includes('../../assets/production-shell-guard-v41.js'),'guard marker');

        const handoff=await getText('../assets/quote-check-handoff-v41.js');
        const adapter=await getText('../assets/quote-compare-production-adapter-v41.js');
        const shellGuard=await getText('../assets/production-shell-guard-v41.js');
        add('quote-check production storage guard',handoff.includes('guardProductionQuoteStorage'),'guardProductionQuoteStorage');
        add('quote-check save key button guarded',handoff.includes("'[data-save-quote]'"),'[data-save-quote]');
        add('quote-check reset key button guarded',handoff.includes("'[data-reset-quote]'"),'[data-reset-quote]');
        add('quote-check relative compare navigation',handoff.includes("new URL('../quote-compare/',location.href)"),'../quote-compare/');
        add('writer Web Locks serialization',handoff.includes('globalThis.navigator?.locks')&&handoff.includes("mode:'exclusive'"),'navigator.locks exclusive');
        add('writer named lock',handoff.includes("LOCK_NAME='interior-v41-handoff-write-v41'"),'interior-v41-handoff-write-v41');
        add('writer fresh pending blocker',handoff.includes('if(currentPendingPair())')&&handoff.includes('이미 비교표 전송이 진행 중입니다.'),'fresh pending blocks second send');
        add('writer ownership-aware failure cleanup',handoff.includes('clearOwnedTransfer(source,handoff)'),'clearOwnedTransfer(source,handoff)');
        add('writer production fail-closed without locks',handoff.includes('다중 탭 전송 보호를 사용할 수 없습니다.'),'Web Locks unavailable → reject');
        add('quote-compare production button guard',adapter.includes('guardProductionButtons'),'guardProductionButtons');
        add('quote-compare atomic commit helper',adapter.includes('commitReview(')&&adapter.includes('hasTargetFields('),'commitReview + hasTargetFields');
        add('quote-compare save failure keeps apply pending',adapter.includes('적용하지 않았습니다.')&&adapter.indexOf('commitReview(target')<adapter.indexOf('applyFlatToDom(committed.incoming'),'save before DOM mutation');
        add('shell search navigation guard',shellGuard.includes('[data-site-search]')&&shellGuard.includes('stopImmediatePropagation'),'site search capture guard');
        add('shell non-workflow link guard',shellGuard.includes("PROD_PREFIX='/pm-lab/interior-cost-preview/'"),'production prefix guard');
      }catch(err){add('self-check execution',false,String(err?.message||err));}
      const ok=results.filter(Boolean).length;
      summary.textContent=`${ok} / ${results.length} PASS`;
      summary.className=ok===results.length?'pass':'fail';
    })();
  })();
  </script>
</body>
</html>

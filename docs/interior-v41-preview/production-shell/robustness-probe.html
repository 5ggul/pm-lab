<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow,noarchive,nosnippet">
  <title>Interior v41 numeric / autosave / storage isolation robustness probe</title>
  <style>
    body{font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif;max-width:920px;margin:0 auto;padding:28px 18px;background:#f3f0e8;color:#171a18}
    table{width:100%;border-collapse:collapse;background:#fff}th,td{border:1px solid #c9c4b8;padding:9px;text-align:left}.pass{font-weight:800}.fail{font-weight:800;text-decoration:underline}iframe{width:100%;height:320px;border:1px solid #c9c4b8;margin-top:16px}iframe[hidden]{display:none}
  </style>
</head>
<body>
  <h1>numeric / autosave / storage isolation robustness probe</h1>
  <p>비정상 금액, autosave 실패, production storage read-mask의 browser realm 동작을 검사합니다.</p>
  <button id="run" type="button">검사 실행</button>
  <p id="summary" role="status" aria-live="polite"></p>
  <table><thead><tr><th>검사</th><th>결과</th><th>상세</th></tr></thead><tbody id="rows"></tbody></table>
  <iframe id="frame" title="robustness probe"></iframe>
  <iframe id="mask-frame" title="storage read mask probe" hidden></iframe>
<script>
(()=>{
  'use strict';
  const Q='interior-quote-source-v41',H='interior-quote-compare-handoff-v41',R='interior-quote-compare-shell-v41';
  const PROD=['interior-quote-v5','interior-compare-v5','interior-compare-v6'];
  const ITEMS=['demolition','waste','waterproof','bathroom','kitchen','wallpaper','flooring','carpentry','electrical','window','management','vat'];
  const frame=document.getElementById('frame'),maskFrame=document.getElementById('mask-frame'),rows=document.getElementById('rows'),summary=document.getElementById('summary');
  const raw=k=>{try{return localStorage.getItem(k)}catch{return null}};
  const putRaw=(k,v)=>{try{v==null?localStorage.removeItem(k):localStorage.setItem(k,v)}catch{}};
  const waitFor=async(fn,ms=6000)=>{const start=Date.now();while(Date.now()-start<ms){const v=fn();if(v)return v;await new Promise(r=>setTimeout(r,50));}throw new Error('timeout')};
  function add(name,ok,detail=''){const tr=document.createElement('tr');tr.innerHTML=`<td></td><td class="${ok?'pass':'fail'}">${ok?'PASS':'FAIL'}</td><td><code></code></td>`;tr.children[0].textContent=name;tr.children[2].firstChild.textContent=detail;rows.append(tr);return ok;}
  function dispatch(el){el.dispatchEvent(new Event('input',{bubbles:true}));el.dispatchEvent(new Event('change',{bubbles:true}));}
  function quoteWithAmounts(values){const items={};ITEMS.forEach((id,i)=>items[id]={name:id,state:'included',amount:String(values[i]??''),qty:'',unit:'',spec:'',memo:''});return {context:{},items};}
  async function load(path,apiName){frame.src=`${path}?robustness=${Date.now()}`;return waitFor(()=>frame.contentWindow?.[apiName]?frame.contentWindow:null);}
  async function runReadMaskProbe(){
    const maskUrl=new URL('../assets/production-storage-read-mask-v41.js',location.href).href;
    const src=`<!doctype html><meta charset="utf-8"><script>
      window.__INTERIOR_V41_STORAGE_MASK_TEST__=true;
      window.__nativeGet=Storage.prototype.getItem;
      window.__nativeSet=Storage.prototype.setItem;
      window.__nativeRemove=Storage.prototype.removeItem;
      window.__setCalls=[];window.__removeCalls=[];
      window.__fakeGet=function(k){return 'sentinel:'+k};
      window.__fakeSet=function(k,v){window.__setCalls.push(String(k));};
      window.__fakeRemove=function(k){window.__removeCalls.push(String(k));};
      Storage.prototype.getItem=window.__fakeGet;
      Storage.prototype.setItem=window.__fakeSet;
      Storage.prototype.removeItem=window.__fakeRemove;
    <\/script><script src="${maskUrl}"><\/script><script src="${maskUrl}"><\/script><script>
      localStorage.setItem('interior-quote-v5','blocked');
      localStorage.setItem('interior-quote-source-v41','review');
      localStorage.removeItem('interior-compare-v6');
      localStorage.removeItem('interior-quote-source-v41');
      window.__maskBefore={
        q:localStorage.getItem('interior-quote-v5'),
        c5:localStorage.getItem('interior-compare-v5'),
        c6:localStorage.getItem('interior-compare-v6'),
        review:localStorage.getItem('interior-quote-source-v41'),
        active:window.InteriorProductionStorageReadMask41?.active===true,
        writeShield:window.InteriorProductionStorageReadMask41?.writeShieldActive===true,
        setCalls:[...window.__setCalls],removeCalls:[...window.__removeCalls]
      };
      addEventListener('DOMContentLoaded',()=>{
        const setBefore=window.__setCalls.length,removeBefore=window.__removeCalls.length;
        localStorage.setItem('interior-compare-v5','blocked-after');
        localStorage.removeItem('interior-compare-v6');
        localStorage.setItem('interior-quote-source-v41','review-after');
        localStorage.removeItem('interior-quote-source-v41');
        window.__maskAfter={
          q:localStorage.getItem('interior-quote-v5'),
          review:localStorage.getItem('interior-quote-source-v41'),
          active:window.InteriorProductionStorageReadMask41?.active===false,
          writeShield:window.InteriorProductionStorageReadMask41?.writeShieldActive===true,
          restored:Storage.prototype.getItem===window.__fakeGet,
          protectedSetBlocked:window.__setCalls.length===setBefore+1&&window.__setCalls.at(-1)==='interior-quote-source-v41',
          protectedRemoveBlocked:window.__removeCalls.length===removeBefore+1&&window.__removeCalls.at(-1)==='interior-quote-source-v41'
        };
        window.__maskDone=true;
      });
    <\/script>`;
    maskFrame.srcdoc=src;
    const win=await waitFor(()=>maskFrame.contentWindow?.__maskDone?maskFrame.contentWindow:null);
    return {before:win.__maskBefore,after:win.__maskAfter};
  }
  document.getElementById('run').addEventListener('click',async()=>{
    rows.textContent='';summary.textContent='검사 중…';
    const originals={q:raw(Q),h:raw(H),r:raw(R),prod:Object.fromEntries(PROD.map(k=>[k,raw(k)]))};
    const results=[];
    try{
      const mask=await runReadMaskProbe();
      const maskActive=mask.before?.q===null&&mask.before?.c5===null&&mask.before?.c6===null&&mask.before?.review==='sentinel:interior-quote-source-v41'&&mask.before?.active===true&&mask.before?.writeShield===true&&JSON.stringify(mask.before?.setCalls)===JSON.stringify(['interior-quote-source-v41'])&&JSON.stringify(mask.before?.removeCalls)===JSON.stringify(['interior-quote-source-v41']);
      results.push(add('storage isolation hides production reads and blocks production writes before DOMContentLoaded',maskActive,JSON.stringify(mask.before)));
      const maskRestored=mask.after?.q==='sentinel:interior-quote-v5'&&mask.after?.review==='sentinel:interior-quote-source-v41'&&mask.after?.active===true&&mask.after?.writeShield===true&&mask.after?.restored===true&&mask.after?.protectedSetBlocked===true&&mask.after?.protectedRemoveBlocked===true;
      results.push(add('storage isolation restores reads but keeps production write shield after DOMContentLoaded',maskRestored,JSON.stringify(mask.after)));

      putRaw(Q,null);putRaw(H,null);putRaw(R,null);
      const compareWin=await load('quote-compare/','InteriorProductionCompareAdapter41');
      const api=compareWin.InteriorProductionCompareAdapter41;
      results.push(add('compare adapter API loaded',!!api,'InteriorProductionCompareAdapter41'));
      results.push(add('normal amount accepted',api.amountCheck('120.5').ok===true,'120.5'));
      results.push(add('negative amount rejected',api.amountCheck('-1').ok===false,'-1'));
      results.push(add('Infinity amount rejected',api.amountCheck('1e309').ok===false,'1e309'));
      results.push(add('unsafe integer amount rejected',api.amountCheck(String(Number.MAX_SAFE_INTEGER+1)).ok===false,'MAX_SAFE_INTEGER + 1'));
      let quoteRejected=false;try{api.validateQuoteAmounts(quoteWithAmounts([Number.MAX_SAFE_INTEGER,1]));}catch{quoteRejected=true;}
      results.push(add('overflowing quote total rejected',quoteRejected,'MAX_SAFE_INTEGER + 1 aggregate'));

      const aAmounts=[...frame.contentDocument.querySelectorAll('[data-vendor="a"][data-amount]')];
      aAmounts[0].value=String(Number.MAX_SAFE_INTEGER);dispatch(aAmounts[0]);
      aAmounts[1].value='1';dispatch(aAmounts[1]);
      results.push(add('manual aggregate overflow input cleared',aAmounts[1].value==='',`second=${aAmounts[1].value||'(blank)'}`));
      const compareText=frame.contentDocument.body.textContent||'';
      const compareStyle=[...frame.contentDocument.querySelectorAll('[style]')].map(x=>x.getAttribute('style')||'').join(' ');
      results.push(add('compare DOM has no Infinity/NaN output',!/∞|NaN/.test(compareText+compareStyle),'no ∞ / NaN'));

      const review={version:1,flat:{sentinel:'before'},vendors:{a:null,b:null,c:null},updatedAt:'before'};
      const before=JSON.stringify(review);
      const storageProto=compareWin.Storage.prototype;
      const originalSet=storageProto.setItem;
      let failureThrown=false,prototypeRestored=false;
      try{
        storageProto.setItem=function(key,value){if(key===R)throw new compareWin.DOMException('forced review write failure','QuotaExceededError');return originalSet.call(this,key,value);};
        try{api.commitAutosave(review,frame.contentDocument.querySelector('[data-compare-table]'));}catch{failureThrown=true;}
      }finally{
        storageProto.setItem=originalSet;
        prototypeRestored=storageProto.setItem===originalSet;
      }
      results.push(add('forced autosave failure observed',failureThrown,'iframe Storage.prototype forced failure'));
      results.push(add('autosave failure keeps in-memory review unchanged',JSON.stringify(review)===before,'review object unchanged'));
      results.push(add('iframe Storage.prototype restored',prototypeRestored,'compare realm prototype restored'));
      api.commitAutosave(review,frame.contentDocument.querySelector('[data-compare-table]'));
      results.push(add('autosave success advances in-memory review',review.flat&&Object.keys(review.flat).length>1&&review.updatedAt!=='before','review replaced only after save'));

      putRaw(Q,null);putRaw(H,null);
      const checkWin=await load('quote-check/','InteriorQuoteHandoff41');
      const qapi=checkWin.InteriorQuoteHandoff41;
      results.push(add('quote handoff amount API loaded',!!qapi?.amountCheck,'InteriorQuoteHandoff41.amountCheck'));
      const qAmounts=[...frame.contentDocument.querySelectorAll('[data-q-amount]')];
      qAmounts[0].value='-1';dispatch(qAmounts[0]);
      results.push(add('quote negative input cleared before app calculation',qAmounts[0].value==='',`value=${qAmounts[0].value||'(blank)'}`));
      qAmounts[0].value=String(Number.MAX_SAFE_INTEGER);dispatch(qAmounts[0]);qAmounts[1].value='1';dispatch(qAmounts[1]);
      results.push(add('quote aggregate overflow input cleared',qAmounts[1].value==='',`second=${qAmounts[1].value||'(blank)'}`));

      const prodSame=PROD.every(k=>raw(k)===originals.prod[k]);
      results.push(add('production-named storage unchanged',prodSame,PROD.join(', ')));
    }catch(err){results.push(add('probe execution',false,String(err?.message||err)));}
    finally{
      putRaw(Q,originals.q);putRaw(H,originals.h);putRaw(R,originals.r);for(const k of PROD)putRaw(k,originals.prod[k]);
      maskFrame.src='about:blank';
    }
    const ok=results.filter(Boolean).length;summary.textContent=`${ok} / ${results.length} PASS`;summary.className=ok===results.length?'pass':'fail';
  });
})();
</script>
</body>
</html>

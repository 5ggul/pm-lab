<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow,noarchive,nosnippet">
  <title>Interior v41 storage inspector</title>
  <style>
    body{font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif;max-width:900px;margin:0 auto;padding:28px 18px;background:#f3f0e8;color:#171a18}
    h1{font-size:28px}table{width:100%;border-collapse:collapse;background:#fff}th,td{border:1px solid #c9c4b8;padding:9px;text-align:left;vertical-align:top}code{word-break:break-all}.ok{font-weight:800}.bad{font-weight:800;text-decoration:underline}.actions{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}button,a{min-height:42px;padding:9px 12px;border:1px solid #171a18;background:#fff;color:#171a18;text-decoration:none;font:inherit;font-weight:700;cursor:pointer}.muted{color:#6f6a62;font-size:13px}
  </style>
</head>
<body>
  <h1>production-shell storage inspector</h1>
  <p class="muted">운영 이름의 저장키는 읽기만 하고 수정하지 않습니다. 검수용 키만 별도 버튼으로 삭제할 수 있습니다.</p>
  <div class="actions">
    <button id="baseline" type="button">운영 키 기준점 기록</button>
    <button id="compare" type="button">기준점과 비교</button>
    <button id="refresh" type="button">현재 상태 새로고침</button>
    <button id="clear-review" type="button">검수용 키만 삭제</button>
    <a href="index.html">진입점으로</a>
  </div>
  <p id="summary" role="status" aria-live="polite"></p>
  <table>
    <thead><tr><th>키</th><th>구분</th><th>존재</th><th>길이</th><th>SHA-256</th></tr></thead>
    <tbody id="rows"></tbody>
  </table>
  <script>
  (()=>{
    'use strict';
    const PROD=['interior-quote-v5','interior-compare-v5','interior-compare-v6'];
    const REVIEW=['interior-quote-source-v41','interior-quote-compare-handoff-v41','interior-quote-compare-state-v41','interior-quote-compare-shell-v41'];
    const BASELINE_KEY='interior-v41-storage-baseline-session';
    const rows=document.getElementById('rows');
    const summary=document.getElementById('summary');
    async function sha256(value){
      if(value==null)return null;
      const bytes=new TextEncoder().encode(value);
      const digest=new Uint8Array(await crypto.subtle.digest('SHA-256',bytes));
      return [...digest].map(x=>x.toString(16).padStart(2,'0')).join('');
    }
    async function snapshot(keys){
      const out={};
      for(const key of keys){
        let value=null;
        try{value=localStorage.getItem(key);}catch{}
        out[key]={exists:value!==null,length:value?.length||0,sha:await sha256(value)};
      }
      return out;
    }
    async function render(){
      rows.textContent='';
      const state=await snapshot([...PROD,...REVIEW]);
      for(const key of [...PROD,...REVIEW]){
        const item=state[key];
        const tr=document.createElement('tr');
        for(const text of [key,PROD.includes(key)?'운영 이름 · 읽기 전용': '검수 전용',item.exists?'있음':'없음',String(item.length),item.sha||'—']){
          const td=document.createElement('td');
          const code=document.createElement('code');code.textContent=text;td.append(code);tr.append(td);
        }
        rows.append(tr);
      }
      return state;
    }
    document.getElementById('baseline').addEventListener('click',async()=>{
      const state=await snapshot(PROD);
      try{sessionStorage.setItem(BASELINE_KEY,JSON.stringify(state));summary.textContent='운영 이름 3개 키의 현재 존재 여부/해시를 sessionStorage 기준점으로 기록했습니다.';summary.className='ok';}catch{summary.textContent='기준점 기록 실패';summary.className='bad';}
      await render();
    });
    document.getElementById('compare').addEventListener('click',async()=>{
      let before=null;
      try{before=JSON.parse(sessionStorage.getItem(BASELINE_KEY)||'null');}catch{}
      if(!before){summary.textContent='먼저 운영 키 기준점을 기록하세요.';summary.className='bad';return;}
      const after=await snapshot(PROD);
      const changed=PROD.filter(k=>JSON.stringify(before[k])!==JSON.stringify(after[k]));
      summary.textContent=changed.length?`변경 감지: ${changed.join(', ')}`:'PASS · 운영 이름 3개 키의 존재 여부/해시가 기준점과 동일합니다.';
      summary.className=changed.length?'bad':'ok';
      await render();
    });
    document.getElementById('refresh').addEventListener('click',render);
    document.getElementById('clear-review').addEventListener('click',async()=>{
      for(const key of REVIEW){try{localStorage.removeItem(key);}catch{}}
      summary.textContent='검수 전용 키만 삭제했습니다. 운영 이름 키는 수정하지 않았습니다.';summary.className='ok';
      await render();
    });
    render();
  })();
  </script>
</body>
</html>
